Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - AdminActorsStack
        - AWSCloud

    # ─────────────────────────────────────────────────────────────
    # CONSOLE ACTORS & ENTERPRISE RBAC PERSONAS
    # ─────────────────────────────────────────────────────────────
    AdminActorsStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - SuperAdminActor

    SuperAdminActor:
      Type: AWS::Diagram::Resource
      Preset: "User"
      Title: "SaaS Super Admin\n(Role: SuperAdmin · Passkeys / MFA)\nFull Lifecycle, OCC & FinOps"

    # ─────────────────────────────────────────────────────────────
    # AWS CLOUD ENVIRONMENT
    # ─────────────────────────────────────────────────────────────
    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: vertical
      Title: "AWS Cloud"
      Children:
        - EdgeIngressStack
        - ConsoleCoreRegion

    # Edge Ingress & Distribution Layer
    EdgeIngressStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - Route53DNS
        - ACMCert
        - WAFProtection
        - CloudFrontDist

    Route53DNS:
      Type: AWS::Route53
      Title: "Amazon Route 53\n(admin.png261.dev DNS)"

    ACMCert:
      Type: AWS::Diagram::Resource
      Preset: "AWS Certificate Manager (ACM)"
      Title: "AWS ACM\n(Wildcard TLS 1.3 Certificate)"

    WAFProtection:
      Type: AWS::WAFv2
      Title: "AWS WAFv2\n(WebACL Rate Limit & OWASP)"

    CloudFrontDist:
      Type: AWS::CloudFront
      Title: "Amazon CloudFront\n(admin.png261.dev CDN Edge)\nSPA Fallback & /api* Routing"

    # Region with Console Services & Managed SaaS Fleet
    ConsoleCoreRegion:
      Type: AWS::Region
      Title: "AWS Region (ap-southeast-1)"
      Direction: horizontal
      Children:
        - ConsolePlatformStack
        - ManagedFleetStack

    # SaaS Control Plane Services
    ConsolePlatformStack:
      Type: AWS::Diagram::VerticalStack
      Children:
        - WebHostingAndAuthRow
        - OrchestrationRow
        - StateAndComplianceRow
        - TelemetryRow

    WebHostingAndAuthRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - AdminWebS3Bucket
        - CognitoUserPool
        - AdminUsersTable

    AdminWebS3Bucket:
      Type: AWS::S3::Bucket
      Title: "Amazon S3 Admin Web\n(React 18 SPA + Smart Polling)\nPage Visibility API Auto-Pause"

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Title: "Cognito & WebAuthn Passkeys\n(Biometric FIDO2 & TOTP MFA)\nSecure Session Auth"

    AdminUsersTable:
      Type: AWS::DynamoDB::Table
      Title: "DynamoDB Admin Users\n(PBKDF2 Hashes & Passkey Credentials)"

    OrchestrationRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - StepFunctionsMicroWorkflows
        - StepFunctionsExecutionRole
        - BackendApiHandler
        - AsyncOccJobEngine

    StepFunctionsMicroWorkflows:
      Type: AWS::StepFunctions::StateMachine
      Title: "Step Functions Workflows\n(Provision, Suspend, Resume,\nDeprovision with Saga Rollback)"

    StepFunctionsExecutionRole:
      Type: AWS::IAM::Role
      Title: "Step Functions IAM Role\n(Least Privilege Micro-Workflows)"

    BackendApiHandler:
      Type: AWS::Diagram::Resource
      Preset: "Application Load Balancer"
      Title: "Control Plane API Origin\n(HttpOnly saas_admin_session\n& Modular Lambda Routers)"

    AsyncOccJobEngine:
      Type: AWS::Diagram::Resource
      Preset: "Amazon EventBridge"
      Title: "Async OCC Job Engine\n(Non-Blocking Commands\n& Real-Time Execution Polling)"

    StateAndComplianceRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - TenantRegistryTable
        - AuditLogsTable
        - AuditLogGroup

    TenantRegistryTable:
      Type: AWS::DynamoDB::Table
      Title: "DynamoDB Tenant Registry\n(Lifecycle State, Quotas & Domains)"

    AuditLogsTable:
      Type: AWS::DynamoDB::Table
      Title: "DynamoDB Audit Logs\n(Immutable 1-Year TTL Ledger)"

    AuditLogGroup:
      Type: AWS::Diagram::Resource
      Preset: "Logs"
      Title: "CloudWatch Audit Log Group\n(/aws/audit/control-plane 365d)"

    TelemetryRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - CloudWatchDashboard
        - SyntheticsCanaryMonitor
        - SSMParams

    CloudWatchDashboard:
      Type: AWS::CloudWatch
      Title: "CloudWatch Dashboard & EMF\n(Real-Time Tenant Telemetry)"

    SyntheticsCanaryMonitor:
      Type: AWS::Diagram::Resource
      Preset: "Synthetics"
      Title: "Synthetics Canary Monitor\n(24/7 Endpoint Probes & SLA)"

    SSMParams:
      Type: AWS::SSM::Parameter
      Title: "SSM Parameter Store\n(/nextcloud/prod/control-plane/*)"

    # Managed Nextcloud Fleet (Target Infrastructure Managed by Console)
    ManagedFleetStack:
      Type: AWS::Diagram::VerticalStack
      Children:
        - FleetComputeRow
        - FleetStorageRow

    FleetComputeRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ECSFleet
        - RDSFleet

    ECSFleet:
      Type: AWS::Diagram::Resource
      Preset: "AWS Fargate"
      Title: "Amazon ECS Fargate Fleet\n(AWS Graviton ARM64 · SOCI Start)\ndesiredCount: 0 (Suspend) / 1 (Active)"

    RDSFleet:
      Type: AWS::RDS::DBInstance
      Title: "Amazon RDS PostgreSQL 16\n(RDS Proxy Pooled Connections)\nDedicated Catalogs: nc_acme, nc_marvel"

    FleetStorageRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - S3VaultFleet
        - EFSConfigFleet

    S3VaultFleet:
      Type: AWS::S3::Bucket
      Title: "Amazon S3 Vault Bucket\n(Intelligent-Tiering · 180d Glacier)\nQuota Enforcement & Lifecycle"

    EFSConfigFleet:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Elastic File System (Amazon EFS)"
      Title: "Amazon EFS Config Store\n(30d IA · 90d Archive Lifecycle)\nDedicated Access Points"

  # ─────────────────────────────────────────────────────────────
  # RELATIONSHIPS & OPERATIONAL INTERACTIONS
  # ─────────────────────────────────────────────────────────────
  Links:
    # Admin User Ingress -> DNS & CDN
    - Source: SuperAdminActor
      SourcePosition: S
      Target: Route53DNS
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: Route53DNS
      SourcePosition: E
      Target: WAFProtection
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: WAFProtection
      SourcePosition: E
      Target: CloudFrontDist
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # CloudFront -> Web Assets & Backend API
    - Source: CloudFrontDist
      SourcePosition: S
      Target: AdminWebS3Bucket
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: CloudFrontDist
      SourcePosition: SE
      Target: BackendApiHandler
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Auth flow
    - Source: AdminWebS3Bucket
      SourcePosition: E
      Target: CognitoUserPool
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: CognitoUserPool
      SourcePosition: E
      Target: AdminUsersTable
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Backend API -> Step Functions & Audit
    - Source: BackendApiHandler
      SourcePosition: W
      Target: StepFunctionsMicroWorkflows
      TargetPosition: E
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: BackendApiHandler
      SourcePosition: E
      Target: AsyncOccJobEngine
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: BackendApiHandler
      SourcePosition: S
      Target: AuditLogsTable
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: BackendApiHandler
      SourcePosition: S
      Target: AuditLogGroup
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Step Functions Execution & IAM Role
    - Source: StepFunctionsExecutionRole
      SourcePosition: W
      Target: StepFunctionsMicroWorkflows
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: S
      Target: TenantRegistryTable
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: S
      Target: CloudWatchDashboard
      TargetPosition: NW
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Step Functions Lifecycle Operations on Managed Fleet
    - Source: StepFunctionsMicroWorkflows
      SourcePosition: E
      Target: ECSFleet
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: E
      Target: RDSFleet
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: E
      Target: S3VaultFleet
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: E
      Target: EFSConfigFleet
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Async OCC Engine -> ECS Fleet
    - Source: AsyncOccJobEngine
      SourcePosition: E
      Target: ECSFleet
      TargetPosition: NW
      TargetArrowHead:
        Type: Open
      Type: orthogonal
