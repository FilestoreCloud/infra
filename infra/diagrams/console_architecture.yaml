Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - AdminActorsStack
        - AWSCloud

    # ─────────────────────────────────────────────────────────────
    # CONSOLE ACTORS & ENTERPRISE RBAC PERSONAS
    # ─────────────────────────────────────────────────────────────
    AdminActorsStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - SuperAdminActor

    SuperAdminActor:
      Type: AWS::Diagram::Resource
      Preset: "User"
      Title: "Super Admin"

    # ─────────────────────────────────────────────────────────────
    # AWS CLOUD ENVIRONMENT
    # ─────────────────────────────────────────────────────────────
    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: vertical
      Title: "AWS Cloud"
      Children:
        - EdgeIngressStack
        - ConsoleCoreRegion

    # Edge Ingress & Distribution Layer
    EdgeIngressStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - Route53DNS
        - ACMCert
        - WAFProtection
        - CloudFrontDist

    Route53DNS:
      Type: AWS::Route53
      Title: "Amazon Route 53"

    ACMCert:
      Type: AWS::Diagram::Resource
      Preset: "AWS Certificate Manager (ACM)"
      Title: "AWS Certificate Manager"

    WAFProtection:
      Type: AWS::WAFv2
      Title: "AWS WAF"

    CloudFrontDist:
      Type: AWS::CloudFront
      Title: "Amazon CloudFront"

    # Region with Console Services & Managed SaaS Fleet
    ConsoleCoreRegion:
      Type: AWS::Region
      Title: "AWS Region (ap-southeast-1)"
      Direction: horizontal
      Children:
        - ConsolePlatformStack
        - ManagedFleetStack

    # SaaS Control Plane Services
    ConsolePlatformStack:
      Type: AWS::Diagram::VerticalStack
      Children:
        - WebHostingAndAuthRow
        - OrchestrationRow
        - StateAndComplianceRow
        - TelemetryRow

    WebHostingAndAuthRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - AdminWebS3Bucket
        - CognitoUserPool
        - AdminUsersTable

    AdminWebS3Bucket:
      Type: AWS::S3::Bucket
      Title: "Amazon S3"

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Title: "Amazon Cognito"

    AdminUsersTable:
      Type: AWS::DynamoDB::Table
      Title: "Amazon DynamoDB"

    OrchestrationRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - StepFunctionsMicroWorkflows
        - StepFunctionsExecutionRole
        - BackendApiHandler
        - AsyncOccJobEngine

    StepFunctionsMicroWorkflows:
      Type: AWS::StepFunctions::StateMachine
      Title: "AWS Step Functions"

    StepFunctionsExecutionRole:
      Type: AWS::IAM::Role
      Title: "AWS IAM"

    BackendApiHandler:
      Type: AWS::Diagram::Resource
      Preset: "Application Load Balancer"
      Title: "Application Load Balancer"

    AsyncOccJobEngine:
      Type: AWS::Diagram::Resource
      Preset: "Amazon EventBridge"
      Title: "Amazon EventBridge"

    StateAndComplianceRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - TenantRegistryTable
        - AuditLogsTable
        - AuditLogGroup

    TenantRegistryTable:
      Type: AWS::DynamoDB::Table
      Title: "Amazon DynamoDB"

    AuditLogsTable:
      Type: AWS::DynamoDB::Table
      Title: "Amazon DynamoDB"

    AuditLogGroup:
      Type: AWS::Diagram::Resource
      Preset: "Logs"
      Title: "Amazon CloudWatch Logs"

    TelemetryRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - CloudWatchDashboard
        - SyntheticsCanaryMonitor
        - SSMParams

    CloudWatchDashboard:
      Type: AWS::CloudWatch
      Title: "Amazon CloudWatch"

    SyntheticsCanaryMonitor:
      Type: AWS::Diagram::Resource
      Preset: "Synthetics"
      Title: "Amazon CloudWatch Synthetics"

    SSMParams:
      Type: AWS::SSM::Parameter
      Title: "AWS Systems Manager"

    # Managed Nextcloud Fleet (Target Infrastructure Managed by Console)
    ManagedFleetStack:
      Type: AWS::Diagram::VerticalStack
      Children:
        - FleetComputeRow
        - FleetStorageRow

    FleetComputeRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ECSFleet
        - RDSFleet

    ECSFleet:
      Type: AWS::Diagram::Resource
      Preset: "AWS Fargate"
      Title: "Amazon ECS"

    RDSFleet:
      Type: AWS::RDS::DBInstance
      Title: "Amazon RDS"

    FleetStorageRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - S3VaultFleet
        - EFSConfigFleet

    S3VaultFleet:
      Type: AWS::S3::Bucket
      Title: "Amazon S3"

    EFSConfigFleet:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Elastic File System (Amazon EFS)"
      Title: "Amazon EFS"

  # ─────────────────────────────────────────────────────────────
  # RELATIONSHIPS & OPERATIONAL INTERACTIONS
  # ─────────────────────────────────────────────────────────────
  Links:
    # Admin User Ingress -> DNS & CDN
    - Source: SuperAdminActor
      SourcePosition: S
      Target: Route53DNS
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: Route53DNS
      SourcePosition: E
      Target: WAFProtection
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: WAFProtection
      SourcePosition: E
      Target: CloudFrontDist
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # CloudFront -> Web Assets & Backend API
    - Source: CloudFrontDist
      SourcePosition: S
      Target: AdminWebS3Bucket
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: CloudFrontDist
      SourcePosition: SE
      Target: BackendApiHandler
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Auth flow
    - Source: AdminWebS3Bucket
      SourcePosition: E
      Target: CognitoUserPool
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: CognitoUserPool
      SourcePosition: E
      Target: AdminUsersTable
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Backend API -> Step Functions & Audit
    - Source: BackendApiHandler
      SourcePosition: W
      Target: StepFunctionsMicroWorkflows
      TargetPosition: E
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: BackendApiHandler
      SourcePosition: E
      Target: AsyncOccJobEngine
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: BackendApiHandler
      SourcePosition: S
      Target: AuditLogsTable
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: BackendApiHandler
      SourcePosition: S
      Target: AuditLogGroup
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Step Functions Execution & IAM Role
    - Source: StepFunctionsExecutionRole
      SourcePosition: W
      Target: StepFunctionsMicroWorkflows
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: S
      Target: TenantRegistryTable
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: S
      Target: CloudWatchDashboard
      TargetPosition: NW
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Step Functions Lifecycle Operations on Managed Fleet
    - Source: StepFunctionsMicroWorkflows
      SourcePosition: E
      Target: ECSFleet
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: E
      Target: RDSFleet
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: E
      Target: S3VaultFleet
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: StepFunctionsMicroWorkflows
      SourcePosition: E
      Target: EFSConfigFleet
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Async OCC Engine -> ECS Fleet
    - Source: AsyncOccJobEngine
      SourcePosition: E
      Target: ECSFleet
      TargetPosition: NW
      TargetArrowHead:
        Type: Open
      Type: orthogonal
