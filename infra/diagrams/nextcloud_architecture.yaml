Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - ActorsStack
        - AWSCloud

    # ─────────────────────────────────────────────────────────────
    # TENANT ACTORS & EXTERNAL CLIENTS
    # ─────────────────────────────────────────────────────────────
    ActorsStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ExternalGuest
        - Tenant1Users
        - Tenant2Users

    ExternalGuest:
      Type: AWS::Diagram::Resource
      Preset: "Client"
      Title: "External Guest"

    Tenant1Users:
      Type: AWS::Diagram::Resource
      Preset: "Users"
      Title: "Tenant 1 Users"

    Tenant2Users:
      Type: AWS::Diagram::Resource
      Preset: "Users"
      Title: "Tenant 2 Users"

    # ─────────────────────────────────────────────────────────────
    # AWS CLOUD ENVIRONMENT
    # ─────────────────────────────────────────────────────────────
    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: vertical
      Title: "AWS Cloud"
      Align: center
      Children:
        - EdgePerimeterStack
        - Region

    # Edge Ingress & Perimeter Security Layer
    EdgePerimeterStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - Route53
        - ACM
        - WAF

    Route53:
      Type: AWS::Route53
      Title: "Amazon Route 53"

    ACM:
      Type: AWS::Diagram::Resource
      Preset: "AWS Certificate Manager (ACM)"
      Title: "AWS Certificate Manager"

    WAF:
      Type: AWS::WAFv2
      Title: "AWS WAF"

    # ─────────────────────────────────────────────────────────────
    # AWS REGION (ap-southeast-1)
    # ─────────────────────────────────────────────────────────────
    Region:
      Type: AWS::Region
      Direction: horizontal
      Title: "AWS Region (ap-southeast-1)"
      Children:
        - VPC
        - RegionalServices

    # ─────────────────────────────────────────────────────────────
    # VPC (LEAN ZERO-NAT MULTI-AZ ARCHITECTURE)
    # ─────────────────────────────────────────────────────────────
    VPC:
      Type: AWS::EC2::VPC
      Title: "Amazon VPC"
      Direction: vertical
      Children:
        - PublicSubnetGroup
        - PrivateSubnetGroup
      BorderChildren:
        - Position: N
          Resource: IGW

    IGW:
      Type: AWS::EC2::InternetGateway
      IconFill:
        Type: rect
      Title: "Internet Gateway"

    # Public Subnets (AZ1 & AZ2): ALB Ingress, Dedicated ECS Tasks, EFS & S3 Endpoint
    PublicSubnetGroup:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "Public Subnets"
      Direction: vertical
      Children:
        - ALB
        - ECSCluster
        - SharedStorageRow

    ALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Preset: Application Load Balancer
      Title: "Application Load Balancer"

    ECSCluster:
      Type: AWS::ECS::Cluster
      Title: "Amazon ECS"
      Direction: horizontal
      Children:
        - FargateTask1
        - FargateTask2

    FargateTask1:
      Type: AWS::Diagram::Resource
      Preset: "AWS Fargate"
      Title: "AWS Fargate"

    FargateTask2:
      Type: AWS::Diagram::Resource
      Preset: "AWS Fargate"
      Title: "AWS Fargate"

    SharedStorageRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - NextcloudEFS
        - S3GatewayEndpoint

    NextcloudEFS:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Elastic File System (Amazon EFS)"
      Title: "Amazon EFS"

    S3GatewayEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Title: "S3 Gateway Endpoint"

    # Private Subnets (AZ1 & AZ2): Isolated RDS Relational Database Tier & Connection Proxy
    PrivateSubnetGroup:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private Subnets"
      Direction: horizontal
      Children:
        - RDSProxy
        - RDSInstance

    RDSProxy:
      Type: AWS::Diagram::Resource
      Preset: "Amazon RDS proxy instance"
      Title: "Amazon RDS Proxy"

    RDSInstance:
      Type: AWS::RDS::DBInstance
      Title: "Amazon RDS"

    # ─────────────────────────────────────────────────────────────
    # REGIONAL SERVICES & PLATFORM INTEGRATIONS
    # ─────────────────────────────────────────────────────────────
    RegionalServices:
      Type: AWS::Diagram::VerticalStack
      Children:
        - StorageAndSecurityRow
        - AIAndObservabilityRow

    StorageAndSecurityRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - S3VaultBucket
        - SecretsManager
        - ECRRepo

    S3VaultBucket:
      Type: AWS::S3::Bucket
      Title: "Amazon S3"

    SecretsManager:
      Type: AWS::SecretsManager::Secret
      Title: "AWS Secrets Manager"

    ECRRepo:
      Type: AWS::ECR
      Title: "Amazon ECR"

    AIAndObservabilityRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - BedrockAI
        - DedicatedCronRunner
        - CloudWatchLog
        - SyntheticsCanary

    BedrockAI:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Bedrock"
      Title: "Amazon Bedrock"

    DedicatedCronRunner:
      Type: AWS::Diagram::Resource
      Preset: "Amazon EventBridge"
      Title: "Amazon EventBridge"

    CloudWatchLog:
      Type: AWS::CloudWatch
      Title: "Amazon CloudWatch Logs"

    SyntheticsCanary:
      Type: AWS::Diagram::Resource
      Preset: "Synthetics"
      Title: "Amazon CloudWatch Synthetics"

  # ─────────────────────────────────────────────────────────────
  # RELATIONSHIPS & TRAFFIC FLOW
  # ─────────────────────────────────────────────────────────────
  Links:
    # DNS Resolution: Clients -> Route 53
    - Source: ExternalGuest
      SourcePosition: S
      Target: Route53
      TargetPosition: NW
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: Tenant1Users
      SourcePosition: S
      Target: Route53
      TargetPosition: NNW
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: Tenant2Users
      SourcePosition: S
      Target: Route53
      TargetPosition: NNE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Ingress: Route 53 -> WAF -> IGW -> ALB
    - Source: Route53
      SourcePosition: S
      Target: WAF
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: WAF
      SourcePosition: S
      Target: IGW
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: IGW
      SourcePosition: S
      Target: ALB
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Ingress Host-Header Routing: ALB -> Dedicated Tenant Containers
    - Source: ALB
      SourcePosition: SW
      Target: FargateTask1
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: ALB
      SourcePosition: SE
      Target: FargateTask2
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Config Isolation: Dedicated Containers -> EFS Access Points
    - Source: FargateTask1
      SourcePosition: S
      Target: NextcloudEFS
      TargetPosition: NW
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: FargateTask2
      SourcePosition: S
      Target: NextcloudEFS
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Storage Isolation: Tasks -> S3 via Gateway Endpoint
    - Source: FargateTask2
      SourcePosition: S
      Target: S3GatewayEndpoint
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: S3GatewayEndpoint
      SourcePosition: E
      Target: S3VaultBucket
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Database Isolation & Pooling: Dedicated Tasks -> RDS Proxy -> PostgreSQL
    - Source: FargateTask1
      SourcePosition: W
      Target: RDSProxy
      TargetPosition: NW
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: FargateTask2
      SourcePosition: S
      Target: RDSProxy
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: RDSProxy
      SourcePosition: E
      Target: RDSInstance
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Cron Runner Trigger: Dedicated EventBridge Cron -> Fargate Tasks
    - Source: DedicatedCronRunner
      SourcePosition: W
      Target: FargateTask2
      TargetPosition: E
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Synthetics Monitoring: Canary -> ALB Ingress
    - Source: SyntheticsCanary
      SourcePosition: N
      Target: ALB
      TargetPosition: ESE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Tasks -> Secrets Manager
    - Source: FargateTask2
      SourcePosition: E
      Target: SecretsManager
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Tasks -> Bedrock AI (Claude 3.5 Sonnet)
    - Source: FargateTask2
      SourcePosition: NE
      Target: BedrockAI
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Tasks -> CloudWatch Logs
    - Source: FargateTask2
      SourcePosition: ESE
      Target: CloudWatchLog
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Tasks -> ECR Golden Image Pull
    - Source: FargateTask1
      SourcePosition: NE
      Target: ECRRepo
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal
