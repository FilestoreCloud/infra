Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - ActorsStack
        - AWSCloud

    # ─────────────────────────────────────────────────────────────
    # TENANT ACTORS & EXTERNAL CLIENTS
    # ─────────────────────────────────────────────────────────────
    ActorsStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ExternalGuest
        - Tenant1Users
        - Tenant2Users

    ExternalGuest:
      Type: AWS::Diagram::Resource
      Preset: "Client"
      Title: "External Guest\n(Public Shares & WebDAV)"

    Tenant1Users:
      Type: AWS::Diagram::Resource
      Preset: "Users"
      Title: "Tenant 1: Acme Users\n(acme.png261.dev)\nWeb, Sync Client & Mobile"

    Tenant2Users:
      Type: AWS::Diagram::Resource
      Preset: "Users"
      Title: "Tenant 2: Marvel Users\n(marvel.png261.dev)\nWeb, Sync Client & Mobile"

    # ─────────────────────────────────────────────────────────────
    # AWS CLOUD ENVIRONMENT
    # ─────────────────────────────────────────────────────────────
    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: vertical
      Title: "AWS Cloud"
      Align: center
      Children:
        - EdgePerimeterStack
        - Region

    # Edge Ingress & Perimeter Security Layer
    EdgePerimeterStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - Route53
        - ACM
        - WAF

    Route53:
      Type: AWS::Route53
      Title: "Amazon Route 53 (DNS)\nHosted Zone: png261.dev\nWildcard *.png261.dev ALIAS"

    ACM:
      Type: AWS::Diagram::Resource
      Preset: "AWS Certificate Manager (ACM)"
      Title: "AWS ACM (TLS 1.3)\nWildcard *.png261.dev\nAuto DNS Validation"

    WAF:
      Type: AWS::WAFv2
      Title: "AWS WAFv2 (WebACL)\nOWASP Top 10, BadInputs\nSQLi & IP Rate Limit"

    # ─────────────────────────────────────────────────────────────
    # AWS REGION (ap-southeast-1)
    # ─────────────────────────────────────────────────────────────
    Region:
      Type: AWS::Region
      Direction: horizontal
      Title: "AWS Region (ap-southeast-1)"
      Children:
        - VPC
        - RegionalServices

    # ─────────────────────────────────────────────────────────────
    # VPC (LEAN ZERO-NAT MULTI-AZ ARCHITECTURE)
    # ─────────────────────────────────────────────────────────────
    VPC:
      Type: AWS::EC2::VPC
      Title: "Nextcloud SaaS VPC (10.0.0.0/16)"
      Direction: vertical
      Children:
        - PublicSubnetGroup
        - PrivateSubnetGroup
      BorderChildren:
        - Position: N
          Resource: IGW

    IGW:
      Type: AWS::EC2::InternetGateway
      IconFill:
        Type: rect
      Title: "Internet Gateway"

    # Public Subnets (AZ1 & AZ2): ALB Ingress, Dedicated ECS Tasks, EFS & S3 Endpoint
    PublicSubnetGroup:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "Public Subnets AZ1 & AZ2 (Host Routing Ingress, Dedicated Compute & Config Store)"
      Direction: vertical
      Children:
        - ALB
        - ECSCluster
        - SharedStorageRow

    ALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Preset: Application Load Balancer
      Title: "Application Load Balancer (Dual-AZ Ingress)\nWildcard TLS 1.3 · Host-Header Priority Routing\nHealth Check: /status.php (200 OK)"

    ECSCluster:
      Type: AWS::ECS::Cluster
      Title: "Amazon ECS (Container-per-Tenant Fargate Fleet)"
      Direction: horizontal
      Children:
        - FargateTask1
        - FargateTask2

    FargateTask1:
      Type: AWS::Diagram::Resource
      Preset: "AWS Fargate"
      Title: "Tenant Acme (service-acme: 1-4 Tasks)\nDual Container: Nextcloud 30 + LiteLLM Sidecar\nAuto-Scaled: CPU > 70%"

    FargateTask2:
      Type: AWS::Diagram::Resource
      Preset: "AWS Fargate"
      Title: "Tenant Marvel (service-marvel: 1-4 Tasks)\nDual Container: Nextcloud 30 + LiteLLM Sidecar\nAuto-Scaled: CPU > 70%"

    SharedStorageRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - NextcloudEFS
        - S3GatewayEndpoint

    NextcloudEFS:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Elastic File System (Amazon EFS)"
      Title: "Amazon EFS (/tenants/{id}/config Access Points)\nPOSIX UID 33:33 (www-data) Encrypted"

    S3GatewayEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Title: "S3 Gateway Endpoint\n(Complimentary / Zero-NAT Routing)"

    # Private Subnets (AZ1 & AZ2): Isolated RDS Relational Database Tier
    PrivateSubnetGroup:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private Subnets AZ1 & AZ2 (Isolated Relational Data Tier)"
      Direction: horizontal
      Children:
        - RDSInstance

    RDSInstance:
      Type: AWS::RDS::DBInstance
      Title: "Amazon RDS PostgreSQL 16 (AWS Graviton2)\nDedicated Catalogs: nc_acme, nc_marvel\nPrivate Subnet Group · Encrypted KMS"

    # ─────────────────────────────────────────────────────────────
    # REGIONAL SERVICES & PLATFORM INTEGRATIONS
    # ─────────────────────────────────────────────────────────────
    RegionalServices:
      Type: AWS::Diagram::VerticalStack
      Children:
        - StorageAndSecurityRow
        - AIAndObservabilityRow

    StorageAndSecurityRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - S3VaultBucket
        - SecretsManager
        - ECRRepo

    S3VaultBucket:
      Type: AWS::S3::Bucket
      Title: "Amazon S3 Vault\n(s3://vault/tenants/{id}/*)\nIntelligent Tiering & Encryption"

    SecretsManager:
      Type: AWS::SecretsManager::Secret
      Title: "AWS Secrets Manager\n(DB, Admin & LiteLLM Secrets)\nKMS Envelope Encryption"

    ECRRepo:
      Type: AWS::ECR
      Title: "Amazon ECR\n(Golden Image: Nextcloud 30\n+ Bedrock Assistant Tools)"

    AIAndObservabilityRow:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - BedrockAI
        - CloudWatchLog

    BedrockAI:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Bedrock"
      Title: "Amazon Bedrock (Claude 3.5 Sonnet)\nSigV4 IAM Task Role Invocation\nContext Chat & Document AI"

    CloudWatchLog:
      Type: AWS::CloudWatch
      Title: "Amazon CloudWatch Logs\n(/ecs/nextcloud & Container Insights)\nStructured Log Streaming"

  # ─────────────────────────────────────────────────────────────
  # RELATIONSHIPS & TRAFFIC FLOW
  # ─────────────────────────────────────────────────────────────
  Links:
    # DNS Resolution: Clients -> Route 53
    - Source: ExternalGuest
      SourcePosition: S
      Target: Route53
      TargetPosition: NW
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: Tenant1Users
      SourcePosition: S
      Target: Route53
      TargetPosition: NNW
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: Tenant2Users
      SourcePosition: S
      Target: Route53
      TargetPosition: NNE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Ingress: Route 53 -> WAF -> IGW -> ALB
    - Source: Route53
      SourcePosition: S
      Target: WAF
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: WAF
      SourcePosition: S
      Target: IGW
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: IGW
      SourcePosition: S
      Target: ALB
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Ingress Host-Header Routing: ALB -> Dedicated Tenant Containers
    - Source: ALB
      SourcePosition: SW
      Target: FargateTask1
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: ALB
      SourcePosition: SE
      Target: FargateTask2
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Config Isolation: Dedicated Containers -> EFS Access Points
    - Source: FargateTask1
      SourcePosition: S
      Target: NextcloudEFS
      TargetPosition: NW
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: FargateTask2
      SourcePosition: S
      Target: NextcloudEFS
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Storage Isolation: Tasks -> S3 via Gateway Endpoint
    - Source: FargateTask2
      SourcePosition: S
      Target: S3GatewayEndpoint
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: S3GatewayEndpoint
      SourcePosition: E
      Target: S3VaultBucket
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Database Isolation: Dedicated Tasks -> Dedicated Databases in RDS PostgreSQL
    - Source: FargateTask1
      SourcePosition: W
      Target: RDSInstance
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: FargateTask2
      SourcePosition: S
      Target: RDSInstance
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Tasks -> Secrets Manager
    - Source: FargateTask2
      SourcePosition: E
      Target: SecretsManager
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Tasks -> Bedrock AI (Claude 3.5 Sonnet)
    - Source: FargateTask2
      SourcePosition: NE
      Target: BedrockAI
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Tasks -> CloudWatch Logs
    - Source: FargateTask2
      SourcePosition: ESE
      Target: CloudWatchLog
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    # Tasks -> ECR Golden Image Pull
    - Source: FargateTask1
      SourcePosition: NE
      Target: ECRRepo
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal
