AWSTemplateFormatVersion: "2010-09-09"
Description: "Nextcloud Multi-Tenant SaaS - Module 03: Storage (S3 Multi-Tenant Vault & EFS Persistent Config Store)"

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment prefix (prod, staging, dev)

  PrivateSubnet1Id:
    Type: String
    Default: ""
    Description: Private Subnet 1 ID for EFS Mount Target (Leave blank to import from Module 01)

  PrivateSubnet2Id:
    Type: String
    Default: ""
    Description: Private Subnet 2 ID for EFS Mount Target (Leave blank to import from Module 01)

  EFSSecurityGroupId:
    Type: String
    Default: ""
    Description: Security Group ID for EFS Mount Targets (Leave blank to import from Module 02)

  TransitionToIADays:
    Type: Number
    Default: 30
    Description: Number of days before transitioning noncurrent file versions to S3 Glacier Instant Retrieval (GLACIER_IR)

  TransitionToGlacierDays:
    Type: Number
    Default: 180
    Description: Number of days before transitioning noncurrent file versions to S3 Glacier Deep Archive (DEEP_ARCHIVE, must be >= 90 days after GLACIER_IR)

  NoncurrentVersionExpirationDays:
    Type: Number
    Default: 365
    Description: Number of days before permanently deleting noncurrent file versions

  EnableObjectLock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable S3 Object Lock (WORM compliance / governance mode) for anti-ransomware protection

  EnableCustomerManagedKMS:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Provision dedicated AWS KMS Customer Managed Key (CMK) with Annual Rotation for cryptographic erasure

  EnableAuditVault:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Provision dedicated Immutable S3 Audit Vault (WORM) for SOC 2 / HIPAA compliance

Conditions:
  HasPrivateSubnet1Id: !Not [!Equals [!Ref PrivateSubnet1Id, ""]]
  HasPrivateSubnet2Id: !Not [!Equals [!Ref PrivateSubnet2Id, ""]]
  HasEFSSecurityGroupId: !Not [!Equals [!Ref EFSSecurityGroupId, ""]]
  ShouldEnableObjectLock: !Equals [!Ref EnableObjectLock, "true"]
  ShouldEnableKMS: !Equals [!Ref EnableCustomerManagedKMS, "true"]
  ShouldEnableAuditVault: !Equals [!Ref EnableAuditVault, "true"]

Resources:
  # ── S3 Multi-Tenant Object Storage Vault ─────────────────────────────────────
  S3VaultBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${EnvironmentName}-nextcloud-vault-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: !If [ShouldEnableObjectLock, true, !Ref "AWS::NoValue"]
      CorsConfiguration:
        CorsRules:
          - Id: StorixDirectUploadCors
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
              - x-amz-server-side-encryption
              - x-amz-request-id
              - x-amz-id-2
            MaxAge: 3600
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: TenantStorageLifecycleOptimization
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 0
            NoncurrentVersionTransitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: !Ref TransitionToIADays
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: !Ref TransitionToGlacierDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionExpirationDays
            ExpiredObjectDeleteMarker: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-s3-vault"
        - Key: Environment
          Value: !Ref EnvironmentName

  S3VaultBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3VaultBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTLSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${S3VaultBucket.Arn}"
              - !Sub "${S3VaultBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ── Amazon EFS Shared Persistent Config Store (/var/www/html/config) ────────
  NextcloudEFS:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
        - TransitionToArchive: AFTER_90_DAYS
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
      FileSystemTags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nextcloud-efs"
        - Key: Environment
          Value: !Ref EnvironmentName

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref NextcloudEFS
      SubnetId:
        Fn::If:
          - HasPrivateSubnet1Id
          - !Ref PrivateSubnet1Id
          - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PrivateSubnet1Id"
      SecurityGroups:
        - Fn::If:
            - HasEFSSecurityGroupId
            - !Ref EFSSecurityGroupId
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-EFSSecurityGroupId"

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref NextcloudEFS
      SubnetId:
        Fn::If:
          - HasPrivateSubnet2Id
          - !Ref PrivateSubnet2Id
          - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PrivateSubnet2Id"
      SecurityGroups:
        - Fn::If:
            - HasEFSSecurityGroupId
            - !Ref EFSSecurityGroupId
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-EFSSecurityGroupId"

  DefaultEFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref NextcloudEFS
      PosixUser:
        Uid: "33"
        Gid: "33"
      RootDirectory:
        Path: "/tenants/default/config"
        CreationInfo:
          OwnerUid: "33"
          OwnerGid: "33"
          Permissions: "0755"
      AccessPointTags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-default-efs-ap"
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── SSM Parameter Store Exports ─────────────────────────────────────────────
  SSMS3VaultBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/s3-vault-bucket"
      Type: String
      Value: !Ref S3VaultBucket
      Description: S3 Vault Bucket Name
      Tags:
        Environment: !Ref EnvironmentName

  SSMS3VaultBucketArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/s3-vault-bucket-arn"
      Type: String
      Value: !GetAtt S3VaultBucket.Arn
      Description: S3 Vault Bucket ARN
      Tags:
        Environment: !Ref EnvironmentName

  SSMEFSFileSystemId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/efs-id"
      Type: String
      Value: !Ref NextcloudEFS
      Description: EFS File System ID for Nextcloud Persistent Config
      Tags:
        Environment: !Ref EnvironmentName

  SSMDefaultAccessPointId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/default-access-point-id"
      Type: String
      Value: !Ref DefaultEFSAccessPoint
      Description: EFS Access Point ID for Default Tenant Config
      Tags:
        Environment: !Ref EnvironmentName

  # ── Dedicated AWS KMS Customer Managed Key (CMK) ───────────────────────────
  StorageKMSKey:
    Type: AWS::KMS::Key
    Condition: ShouldEnableKMS
    DeletionPolicy: Delete
    Properties:
      Description: Dedicated Customer Managed Key (CMK) for Storix S3 Vault and EFS
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Id: StorageKeyPolicy
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowS3AndEFSServices
            Effect: Allow
            Principal:
              Service:
                - s3.amazonaws.com
                - elasticfilesystem.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
              - kms:Encrypt
            Resource: "*"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: Cryptographic-Erasure-Key

  StorageKMSKeyAlias:
    Type: AWS::KMS::Alias
    Condition: ShouldEnableKMS
    Properties:
      AliasName: !Sub "alias/${EnvironmentName}-storix-storage-cmk"
      TargetKeyId: !Ref StorageKMSKey

  # ── S3 Immutable Audit Vault (SOC 2 / HIPAA WORM Compliance) ────────────────
  AuditVaultBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldEnableAuditVault
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${EnvironmentName}-storix-audit-vault-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [ShouldEnableKMS, "aws:kms", "AES256"]
              KMSMasterKeyID: !If [ShouldEnableKMS, !GetAtt StorageKMSKey.Arn, !Ref "AWS::NoValue"]
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: "Enabled"
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 365
      LifecycleConfiguration:
        Rules:
          - Id: AuditLogArchiveLifecycle
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-storix-audit-vault"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: Immutable-Audit-Trail-WORM

  AuditVaultBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldEnableAuditVault
    Properties:
      Bucket: !Ref AuditVaultBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTLSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${AuditVaultBucket.Arn}"
              - !Sub "${AuditVaultBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

Outputs:
  StorageKMSKeyArn:
    Condition: ShouldEnableKMS
    Description: Customer Managed Key (CMK) ARN for S3 Vault and EFS
    Value: !GetAtt StorageKMSKey.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-StorageKMSKeyArn"

  S3VaultBucketName:
    Description: S3 Vault Bucket Name
    Value: !Ref S3VaultBucket
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketName"

  S3VaultBucketArn:
    Description: S3 Vault Bucket ARN
    Value: !GetAtt S3VaultBucket.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketArn"

  AuditVaultBucketName:
    Condition: ShouldEnableAuditVault
    Description: Immutable S3 Audit Vault Bucket Name
    Value: !Ref AuditVaultBucket
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AuditVaultBucketName"

  AuditVaultBucketArn:
    Condition: ShouldEnableAuditVault
    Description: Immutable S3 Audit Vault Bucket ARN
    Value: !GetAtt AuditVaultBucket.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AuditVaultBucketArn"

  EFSFileSystemId:
    Description: EFS File System ID for Nextcloud Persistent Config
    Value: !Ref NextcloudEFS
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-EFSFileSystemId"

  EFSFileSystemArn:
    Description: EFS File System ARN
    Value: !GetAtt NextcloudEFS.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-EFSFileSystemArn"

  DefaultEFSAccessPointId:
    Description: EFS Access Point ID for Default Tenant
    Value: !Ref DefaultEFSAccessPoint
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-DefaultEFSAccessPointId"
