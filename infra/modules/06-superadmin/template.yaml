                    if user_ok:
                        if UTBL:
                            try:
                                ddb=boto3.resource("dynamodb",region_name=os.environ.get("AWS_REGION","ap-southeast-1"))
                                ddb.Table(UTBL).put_item(Item={"username":u,"password_hash":hashlib.sha256(p.encode()).hexdigest(),"role":user_role,"updated_at":int(time.time())})
                            except:pass
                        tok=make_tok({"user":u,"role":user_role,"exp":time.time()+86400})
                        return resp(200,{"status":"OK","token":tok,"user":u,"role":user_role})
                    return resp(401,{"error":"Invalid administrative credentials."})
