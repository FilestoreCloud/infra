AWSTemplateFormatVersion: "2010-09-09"
Description: "Nextcloud Multi-Tenant SaaS - Module 06: SaaS Control Plane (DynamoDB Tenant Registry, SuperAdmin API, Step Functions Micro-Workflows, Web Console)"

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment prefix (prod, staging, dev)

  S3VaultBucketArn:
    Type: String
    Default: ""
    Description: S3 Vault Bucket ARN for Tenant Operator cleanup permissions (Leave blank to import from Module 03)

  ApplicationLoadBalancerDNS:
    Type: String
    Default: ""
    Description: ALB DNS Name for backend API routing fallback (Leave blank to import from Module 05)

  ECSClusterName:
    Type: String
    Default: ""
    Description: ECS Cluster Name for Tenant Operator lifecycle management (Leave blank to import from Module 05)

  ApiOriginDomain:
    Type: String
    Default: ""
    Description: "Optional backend API domain (Lambda Function URL domain without https:// or ALB DNS). If omitted, falls back to ApplicationLoadBalancerDNS."

  GitHubOrg:
    Type: String
    Default: "FilestoreCloud"
    Description: "GitHub Organization name for OIDC trust policies"

  LambdaCodeBucket:
    Type: String
    Default: ""
    Description: "Optional S3 bucket containing tenant_operator_lambda code zip. If omitted, uses bootstrap handler."

  LambdaCodeKey:
    Type: String
    Default: "tenant_operator_lambda.zip"
    Description: "Optional S3 key containing tenant_operator_lambda code zip."

  RootDomain:
    Type: String
    Default: "png261.dev"
    Description: "Root domain for tenant subdomains (e.g. png261.dev)"

  AdminCertificateArn:
    Type: String
    Default: ""
    Description: "Optional ACM Certificate ARN in us-east-1 for admin custom domain (e.g. admin.png261.dev)"

Conditions:
  HasAdminCertificate: !Not [!Equals [!Ref AdminCertificateArn, ""]]
  HasCustomApiOrigin: !Not [!Equals [!Ref ApiOriginDomain, ""]]
  HasLambdaS3Code: !Not [!Equals [!Ref LambdaCodeBucket, ""]]
  HasS3VaultBucketArn: !Not [!Equals [!Ref S3VaultBucketArn, ""]]
  HasECSClusterName: !Not [!Equals [!Ref ECSClusterName, ""]]
  HasALBDNS: !Not [!Equals [!Ref ApplicationLoadBalancerDNS, ""]]

Resources:
  DynamoDBTenantRegistry:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  DynamoDBAdminUsers:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-nextcloud-admin-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

  DynamoDBAuditLogs:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-nextcloud-audit-logs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/audit/${EnvironmentName}-nextcloud-control-plane"
      RetentionInDays: 365
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${EnvironmentName}-nextcloud-sfn"
      RetentionInDays: 90
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

  # ============================================================================
  # CUSTOM EVENTBUS, SQS QUEUE & DEAD-LETTER QUEUE (DLQ)
  # ============================================================================
  StorixEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${EnvironmentName}-storix-tenant-events"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: Storix-Event-Driven-Architecture

  TenantEventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-storix-tenant-events-dlq"
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  TenantEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-storix-tenant-events-queue"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TenantEventsDLQ.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  TenantEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref TenantEventsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt TenantEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt TenantEventsRule.Arn

  TenantEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-storix-tenant-lifecycle-rule"
      Description: Routes domain events from storix-tenant-events EventBus to SQS with DLQ
      EventBusName: !Ref StorixEventBus
      EventPattern:
        source:
          - storix.controlplane
        detail-type:
          - TenantCreated
          - TenantSuspended
          - TenantResumed
          - StorageLimitReached
      State: ENABLED
      Targets:
        - Arn: !GetAtt TenantEventsQueue.Arn
          Id: SQSAsyncWorkerTarget
          DeadLetterConfig:
            Arn: !GetAtt TenantEventsDLQ.Arn

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${EnvironmentName}-nextcloud-admin-pool"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: "OFF"
      UserPoolTags:
        Environment: !Ref EnvironmentName
        Application: storix

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${EnvironmentName}-nextcloud-admin-client"
      UserPoolId: !Ref AdminUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH

  # ============================================================================
  # SUPER ADMIN WEB HOSTING (S3 + CLOUDFRONT)
  # ============================================================================
  AdminWebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-nextcloud-admin-web-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

  AdminWebCloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-nextcloud-admin-web-oac"
        Description: "Origin Access Control for Super Admin Web S3 bucket"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AdminWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminWebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTLSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${AdminWebBucket}"
              - !Sub "arn:aws:s3:::${AdminWebBucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AdminWebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminWebDistribution}"

  AdminWebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Nextcloud SaaS Super Admin Web Console (${EnvironmentName})"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases:
          !If
            - HasAdminCertificate
            - - !Sub "admin.${RootDomain}"
            - !Ref "AWS::NoValue"
        ViewerCertificate:
          !If
            - HasAdminCertificate
            - AcmCertificateArn: !Ref AdminCertificateArn
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
            - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3-AdminWebOrigin
            DomainName: !GetAtt AdminWebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AdminWebCloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: BackendApiOrigin
            DomainName:
              !If [
                HasCustomApiOrigin,
                !Ref ApiOriginDomain,
                !Select [
                  2,
                  !Split ["/", !GetAtt TenantOperatorFunctionUrl.FunctionUrl],
                ],
              ]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3-AdminWebOrigin
          ViewerProtocolPolicy: allow-all
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: "/api*"
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: allow-all
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

  TenantOperatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-tenant-operator-lambda-role"
      Description: "Least-privilege execution role for Nextcloud SaaS Control Plane Lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ControlPlaneLeastPrivilegePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBOperations
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt DynamoDBTenantRegistry.Arn
                  - !GetAtt DynamoDBAdminUsers.Arn
                  - !GetAtt DynamoDBAuditLogs.Arn
              - Sid: SecretsManagerAdminAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/nextcloud/${EnvironmentName}/*"
              - Sid: S3VaultAccess
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - Fn::If:
                      - HasS3VaultBucketArn
                      - !Ref S3VaultBucketArn
                      - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketArn"
                  - Fn::Sub:
                      - "${BucketArn}/*"
                      - BucketArn:
                          Fn::If:
                            - HasS3VaultBucketArn
                            - !Ref S3VaultBucketArn
                            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketArn"
              - Sid: ECSServiceControl
                Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"
              - Sid: ECSTaskDefinitionControl
                Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Sid: IAMPassRoleForTaskExecution
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: SSMParameterAccess
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nextcloud/${EnvironmentName}*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nextcloud/${EnvironmentName}/*"
              - Sid: CloudWatchTelemetry
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricWidgetImage
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetDashboard
                  - cloudwatch:ListDashboards
                Resource: "*"
              - Sid: ContainerLogInspection
                Effect: Allow
                Action:
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${EnvironmentName}-*:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${EnvironmentName}-*:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/audit/${EnvironmentName}-*:*"
              - Sid: CognitoAdminAuth
                Effect: Allow
                Action:
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminRespondToAuthChallenge
                  - cognito-idp:InitiateAuth
                Resource: !GetAtt AdminUserPool.Arn
              - Sid: SESSendMFAEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
              - Sid: StepFunctionsControl
                Effect: Allow
                Action:
                  - states:StartExecution
                  - states:DescribeExecution
                  - states:StopExecution
                  - states:GetExecutionHistory
                  - states:ListExecutions
                Resource:
                  - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-Tenant-*"
                  - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${EnvironmentName}-Tenant-*:*"
              - Sid: XRayObservability
                Effect: Allow
                Action:
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                  - xray:GetServiceGraph
                  - xray:GetTraceGraph
                Resource: "*"
              - Sid: EventBridgePutEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt StorixEventBus.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  TenantOperatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-nextcloud-tenant-operator"
      Description: "SaaS Control Plane REST API controller for tenant fleet lifecycle operations"
      Runtime: python3.11
      Handler: !If [HasLambdaS3Code, "tenant_operator_lambda.lambda_handler", "index.lambda_handler"]
      Role: !GetAtt TenantOperatorLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          EVENT_BUS_NAME: !Ref StorixEventBus
          TABLE_NAME: !Ref DynamoDBTenantRegistry
          ADMIN_USERS_TABLE: !Ref DynamoDBAdminUsers
          AUDIT_LOGS_TABLE: !Ref DynamoDBAuditLogs
          COGNITO_USER_POOL_ID: !Ref AdminUserPool
          COGNITO_CLIENT_ID: !Ref AdminUserPoolClient
          SFN_LOG_GROUP: !Ref StepFunctionsLogGroup
          CLUSTER_NAME:
            Fn::If:
              - HasECSClusterName
              - !Ref ECSClusterName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSClusterName"
          STATE_MACHINE_PROVISION_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-Tenant-Provisioning"
          STATE_MACHINE_SUSPEND_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-Tenant-Suspension"
          STATE_MACHINE_RESUME_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-Tenant-Resumption"
          STATE_MACHINE_DEPROVISION_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-Tenant-Deprovisioning"
          STATE_MACHINE_SEED_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-Tenant-Seeding"
          STATE_MACHINE_DEMO_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-Tenant-Demo-Provisioning"
          STATE_MACHINE_FLEET_UPGRADE_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-Tenant-Fleet-Upgrade"
          LOAD_BALANCER_DNS:
            Fn::If:
              - HasALBDNS
              - !Ref ApplicationLoadBalancerDNS
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-LoadBalancerDNS"
          REQUIRE_MFA: "false"
          ROOT_DOMAIN: !Ref RootDomain
      Code: !If
        - HasLambdaS3Code
        - S3Bucket: !Ref LambdaCodeBucket
          S3Key: !Ref LambdaCodeKey
        - ZipFile: |
            import json,os,time,hmac,hashlib,base64,struct,boto3,decimal,secrets,datetime,random,urllib.request,urllib.parse,ssl
            TBL=os.environ.get("TABLE_NAME","dev-nextcloud-tenant-registry")
            UTBL=os.environ.get("ADMIN_USERS_TABLE","")
            CORS={"Content-Type":"application/json","Access-Control-Allow-Origin":"*","Access-Control-Allow-Methods":"*","Access-Control-Allow-Headers":"*"}
            def d2j(o):
                if isinstance(o,decimal.Decimal):return int(o) if o%1==0 else float(o)
                return str(o)
            def get_key():
                k=os.environ.get("ADMIN_MASTER_KEY","")
                if k:return k
                try:
                    sm=boto3.client("secretsmanager",region_name=os.environ.get("AWS_REGION","ap-southeast-1"))
                    r=sm.get_secret_value(SecretId=f"/nextcloud/{os.environ.get('ENVIRONMENT_NAME','dev')}/secrets/admin-credentials")
                    return json.loads(r["SecretString"]).get("password","")
                except:pass
                return "StorixAdmin2026!SecureSigningKey"
            def make_tok(p):
                k=get_key()
                s=base64.b64encode(json.dumps(p).encode()).decode()
                return f"{s}.{hmac.new(k.encode(),s.encode(),hashlib.sha256).hexdigest()}"
            def verify_tok(t):
                k=get_key()
                try:
                    s,sig=t.split(".",1)
                    if hmac.compare_digest(hmac.new(k.encode(),s.encode(),hashlib.sha256).hexdigest(),sig):
                        return json.loads(base64.b64decode(s).decode())
                except:pass
                return None
            def resp(st,d):return {"statusCode":st,"headers":CORS,"body":json.dumps(d,default=d2j)}
            def get_admin_creds():
                try:
                    sm=boto3.client("secretsmanager",region_name=os.environ.get("AWS_REGION","ap-southeast-1"))
                    r=sm.get_secret_value(SecretId=f"/nextcloud/{os.environ.get('ENVIRONMENT_NAME','dev')}/secrets/admin-credentials")
                    creds=json.loads(r["SecretString"])
                    return creds.get("username","admin"),creds.get("password","")
                except:pass
                return "admin",""
            def sync_nextcloud_account(tid,dom,u,pwd,email=None,role="User",q_gb=None):
                admin_user,admin_pwd=get_admin_creds()
                if not admin_pwd:
                    print("Warning: Admin password unavailable for Nextcloud sync")
                    return False
                auth_hdr="Basic "+base64.b64encode(f"{admin_user}:{admin_pwd}".encode()).decode()
                alb_dns=os.environ.get("LOAD_BALANCER_DNS","")
                endpoints=[]
                if dom:endpoints.append(("https://"+dom,{}))
                if alb_dns and dom:endpoints.append(("http://"+alb_dns,{"Host":dom}))
                elif alb_dns:endpoints.append(("http://"+alb_dns,{}))
                ctx=ssl.create_default_context()
                ctx.check_hostname=False
                ctx.verify_mode=ssl.CERT_NONE
                success=False
                for base_url,extra_hdrs in endpoints:
                    try:
                        check_url=f"{base_url}/ocs/v1.php/cloud/users/{urllib.parse.quote(u)}"
                        hdrs={"Authorization":auth_hdr,"OCS-APIREQUEST":"true","User-Agent":"Storix-ControlPlane/1.0"}
                        hdrs.update(extra_hdrs)
                        req=urllib.request.Request(check_url,headers=hdrs,method="GET")
                        user_exists=False
                        try:
                            with urllib.request.urlopen(req,context=ctx,timeout=8) as r:
                                if "<statuscode>100</statuscode>" in r.read().decode("utf-8",errors="ignore"):user_exists=True
                        except:pass
                        if user_exists:
                            put_url=f"{base_url}/ocs/v1.php/cloud/users/{urllib.parse.quote(u)}"
                            b_pwd=urllib.parse.urlencode({"key":"password","value":pwd}).encode()
                            put_hdrs=dict(hdrs)
                            put_hdrs["Content-Type"]="application/x-www-form-urlencoded"
                            preq=urllib.request.Request(put_url,data=b_pwd,headers=put_hdrs,method="PUT")
                            with urllib.request.urlopen(preq,context=ctx,timeout=8) as r:pass
                            if email:
                                b_em=urllib.parse.urlencode({"key":"email","value":email}).encode()
                                ereq=urllib.request.Request(put_url,data=b_em,headers=put_hdrs,method="PUT")
                                with urllib.request.urlopen(ereq,context=ctx,timeout=8) as r:pass
                            success=True
                            break
                        else:
                            post_url=f"{base_url}/ocs/v1.php/cloud/users"
                            f_data={"userid":u,"password":pwd,"email":email or f"{u}@{tid}.com"}
                            if role in ("TenantAdmin","admin"):f_data["groups[]"]="admin"
                            post_b=urllib.parse.urlencode(f_data).encode()
                            post_hdrs=dict(hdrs)
                            post_hdrs["Content-Type"]="application/x-www-form-urlencoded"
                            creq=urllib.request.Request(post_url,data=post_b,headers=post_hdrs,method="POST")
                            with urllib.request.urlopen(creq,context=ctx,timeout=8) as r:
                                if "<statuscode>100</statuscode>" in r.read().decode("utf-8",errors="ignore"):
                                    success=True
                                    break
                    except Exception as e:
                        print(f"Sync user {u} error on {base_url}: {e}")
                        continue
                try:
                    sm=boto3.client("secretsmanager",region_name=os.environ.get("AWS_REGION","ap-southeast-1"))
                    env=os.environ.get("ENVIRONMENT_NAME","dev")
                    sec_id=f"/nextcloud/{env}/tenants/{tid}/credentials"
                    sec_val=json.dumps({"username":u,"password":pwd,"updated_at":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())})
