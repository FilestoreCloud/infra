  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-nextcloud-sfn-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TenantLifecycleStatePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt DynamoDBTenantRegistry.Arn
                  - !GetAtt DynamoDBAuditLogs.Arn
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt TenantOperatorLambda.Arn
                  - !Sub "${TenantOperatorLambda.Arn}:*"
                  - !GetAtt TenantWorkerLambda.Arn
                  - !Sub "${TenantWorkerLambda.Arn}:*"
              - Effect: Allow
                Action:
                  - states:StartExecution
                  - states:DescribeExecution
                  - states:StopExecution
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: "*"

  TenantProvisioningStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Provisioning"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions State Machine for Nextcloud Multi-Tenant Provisioning with Real-Time Progress & Saga Rollback",
          "StartAt": "ProvisionMarkDynamoDB",
          "States": {
            "ProvisionMarkDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Item": {
                  "tenant_id": { "S.$": "$.TenantId" },
                  "status": { "S": "PROVISIONING" },
                  "progress": { "N": "15" },
                  "current_step": { "S": "Initializing Registry & Allocating Ingress" },
                  "quota_gb": { "N.$": "$.StorageQuotaGB" },
                  "domain": { "S.$": "$.CompanyDomain" }
                }
              },
              "ResultPath": "$.ddb_result",
              "Next": "ProvisionTenantResources"
            },
            "ProvisionTenantResources": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "PROVISION_TENANT_RESOURCES",
                  "tenant_id.$": "$.TenantId",
                  "domain.$": "$.CompanyDomain",
                  "quota_gb.$": "$.StorageQuotaGB"
                }
              },
              "ResultPath": "$.provision_result",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "SagaRollback"
                }
              ],
              "Next": "MarkInfraAllocated"
            },
            "MarkInfraAllocated": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":p": { "N": "45" },
                  ":cs": { "S": "Allocating Dedicated Infrastructure (EFS, ECS, ALB)" }
                }
              },
              "ResultPath": "$.infra_mark_result",
              "Next": "WaitForContainerHealthy"
            },
            "WaitForContainerHealthy": {
              "Type": "Wait",
              "Seconds": 15,
              "Next": "CheckHealthStatus"
            },
            "CheckHealthStatus": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "CHECK_TENANT_HEALTH",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.health_check",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "SagaRollback"
                }
              ],
              "Next": "IsContainerHealthy"
            },
            "IsContainerHealthy": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.health_check.Payload.healthy",
                  "BooleanEquals": true,
                  "Next": "MarkContainerHealthy"
                }
              ],
              "Default": "RetryHealthCheck"
            },
            "RetryHealthCheck": {
              "Type": "Wait",
              "Seconds": 10,
              "Next": "CheckHealthStatus"
            },
            "MarkContainerHealthy": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":p": { "N": "85" },
                  ":cs": { "S": "Fargate Container Healthy (/status.php 200 OK)" }
                }
              },
              "ResultPath": "$.health_mark_result",
              "Next": "MarkProvisionActive"
            },
            "MarkProvisionActive": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "ACTIVE" },
                  ":p": { "N": "100" },
                  ":cs": { "S": "Ready & Operational" }
                }
              },
              "ResultPath": "$.active_result",
              "Next": "PublishProvisionMetric"
            },
            "PublishProvisionMetric": {
              "Type": "Task",
              "Resource": "arn:aws:states:::cloudwatch:putMetricData",
              "Parameters": {
                "Namespace": "Nextcloud/SaaS",
                "MetricData": [
                  {
                    "MetricName": "TenantActiveStatus",
                    "Dimensions": [
                      {
                        "Name": "TenantId",
                        "Value.$": "$.TenantId"
                      }
                    ],
                    "Value": 1.0,
                    "Unit": "Count"
                  }
                ]
              },
              "End": true
            },
            "SagaRollback": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "SAGA_CLEANUP_TENANT",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.rollback_result",
              "Next": "MarkProvisionFailed"
            },
            "MarkProvisionFailed": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs, #err = :e",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step",
                  "#err": "last_error"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "FAILED" },
                  ":p": { "N": "0" },
                  ":cs": { "S": "Provisioning failed and rolled back" },
                  ":e": { "S": "Provisioning failed during container/resource initialization" }
                }
              },
              "Next": "ProvisionFailed"
            },
            "ProvisionFailed": {
              "Type": "Fail",
              "Error": "ProvisioningFailed",
              "Cause": "Tenant provisioning failed and Saga compensation rolled back partial resources."
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane
  TenantSuspensionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Suspension"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions State Machine for Nextcloud Tenant Suspension (FinOps Scale-to-Zero)",
          "StartAt": "MarkSuspendingDynamoDB",
          "States": {
            "MarkSuspendingDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "SUSPENDING" },
                  ":p": { "N": "30" },
                  ":cs": { "S": "Draining active connections & scaling Fargate tasks to 0" }
                }
              },
              "ResultPath": "$.ddb_suspending_result",
              "Next": "SuspendScaleECS"
            },
            "SuspendScaleECS": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "SUSPEND",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.suspend_result",
              "Next": "MarkSuspendedDynamoDB"
            },
            "MarkSuspendedDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "SUSPENDED" },
                  ":p": { "N": "100" },
                  ":cs": { "S": "Suspended ($0 FinOps Scale-to-Zero)" }
                }
              },
              "ResultPath": "$.ddb_result",
              "Next": "PublishSuspendMetric"
            },
            "PublishSuspendMetric": {
              "Type": "Task",
              "Resource": "arn:aws:states:::cloudwatch:putMetricData",
              "Parameters": {
                "Namespace": "Nextcloud/SaaS",
                "MetricData": [
                  {
                    "MetricName": "TenantActiveStatus",
                    "Dimensions": [
                      {
                        "Name": "TenantId",
                        "Value.$": "$.TenantId"
                      }
                    ],
                    "Value": 0.0,
                    "Unit": "Count"
                  }
                ]
              },
              "End": true
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  TenantResumptionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Resumption"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions State Machine for Nextcloud Tenant Resumption",
          "StartAt": "MarkResumingDynamoDB",
          "States": {
            "MarkResumingDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "RESUMING" },
                  ":p": { "N": "25" },
                  ":cs": { "S": "Scaling ECS Fargate task to 1" }
                }
              },
              "ResultPath": "$.ddb_resuming_result",
              "Next": "ResumeScaleECS"
            },
            "ResumeScaleECS": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "RESUME",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.resume_result",
              "Next": "WaitForResumeHealthy"
            },
            "WaitForResumeHealthy": {
              "Type": "Wait",
              "Seconds": 15,
              "Next": "MarkCheckingHealthDynamoDB"
            },
            "MarkCheckingHealthDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":p": { "N": "65" },
                  ":cs": { "S": "Checking container health (/status.php 200 OK)" }
                }
              },
              "ResultPath": "$.ddb_health_step_result",
              "Next": "CheckResumeHealth"
            },
            "CheckResumeHealth": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "CHECK_TENANT_HEALTH",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.health_check",
              "Next": "IsResumeHealthy"
            },
            "IsResumeHealthy": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.health_check.Payload.healthy",
                  "BooleanEquals": true,
                  "Next": "MarkResumedDynamoDB"
                }
              ],
              "Default": "RetryResumeHealth"
            },
            "RetryResumeHealth": {
              "Type": "Wait",
              "Seconds": 10,
              "Next": "CheckResumeHealth"
            },
            "MarkResumedDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "ACTIVE" },
                  ":p": { "N": "100" },
                  ":cs": { "S": "Ready & Operational" }
                }
              },
              "ResultPath": "$.ddb_result",
              "Next": "PublishResumeMetric"
            },
            "PublishResumeMetric": {
              "Type": "Task",
              "Resource": "arn:aws:states:::cloudwatch:putMetricData",
              "Parameters": {
                "Namespace": "Nextcloud/SaaS",
                "MetricData": [
                  {
                    "MetricName": "TenantActiveStatus",
                    "Dimensions": [
                      {
                        "Name": "TenantId",
                        "Value.$": "$.TenantId"
                      }
                    ],
                    "Value": 1.0,
                    "Unit": "Count"
                  }
                ]
              },
              "End": true
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  TenantDeprovisioningStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Deprovisioning"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions State Machine for Nextcloud Tenant Deprovisioning with Real-Time Progress & Complete Teardown",
          "StartAt": "MarkDeprovisioningDynamoDB",
          "States": {
            "MarkDeprovisioningDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "DELETING" },
                  ":p": { "N": "15" },
                  ":cs": { "S": "Initiating teardown: draining connections & stopping tasks" }
                }
              },
              "ResultPath": "$.ddb_deleting_result",
              "Next": "DeprovisionECSCompute"
            },
            "DeprovisionECSCompute": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "DEPROVISION_ECS",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.ecs_result",
              "Next": "MarkECSDeletedDynamoDB"
            },
            "MarkECSDeletedDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":p": { "N": "50" },
                  ":cs": { "S": "ECS Service deleted; removing ALB target group & routing rules" }
                }
              },
              "ResultPath": "$.ddb_ecs_result",
              "Next": "DeprovisionIngressAndStorage"
            },
            "DeprovisionIngressAndStorage": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "DEPROVISION_STORAGE",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.storage_result",
              "Next": "MarkStorageDeletedDynamoDB"
            },
            "MarkStorageDeletedDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":p": { "N": "90" },
                  ":cs": { "S": "Ingress & EFS Access Point removed; purging registry record" }
                }
              },
              "ResultPath": "$.ddb_storage_result",
              "Next": "PurgeDynamoDBRecord"
            },
            "PurgeDynamoDBRecord": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:deleteItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                }
              },
              "ResultPath": "$.ddb_purge_result",
              "Next": "PublishDeprovisionMetric"
            },
            "PublishDeprovisionMetric": {
              "Type": "Task",
              "Resource": "arn:aws:states:::cloudwatch:putMetricData",
              "Parameters": {
                "Namespace": "Nextcloud/SaaS",
                "MetricData": [
                  {
                    "MetricName": "TenantActiveStatus",
                    "Dimensions": [
                      {
                        "Name": "TenantId",
                        "Value.$": "$.TenantId"
                      }
                    ],
                    "Value": 0.0,
                    "Unit": "Count"
                  }
                ]
              },
              "End": true
            }
          }
        }
  TenantSeedingStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Seeding"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions State Machine for Nextcloud Tenant Demo Seeding (Admin Accounts & Sample Files)",
          "StartAt": "MarkSeedingInProgress",
          "States": {
            "MarkSeedingInProgress": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "SEEDING" },
                  ":p": { "N": "20" },
                  ":cs": { "S": "Seeding admin users and default groups" }
                }
              },
              "ResultPath": "$.ddb_result",
              "Next": "SeedAdminUsers"
            },
            "SeedAdminUsers": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "SEED_ADMIN_USERS",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.seed_users_result",
              "Next": "MarkUsersSeeded"
            },
            "MarkUsersSeeded": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":p": { "N": "60" },
                  ":cs": { "S": "Seeding showcase documents, media & templates" }
                }
              },
              "ResultPath": "$.ddb_result",
              "Next": "SeedSampleFiles"
            },
            "SeedSampleFiles": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "SEED_SAMPLE_FILES",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.seed_files_result",
              "Next": "MarkSeedComplete"
            },
            "MarkSeedComplete": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "ACTIVE" },
                  ":p": { "N": "100" },
                  ":cs": { "S": "Ready & Operational (Demo Seeded)" }
                }
              },
              "ResultPath": "$.ddb_result",
              "Next": "PublishSeedMetric"
            },
            "PublishSeedMetric": {
              "Type": "Task",
              "Resource": "arn:aws:states:::cloudwatch:putMetricData",
              "Parameters": {
                "Namespace": "Nextcloud/SaaS",
                "MetricData": [
                  {
                    "MetricName": "TenantSeededStatus",
                    "Dimensions": [
                      {
                        "Name": "TenantId",
                        "Value.$": "$.TenantId"
                      }
                    ],
                    "Value": 1.0,
                    "Unit": "Count"
                  }
                ]
              },
              "End": true
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  TenantDemoProvisioningStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Demo-Provisioning"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions Orchestrator for Demo Tenant: Sequentially runs Tenant Provisioning then Tenant Seeding",
          "StartAt": "RunTenantProvisioning",
          "States": {
            "RunTenantProvisioning": {
              "Type": "Task",
              "Resource": "arn:aws:states:::states:startExecution.sync:2",
              "Parameters": {
                "StateMachineArn": "${TenantProvisioningStateMachine.Arn}",
                "Input": {
                  "TenantId.$": "$.TenantId",
                  "StorageQuotaGB.$": "$.StorageQuotaGB",
                  "CompanyDomain.$": "$.CompanyDomain",
                  "AWS_STEP_FUNCTIONS_STARTED_BY_EXECUTION_ID.$": "$$.Execution.Id"
                }
              },
              "ResultPath": "$.provision_result",
              "Next": "RunTenantSeeding"
            },
            "RunTenantSeeding": {
              "Type": "Task",
              "Resource": "arn:aws:states:::states:startExecution.sync:2",
              "Parameters": {
                "StateMachineArn": "${TenantSeedingStateMachine.Arn}",
                "Input": {
                  "TenantId.$": "$.TenantId",
                  "AWS_STEP_FUNCTIONS_STARTED_BY_EXECUTION_ID.$": "$$.Execution.Id"
                }
              },
              "ResultPath": "$.seed_result",
              "End": true
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  TenantFleetUpgradeStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Fleet-Upgrade"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions State Machine for Nextcloud Multi-Tenant Fleet Rolling Container Image Upgrade",
          "StartAt": "GetRunningTenants",
          "States": {
            "GetRunningTenants": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "GET_RUNNING_TENANTS"
                }
              },
              "ResultPath": "$.Fleet",
              "Next": "UpgradeFleetMap"
            },
            "UpgradeFleetMap": {
              "Type": "Map",
              "ItemsPath": "$.Fleet.Payload.running_tenants",
              "ItemSelector": {
                "TenantId.$": "$$.Map.Item.Value",
                "TargetImage.$": "$.TargetImage"
              },
              "MaxConcurrency": 2,
              "Iterator": {
                "StartAt": "MarkTenantUpgradingDynamoDB",
                "States": {
                  "MarkTenantUpgradingDynamoDB": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::dynamodb:updateItem",
                    "Parameters": {
                      "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                      "Key": {
                        "tenant_id": { "S.$": "$.TenantId" }
                      },
                      "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                      "ExpressionAttributeNames": {
                        "#st": "status",
                        "#p": "progress",
                        "#cs": "current_step"
                      },
                      "ExpressionAttributeValues": {
                        ":s": { "S": "UPGRADING" },
                        ":p": { "N": "25" },
                        ":cs": { "S": "Updating ECS task definition with new container image" }
                      }
                    },
                    "ResultPath": "$.ddb_result",
                    "Next": "UpdateTenantECSImage"
                  },
                  "UpdateTenantECSImage": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${TenantWorkerLambda.Arn}",
                      "Payload": {
                        "action": "UPDATE_TENANT_IMAGE",
                        "tenant_id.$": "$.TenantId",
                        "target_image.$": "$.TargetImage"
                      }
                    },
                    "ResultPath": "$.update_result",
                    "Next": "MarkDeployingDynamoDB"
                  },
                  "MarkDeployingDynamoDB": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::dynamodb:updateItem",
                    "Parameters": {
                      "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                      "Key": {
                        "tenant_id": { "S.$": "$.TenantId" }
                      },
                      "UpdateExpression": "SET #p = :p, #cs = :cs",
                      "ExpressionAttributeNames": {
                        "#p": "progress",
                        "#cs": "current_step"
                      },
                      "ExpressionAttributeValues": {
                        ":p": { "N": "60" },
                        ":cs": { "S": "Rolling deployment in progress; awaiting task stabilization" }
                      }
                    },
                    "ResultPath": "$.ddb_deploy_result",
                    "Next": "WaitForRollingDeployment"
                  },
                  "WaitForRollingDeployment": {
                    "Type": "Wait",
                    "Seconds": 15,
                    "Next": "CheckUpgradedHealth"
                  },
                  "CheckUpgradedHealth": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${TenantWorkerLambda.Arn}",
                      "Payload": {
                        "action": "CHECK_TENANT_HEALTH",
                        "tenant_id.$": "$.TenantId"
                      }
                    },
                    "ResultPath": "$.health_check",
                    "Next": "IsUpgradeHealthy"
                  },
                  "IsUpgradeHealthy": {
                    "Type": "Choice",
                    "Choices": [
                      {
                        "Variable": "$.health_check.Payload.healthy",
                        "BooleanEquals": true,
                        "Next": "MarkUpgradeCompleteDynamoDB"
                      }
                    ],
                    "Default": "RetryUpgradeHealth"
                  },
                  "RetryUpgradeHealth": {
                    "Type": "Wait",
                    "Seconds": 10,
                    "Next": "CheckUpgradedHealth"
                  },
                  "MarkUpgradeCompleteDynamoDB": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::dynamodb:updateItem",
                    "Parameters": {
                      "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                      "Key": {
                        "tenant_id": { "S.$": "$.TenantId" }
                      },
                      "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs, #img = :img",
                      "ExpressionAttributeNames": {
                        "#st": "status",
                        "#p": "progress",
                        "#cs": "current_step",
                        "#img": "container_image"
                      },
                      "ExpressionAttributeValues": {
                        ":s": { "S": "ACTIVE" },
                        ":p": { "N": "100" },
                        ":cs": { "S": "Ready & Operational (Upgraded)" },
                        ":img": { "S.$": "$.TargetImage" }
                      }
                    },
                    "ResultPath": "$.ddb_complete_result",
                    "End": true
                  }
                }
              },
              "ResultPath": "$.upgrade_results",
              "Next": "PublishFleetUpgradeMetric"
            },
            "PublishFleetUpgradeMetric": {
              "Type": "Task",
              "Resource": "arn:aws:states:::cloudwatch:putMetricData",
              "Parameters": {
                "Namespace": "Nextcloud/SaaS",
                "MetricData": [
                  {
                    "MetricName": "FleetImageUpgradeCompleted",
                    "Value": 1.0,
                    "Unit": "Count"
                  }
                ]
              },
              "End": true
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

Outputs:
  TenantFleetUpgradeStateMachineArn:
    Description: Step Functions Tenant Fleet Rolling Upgrade State Machine ARN
    Value: !Ref TenantFleetUpgradeStateMachine
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantFleetUpgradeStateMachineArn"

  TenantProvisioningStateMachineArn:
    Description: Step Functions Tenant Provisioning State Machine ARN
    Value: !Ref TenantProvisioningStateMachine
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantProvisioningStateMachineArn"

  TenantSeedingStateMachineArn:
