  TenantFleetUpgradeStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Fleet-Upgrade"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions State Machine for Nextcloud Multi-Tenant Fleet Rolling Container Image Upgrade with Canary Rollout & Auto-Rollback",
          "TimeoutSeconds": 1800,
          "StartAt": "GetRunningTenants",
          "States": {
            "GetRunningTenants": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "GET_RUNNING_TENANTS"
                }
              },
              "ResultPath": "$.Fleet",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "CheckFleetHasTenants"
            },
            "CheckFleetHasTenants": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.Fleet.Payload.has_tenants",
                  "BooleanEquals": false,
                  "Next": "NoRunningTenantsPass"
                }
              ],
              "Default": "MarkCanaryUpgradingDynamoDB"
            },
            "NoRunningTenantsPass": {
              "Type": "Pass",
              "End": true
            },
            "MarkCanaryUpgradingDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.Fleet.Payload.canary_tenant" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "UPGRADING" },
                  ":p": { "N": "20" },
                  ":cs": { "S": "Canary Rollout: Testing new container image on initial tenant" }
                }
              },
              "ResultPath": "$.canary_ddb_result",
              "Next": "UpdateCanaryECSImage"
            },
            "UpdateCanaryECSImage": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "UPDATE_TENANT_IMAGE",
                  "tenant_id.$": "$.Fleet.Payload.canary_tenant",
                  "target_image.$": "$.TargetImage"
                }
              },
              "ResultPath": "$.canary_update_result",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.canary_error",
                  "Next": "RollbackCanaryECSImage"
                }
              ],
              "Next": "InitCanaryHealthState"
            },
            "InitCanaryHealthState": {
              "Type": "Pass",
              "Result": {
                "attempts": 0
              },
              "ResultPath": "$.canary_health.Payload",
              "Next": "WaitForCanaryDeployment"
            },
            "WaitForCanaryDeployment": {
              "Type": "Wait",
              "Seconds": 15,
              "Next": "CheckCanaryHealth"
            },
            "CheckCanaryHealth": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "CHECK_TENANT_HEALTH",
                  "tenant_id.$": "$.Fleet.Payload.canary_tenant",
                  "attempt.$": "$.canary_health.Payload.attempts"
                }
              },
              "ResultPath": "$.canary_health",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "IsCanaryHealthy"
            },
            "IsCanaryHealthy": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.canary_health.Payload.healthy",
                  "BooleanEquals": true,
                  "Next": "MarkCanaryCompleteDynamoDB"
                },
                {
                  "Variable": "$.canary_health.Payload.exceeded_max_retries",
                  "BooleanEquals": true,
                  "Next": "RollbackCanaryECSImage"
                }
              ],
              "Default": "RetryCanaryHealth"
            },
            "RetryCanaryHealth": {
              "Type": "Wait",
              "Seconds": 10,
              "Next": "CheckCanaryHealth"
            },
            "RollbackCanaryECSImage": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "ROLLBACK_TENANT_IMAGE",
                  "tenant_id.$": "$.Fleet.Payload.canary_tenant"
                }
              },
              "ResultPath": "$.canary_rollback_result",
              "Next": "MarkCanaryFailedDynamoDB"
            },
            "MarkCanaryFailedDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.Fleet.Payload.canary_tenant" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs, #err = :err",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step",
                  "#err": "last_error"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "ACTIVE" },
                  ":p": { "N": "100" },
                  ":cs": { "S": "Canary container unhealthy; rolled back to previous stable image" },
                  ":err": { "S": "Canary deployment aborted due to container health check failure" }
                }
              },
              "ResultPath": "$.canary_failed_ddb",
              "Next": "CanaryUpgradeFailed"
            },
            "CanaryUpgradeFailed": {
              "Type": "Fail",
              "Error": "CanaryDeploymentFailed",
              "Cause": "Canary tenant health check failed. Rollout aborted across the fleet to prevent outages."
            },
            "MarkCanaryCompleteDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.Fleet.Payload.canary_tenant" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs, #img = :img",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step",
                  "#img": "container_image"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "ACTIVE" },
                  ":p": { "N": "100" },
                  ":cs": { "S": "Ready & Operational (Canary Upgraded)" },
                  ":img": { "S.$": "$.TargetImage" }
                }
              },
              "ResultPath": "$.canary_complete_result",
              "Next": "CheckHasRemainingTenants"
            },
            "CheckHasRemainingTenants": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.Fleet.Payload.remaining_tenants[0]",
                  "IsPresent": true,
                  "Next": "UpgradeRemainingFleetMap"
                }
              ],
              "Default": "PublishFleetUpgradeMetric"
            },
            "UpgradeRemainingFleetMap": {
              "Type": "Map",
              "ItemsPath": "$.Fleet.Payload.remaining_tenants",
              "ItemSelector": {
                "TenantId.$": "$$.Map.Item.Value",
                "TargetImage.$": "$.TargetImage"
              },
              "MaxConcurrency": 2,
              "Iterator": {
                "StartAt": "MarkTenantUpgradingDynamoDB",
                "States": {
                  "MarkTenantUpgradingDynamoDB": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::dynamodb:updateItem",
                    "Parameters": {
                      "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                      "Key": {
                        "tenant_id": { "S.$": "$.TenantId" }
                      },
                      "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                      "ExpressionAttributeNames": {
                        "#st": "status",
                        "#p": "progress",
                        "#cs": "current_step"
                      },
                      "ExpressionAttributeValues": {
                        ":s": { "S": "UPGRADING" },
                        ":p": { "N": "25" },
                        ":cs": { "S": "Updating ECS task definition with new container image" }
                      }
                    },
                    "ResultPath": "$.ddb_result",
                    "Next": "UpdateTenantECSImage"
                  },
                  "UpdateTenantECSImage": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${TenantWorkerLambda.Arn}",
                      "Payload": {
                        "action": "UPDATE_TENANT_IMAGE",
                        "tenant_id.$": "$.TenantId",
                        "target_image.$": "$.TargetImage"
                      }
                    },
                    "ResultPath": "$.update_result",
                    "Catch": [
                      {
                        "ErrorEquals": ["States.ALL"],
                        "ResultPath": "$.error",
                        "Next": "RollbackTenantECSImage"
                      }
                    ],
                    "Next": "InitTenantHealthState"
                  },
                  "InitTenantHealthState": {
                    "Type": "Pass",
                    "Result": {
                      "attempts": 0
                    },
                    "ResultPath": "$.health_check.Payload",
                    "Next": "MarkDeployingDynamoDB"
                  },
                  "MarkDeployingDynamoDB": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::dynamodb:updateItem",
                    "Parameters": {
                      "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                      "Key": {
                        "tenant_id": { "S.$": "$.TenantId" }
                      },
                      "UpdateExpression": "SET #p = :p, #cs = :cs",
                      "ExpressionAttributeNames": {
                        "#p": "progress",
                        "#cs": "current_step"
                      },
                      "ExpressionAttributeValues": {
                        ":p": { "N": "60" },
                        ":cs": { "S": "Rolling deployment in progress; awaiting task stabilization" }
                      }
                    },
                    "ResultPath": "$.ddb_deploy_result",
                    "Next": "WaitForRollingDeployment"
                  },
                  "WaitForRollingDeployment": {
                    "Type": "Wait",
                    "Seconds": 15,
                    "Next": "CheckUpgradedHealth"
                  },
                  "CheckUpgradedHealth": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${TenantWorkerLambda.Arn}",
                      "Payload": {
                        "action": "CHECK_TENANT_HEALTH",
                        "tenant_id.$": "$.TenantId",
                        "attempt.$": "$.health_check.Payload.attempts"
                      }
                    },
                    "ResultPath": "$.health_check",
                    "Retry": [
                      {
                        "ErrorEquals": [
                          "Lambda.ServiceException",
                          "Lambda.AWSLambdaException",
                          "Lambda.SdkClientException",
                          "Lambda.TooManyRequestsException"
                        ],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 3,
                        "BackoffRate": 2.0
                      }
                    ],
                    "Next": "IsUpgradeHealthy"
                  },
                  "IsUpgradeHealthy": {
                    "Type": "Choice",
                    "Choices": [
                      {
                        "Variable": "$.health_check.Payload.healthy",
                        "BooleanEquals": true,
                        "Next": "MarkUpgradeCompleteDynamoDB"
                      },
                      {
                        "Variable": "$.health_check.Payload.exceeded_max_retries",
                        "BooleanEquals": true,
                        "Next": "RollbackTenantECSImage"
                      }
                    ],
                    "Default": "RetryUpgradeHealth"
                  },
                  "RetryUpgradeHealth": {
                    "Type": "Wait",
                    "Seconds": 10,
                    "Next": "CheckUpgradedHealth"
                  },
                  "RollbackTenantECSImage": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${TenantWorkerLambda.Arn}",
                      "Payload": {
                        "action": "ROLLBACK_TENANT_IMAGE",
                        "tenant_id.$": "$.TenantId"
                      }
                    },
                    "ResultPath": "$.rollback_result",
                    "Next": "MarkTenantRollbackDynamoDB"
                  },
                  "MarkTenantRollbackDynamoDB": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::dynamodb:updateItem",
                    "Parameters": {
                      "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                      "Key": {
                        "tenant_id": { "S.$": "$.TenantId" }
                      },
                      "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs, #err = :err",
                      "ExpressionAttributeNames": {
                        "#st": "status",
                        "#p": "progress",
                        "#cs": "current_step",
                        "#err": "last_error"
                      },
                      "ExpressionAttributeValues": {
                        ":s": { "S": "ACTIVE" },
                        ":p": { "N": "100" },
                        ":cs": { "S": "Upgrade timed out; rolled back to previous stable image" },
                        ":err": { "S": "Container health check timed out during rolling upgrade" }
                      }
                    },
                    "ResultPath": "$.ddb_rollback_result",
                    "End": true
                  },
                  "MarkUpgradeCompleteDynamoDB": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::dynamodb:updateItem",
                    "Parameters": {
                      "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                      "Key": {
                        "tenant_id": { "S.$": "$.TenantId" }
                      },
                      "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs, #img = :img",
                      "ExpressionAttributeNames": {
                        "#st": "status",
                        "#p": "progress",
                        "#cs": "current_step",
                        "#img": "container_image"
                      },
                      "ExpressionAttributeValues": {
                        ":s": { "S": "ACTIVE" },
                        ":p": { "N": "100" },
                        ":cs": { "S": "Ready & Operational (Upgraded)" },
                        ":img": { "S.$": "$.TargetImage" }
                      }
                    },
                    "ResultPath": "$.ddb_complete_result",
                    "End": true
                  }
                }
              },
              "ResultPath": "$.upgrade_results",
              "Next": "PublishFleetUpgradeMetric"
            },
            "PublishFleetUpgradeMetric": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:cloudwatch:putMetricData",
              "Parameters": {
                "Namespace": "Nextcloud/SaaS",
                "MetricData": [
                  {
                    "MetricName": "FleetImageUpgradeCompleted",
                    "Value": 1.0,
                    "Unit": "Count"
                  }
                ]
              },
              "End": true
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

Outputs:
  TenantFleetUpgradeStateMachineArn:
    Description: Step Functions Tenant Fleet Rolling Upgrade State Machine ARN
    Value: !Ref TenantFleetUpgradeStateMachine
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantFleetUpgradeStateMachineArn"

  TenantProvisioningStateMachineArn:
    Description: Step Functions Tenant Provisioning State Machine ARN
    Value: !Ref TenantProvisioningStateMachine
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantProvisioningStateMachineArn"

  TenantSeedingStateMachineArn:
    Description: Step Functions Tenant Seeding State Machine ARN
    Value: !Ref TenantSeedingStateMachine
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantSeedingStateMachineArn"

  TenantDemoProvisioningStateMachineArn:
    Description: Step Functions Tenant Demo Provisioning State Machine ARN
    Value: !Ref TenantDemoProvisioningStateMachine
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantDemoProvisioningStateMachineArn"

  TenantSuspensionStateMachineArn:
    Description: Step Functions Tenant Suspension State Machine ARN
    Value: !Ref TenantSuspensionStateMachine
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantSuspensionStateMachineArn"

  TenantResumptionStateMachineArn:
    Description: Step Functions Tenant Resumption State Machine ARN
    Value: !Ref TenantResumptionStateMachine
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantResumptionStateMachineArn"

  TenantDeprovisioningStateMachineArn:
    Description: Step Functions Tenant Deprovisioning State Machine ARN
    Value: !Ref TenantDeprovisioningStateMachine
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantDeprovisioningStateMachineArn"

  TenantRegistryTable:
    Description: DynamoDB Tenant Registry Table
    Value: !Ref DynamoDBTenantRegistry
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantRegistryTable"

  AdminUsersTable:
    Description: DynamoDB Enterprise Admin Users Table
    Value: !Ref DynamoDBAdminUsers
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminUsersTable"

  AuditLogsTable:
    Description: DynamoDB Immutable Audit Trail Table
    Value: !Ref DynamoDBAuditLogs
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AuditLogsTable"

  AuditLogGroupName:
    Description: CloudWatch Log Group for Immutable Audit Trail
    Value: !Ref AuditLogGroup
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AuditLogGroupName"

  CognitoUserPoolId:
    Description: Cognito User Pool ID for Enterprise Admin SSO
    Value: !Ref AdminUserPool
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-CognitoUserPoolId"

  CognitoClientId:
    Description: Cognito Client App ID
    Value: !Ref AdminUserPoolClient
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-CognitoClientId"

  AdminWebBucketName:
    Description: S3 Bucket Name for Super Admin Web Console
    Value: !Ref AdminWebBucket
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminWebBucketName"

  AdminWebDistributionId:
    Description: CloudFront Distribution ID for Super Admin Web Console
    Value: !Ref AdminWebDistribution
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminWebDistributionId"

  AdminWebDomainName:
    Description: CloudFront Domain Name for Super Admin Web Console
    Value: !GetAtt AdminWebDistribution.DomainName
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminWebDomainName"

  AdminWebURL:
    Description: CloudFront HTTPS URL for Super Admin Web Console
    Value:
      !If
        - HasAdminCertificate
        - !Sub "https://admin.${RootDomain}"
        - !Sub "https://${AdminWebDistribution.DomainName}"
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminWebURL"

  TenantOperatorLambdaArn:
    Description: Control Plane Tenant Operator Lambda Function ARN
    Value: !GetAtt TenantOperatorLambda.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantOperatorLambdaArn"

  TenantOperatorLambdaFunctionUrl:
    Description: Control Plane Tenant Operator Lambda Function URL
    Value: !GetAtt TenantOperatorFunctionUrl.FunctionUrl
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantOperatorLambdaFunctionUrl"

  TenantWorkerLambdaArn:
    Description: Step Functions Tenant Worker Lambda Function ARN
    Value: !GetAtt TenantWorkerLambda.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantWorkerLambdaArn"

  StepFunctionsLogGroupName:
    Description: CloudWatch Log Group for Step Functions State Machine Executions
    Value: !Ref StepFunctionsLogGroup
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-StepFunctionsLogGroupName"

  StorixEventBusArn:
    Description: Custom EventBus ARN for Tenant Domain Events
    Value: !GetAtt StorixEventBus.Arn
    Export:
      Name: !Sub "${EnvironmentName}-storix-TenantEventBusArn"

  TenantEventsQueueUrl:
    Description: SQS Queue URL for Async Tenant Domain Events
    Value: !Ref TenantEventsQueue
    Export:
      Name: !Sub "${EnvironmentName}-storix-TenantEventsQueueUrl"

  TenantEventsQueueArn:
    Description: SQS Queue ARN for Async Tenant Domain Events
    Value: !GetAtt TenantEventsQueue.Arn
    Export:
      Name: !Sub "${EnvironmentName}-storix-TenantEventsQueueArn"
