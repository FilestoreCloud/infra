                    try:
                        tid=b.get("tenant_id") or q.get("tenant_id") or "dev-tenant"
                        img=b.get("image") or b.get("target_image")
                        if not img:return resp(400,{"error":"image is required"})
                        reg=os.environ.get("AWS_REGION","ap-southeast-1")
                        ecs_cli=boto3.client("ecs",region_name=reg)
                        cl_name=os.environ.get("CLUSTER_NAME") or f"{os.environ.get('ENVIRONMENT_NAME','dev')}-nextcloud-cluster"
                        svc_name=f"{os.environ.get('ENVIRONMENT_NAME','dev')}-nextcloud-service"
                        try:
                            r_desc=ecs_cli.describe_services(cluster=cl_name,services=[f"service-{tid}"])
                            if r_desc.get("services") and r_desc["services"][0].get("status")=="ACTIVE":
                                svc_name=f"service-{tid}"
                        except:pass
                        desc_svc=ecs_cli.describe_services(cluster=cl_name,services=[svc_name])
                        cur_td=desc_svc["services"][0]["taskDefinition"]
                        td_raw=ecs_cli.describe_task_definition(taskDefinition=cur_td)["taskDefinition"]
                        c_defs=td_raw.get("containerDefinitions",[])
                        for c in c_defs:
                            if c.get("name") in ["nextcloud","app"] or len(c_defs)==1:
                                c["image"]=img
                        reg_kwargs={"family":td_raw["family"],"containerDefinitions":c_defs,"volumes":td_raw.get("volumes",[])}
                        for k in ["cpu","memory","networkMode","requiresCompatibilities","taskRoleArn","executionRoleArn"]:
                            if k in td_raw and td_raw[k]:reg_kwargs[k]=td_raw[k]
                        new_td=ecs_cli.register_task_definition(**reg_kwargs)["taskDefinition"]["taskDefinitionArn"]
                        ecs_cli.update_service(cluster=cl_name,service=svc_name,taskDefinition=new_td,deploymentConfiguration={"maximumPercent":200,"minimumHealthyPercent":100,"deploymentCircuitBreaker":{"enable":True,"rollback":True}},forceNewDeployment=True)
                        try:
                            tbl.update_item(Key={"tenant_id":tid},UpdateExpression="SET #img=:img,#td=:td,#lu=:lu",ExpressionAttributeNames={"#img":"image","#td":"task_definition","#lu":"last_updated"},ExpressionAttributeValues={":img":img,":td":new_td,":lu":int(time.time())})
                        except:pass
                        return resp(200,{"status":"UPDATING","tenant_id":tid,"image":img,"task_definition":new_td,"service_name":svc_name,"message":f"Rolling container image upgrade initiated for tenant {tid} to {img}"})
                    except Exception as err:
                        print(f"Error in UPGRADE_TENANT_IMAGE: {err}")
                        return resp(500,{"status":"FAILED","error":str(err)})
                if act in ("DELETE","DEPROVISION"):
                    tid=b.get("tenant_id") or q.get("tenant_id")
                    if not tid:return resp(400,{"error":"tenant_id is required"})
                    tbl.update_item(Key={"tenant_id":tid},UpdateExpression="SET #s=:s,#p=:p,#cs=:cs,#lu=:lu",ExpressionAttributeNames={"#s":"status","#p":"progress","#cs":"current_step","#lu":"last_updated"},ExpressionAttributeValues={":s":"DEPROVISIONING",":p":20,":cs":"Tearing down dedicated AWS resources",":lu":int(time.time())})
                    sfn_arn=os.environ.get("STATE_MACHINE_DEPROVISION_ARN")
                    if sfn_arn:
                        try:
                            sfn_cli=boto3.client("stepfunctions",region_name=os.environ.get("AWS_REGION","ap-southeast-1"))
                            sfn_cli.start_execution(stateMachineArn=sfn_arn,name=f"deprov-{tid}-{int(time.time())}",input=json.dumps({"TenantId":tid}))
                        except Exception as e:
                            print(f"Error starting Deprovision SFN: {e}")
                    return resp(200,{"status":"DEPROVISIONING","tenant_id":tid,"message":f"Tenant {tid} deprovisioning initiated"})
                if act=="AUDIT_LOGS":
                    return resp(200,{"status":"OK","audit_logs":[{"event_id":"evt-1","action":"TENANT_LIST","actor":"nhphuong.code@gmail.com","timestamp":int(time.time()),"status":"SUCCESS"}]})
                if act in ("STREAM_SFN_PROGRESS","GET_LIVE_EXECUTION_PROGRESS","GET_EXECUTION_PROGRESS"):
                    tid=b.get("tenant_id") or q.get("tenant_id") or "tenant-alpha"
                    r=tbl.get_item(Key={"tenant_id":tid}) if TBL else {}
                    it=r.get("Item",{})
                    p=int(it.get("progress",15)) if it.get("progress") else 15
                    st=it.get("status","PROVISIONING")
                    cs=it.get("current_step","Allocating Dedicated Infrastructure (EFS, ECS, ALB)")
                    ms=[
                        {"id":"VALIDATE","name":"Validation & Registry","percent":15,"status":"completed" if p>=15 else "active"},
                        {"id":"DATABASE","name":"Postgres Isolation","percent":35,"status":"completed" if p>35 else ("active" if p==35 else "pending")},
                        {"id":"STORAGE","name":"EFS Storage Allocation","percent":55,"status":"completed" if p>55 else ("active" if p==55 else "pending")},
                        {"id":"COMPUTE","name":"ECS Task Registration","percent":75,"status":"completed" if p>75 else ("active" if p==75 else "pending")},
                        {"id":"HEALTH_CHECK","name":"Health Probe & Ingress","percent":90,"status":"completed" if p>90 else ("active" if p==90 else "pending")},
                        {"id":"ACTIVE","name":"Operational Active","percent":100,"status":"completed" if p>=100 else "pending"}
                    ]
                    return resp(200,{"tenantId":tid,"status":st,"progress":p,"currentStep":cs,"elapsedSeconds":24,"estimatedRemainingSeconds":max(0,int((100-p)*0.8)),"milestones":ms,"liveStream":True})
                return resp(200,{"status":"OK","action":act or "HEALTH","service":"storix-control-plane"})
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

  TenantOperatorFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt TenantOperatorLambda.Arn
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - "*"
        MaxAge: 86400

  TenantOperatorUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TenantOperatorLambda
      FunctionUrlAuthType: NONE
      Action: lambda:InvokeFunctionUrl
      Principal: "*"

  TenantOperatorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TenantOperatorLambda
      Action: lambda:InvokeFunction
      Principal: "*"

  TenantWorkerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-tenant-worker-lambda-role"
      Description: "Least-privilege execution role for Step Functions Worker Lambda executing ECS/ALB/EFS tasks"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TenantWorkerTaskExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECSServiceManagement
                Effect: Allow
                Action:
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTaskDefinitions
                  - ecs:RunTask
                  - ecs:DescribeTasks
                  - ecs:StopTask
                  - ecs:TagResource
                Resource: "*"
              - Sid: ELBTargetGroupAndRuleManagement
                Effect: Allow
                Action:
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:DeleteRule
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: "*"
              - Sid: EFSConfigAccessPointManagement
                Effect: Allow
                Action:
                  - elasticfilesystem:CreateAccessPoint
                  - elasticfilesystem:DeleteAccessPoint
                  - elasticfilesystem:DescribeAccessPoints
                  - elasticfilesystem:TagResource
                Resource: "*"
              - Sid: SSMParameterRetrieval
                Effect: Allow
                Action:
                  - ssm:GetParametersByPath
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nextcloud/${EnvironmentName}*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nextcloud/${EnvironmentName}/*"
              - Sid: DynamoDBStateSync
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt DynamoDBTenantRegistry.Arn
              - Sid: CloudWatchMetricsEmission
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
              - Sid: IAMPassRoleForTaskExecution
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: S3TenantDataPurge
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub "arn:aws:s3:::${EnvironmentName}-nextcloud-vault-*"
                  - !Sub "arn:aws:s3:::${EnvironmentName}-nextcloud-vault-*/*"
              - Sid: SecretsManagerTenantManagement
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:CreateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:TagResource
                  - secretsmanager:DeleteSecret
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/nextcloud/${EnvironmentName}/*"

  TenantWorkerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-nextcloud-tenant-worker"
      Description: "Step Functions micro-task worker for Nextcloud dedicated tenant provisioning and lifecycle operations"
      Runtime: python3.11
      Handler: !If [HasLambdaS3Code, "tenant_worker_lambda.lambda_handler", "index.lambda_handler"]
      Role: !GetAtt TenantWorkerLambdaRole.Arn
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          TABLE_NAME: !Ref DynamoDBTenantRegistry
          CLUSTER_NAME:
            Fn::If:
              - HasECSClusterName
              - !Ref ECSClusterName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSClusterName"
      Code: !If
        - HasLambdaS3Code
        - S3Bucket: !Ref LambdaCodeBucket
          S3Key: !Ref LambdaCodeKey
        - ZipFile: |
            import json, os, time
            def lambda_handler(event, context):
                act = (event.get("action") or "").upper()
                tid = event.get("tenant_id", "")
                print(f"[TenantWorkerLambda] Received task: {act} for tenant: {tid}")
                if act == "CHECK_TENANT_HEALTH":
                    return {"healthy": True, "tenant_id": tid, "status": "HEALTHY"}
                return {"status": "SUCCESS", "action": act, "tenant_id": tid, "healthy": True}
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

  TenantWorkerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TenantWorkerLambda
      Action: lambda:InvokeFunction
      Principal: states.amazonaws.com

