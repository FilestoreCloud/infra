AWSTemplateFormatVersion: "2010-09-09"
Description: "Nextcloud Multi-Tenant SaaS - Module 06: SaaS Control Plane (DynamoDB Tenant Registry, SuperAdmin API, SSM Automation Runbook, Web Console)"

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Environment prefix (prod, staging, dev)

  S3VaultBucketArn:
    Type: String
    Default: ""
    Description: S3 Vault Bucket ARN for Tenant Operator cleanup permissions (Leave blank to import from Module 03)

  ApplicationLoadBalancerDNS:
    Type: String
    Default: ""
    Description: ALB DNS Name for backend API routing fallback (Leave blank to import from Module 05)

  ECSClusterName:
    Type: String
    Default: ""
    Description: ECS Cluster Name for Tenant Operator lifecycle management (Leave blank to import from Module 05)

  ApiOriginDomain:
    Type: String
    Default: ""
    Description: "Optional backend API domain (Lambda Function URL domain without https:// or ALB DNS). If omitted, falls back to ApplicationLoadBalancerDNS."

  GitHubOrg:
    Type: String
    Default: "FilestoreCloud"
    Description: "GitHub Organization name for OIDC trust policies"

  LambdaCodeBucket:
    Type: String
    Default: ""
    Description: "Optional S3 bucket containing tenant_operator_lambda code zip. If omitted, uses bootstrap handler."

  LambdaCodeKey:
    Type: String
    Default: "tenant_operator_lambda.zip"
    Description: "Optional S3 key containing tenant_operator_lambda code zip."

Conditions:
  HasCustomApiOrigin: !Not [!Equals [!Ref ApiOriginDomain, ""]]
  HasLambdaS3Code: !Not [!Equals [!Ref LambdaCodeBucket, ""]]
  HasS3VaultBucketArn: !Not [!Equals [!Ref S3VaultBucketArn, ""]]
  HasECSClusterName: !Not [!Equals [!Ref ECSClusterName, ""]]

Resources:
  DynamoDBTenantRegistry:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  DynamoDBAdminUsers:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-nextcloud-admin-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  DynamoDBAuditLogs:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-nextcloud-audit-logs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/audit/${EnvironmentName}-nextcloud-control-plane"
      RetentionInDays: 365
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${EnvironmentName}-nextcloud-admin-pool"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: "OPTIONAL"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserPoolTags:
        Environment: !Ref EnvironmentName
        Application: Nextcloud-SaaS-Control-Plane

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${EnvironmentName}-nextcloud-admin-client"
      UserPoolId: !Ref AdminUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  SSMAutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-nextcloud-ssm-automation-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TenantOperatorPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt DynamoDBTenantRegistry.Arn
                  - !GetAtt DynamoDBAdminUsers.Arn
                  - !GetAtt DynamoDBAuditLogs.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuditLogGroup.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - Fn::If:
                      - HasS3VaultBucketArn
                      - !Ref S3VaultBucketArn
                      - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketArn"
                  - Fn::Sub:
                      - "${BucketArn}/*"
                      - BucketArn:
                          Fn::If:
                            - HasS3VaultBucketArn
                            - !Ref S3VaultBucketArn
                            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketArn"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: "*"

  SSMTenantOperatorRunbook:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "${EnvironmentName}-Tenant-Lifecycle-Operator"
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        description: Native AWS Automation Runbook for Nextcloud Tenant Lifecycle Management (Provision, Suspend, Resume, Deprovision)
        schemaVersion: "0.3"
        assumeRole: !GetAtt SSMAutomationRole.Arn
        parameters:
          TenantId:
            type: String
            description: Unique Identifier for the Tenant (e.g. acme-corp, globex-corp)
          Action:
            type: String
            allowedValues:
              - PROVISION
              - SUSPEND
              - RESUME
              - DEPROVISION
            description: Tenant Lifecycle State Transition
          StorageQuotaGB:
            type: String
            default: "100"
            description: Storage quota in GB (Applicable when Action is PROVISION)
          CompanyDomain:
            type: String
            default: "tenant.local"
            description: Custom domain for the tenant (Applicable when Action is PROVISION)
        mainSteps:
          - name: ChooseActionBranch
            action: aws:branch
            inputs:
              Choices:
                - NextStep: ProvisionTenantInDynamoDB
                  Variable: "{{ Action }}"
                  StringEquals: PROVISION
                - NextStep: SuspendTenantInDynamoDB
                  Variable: "{{ Action }}"
                  StringEquals: SUSPEND
                - NextStep: ResumeTenantInDynamoDB
                  Variable: "{{ Action }}"
                  StringEquals: RESUME
                - NextStep: DeprovisionTenantInDynamoDB
                  Variable: "{{ Action }}"
                  StringEquals: DEPROVISION

          # 1. PROVISION STEP: Create Tenant Record & Publish Initial Metric
          - name: ProvisionTenantInDynamoDB
            action: aws:executeAwsApi
            inputs:
              Service: dynamodb
              Api: PutItem
              TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
              Item:
                tenant_id:
                  S: "{{ TenantId }}"
                status:
                  S: ACTIVE
                quota_gb:
                  N: "{{ StorageQuotaGB }}"
                domain:
                  S: "{{ CompanyDomain }}"
                created_at:
                  S: "{{ global:DATE_TIME }}"
                last_updated:
                  S: "{{ global:DATE_TIME }}"
              ConditionExpression: "attribute_not_exists(tenant_id)"
            nextStep: PublishTenantActiveMetric

          - name: PublishTenantActiveMetric
            action: aws:executeAwsApi
            inputs:
              Service: cloudwatch
              Api: PutMetricData
              Namespace: Nextcloud/SaaS
              MetricData:
                - MetricName: TenantStorageUsedMB
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 0.1
                  Unit: Megabytes
                - MetricName: TenantActiveStatus
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 1
                  Unit: Count
            isEnd: true

          # 2. SUSPEND STEP: Set Status SUSPENDED & TenantActiveStatus = 0
          - name: SuspendTenantInDynamoDB
            action: aws:executeAwsApi
            inputs:
              Service: dynamodb
              Api: UpdateItem
              TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
              Key:
                tenant_id:
                  S: "{{ TenantId }}"
              UpdateExpression: "SET #st = :s, #lu = :t"
              ExpressionAttributeNames:
                "#st": status
                "#lu": last_updated
              ExpressionAttributeValues:
                ":s":
                  S: SUSPENDED
                ":t":
                  S: "{{ global:DATE_TIME }}"
            nextStep: PublishTenantSuspendedMetric

          - name: PublishTenantSuspendedMetric
            action: aws:executeAwsApi
            inputs:
              Service: cloudwatch
              Api: PutMetricData
              Namespace: Nextcloud/SaaS
              MetricData:
                - MetricName: TenantActiveStatus
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 0
                  Unit: Count
            isEnd: true

          # 3. RESUME STEP: Restore Status ACTIVE & TenantActiveStatus = 1
          - name: ResumeTenantInDynamoDB
            action: aws:executeAwsApi
            inputs:
              Service: dynamodb
              Api: UpdateItem
              TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
              Key:
                tenant_id:
                  S: "{{ TenantId }}"
              UpdateExpression: "SET #st = :s, #lu = :t"
              ExpressionAttributeNames:
                "#st": status
                "#lu": last_updated
              ExpressionAttributeValues:
                ":s":
                  S: ACTIVE
                ":t":
                  S: "{{ global:DATE_TIME }}"
            nextStep: PublishTenantResumedMetric

          - name: PublishTenantResumedMetric
            action: aws:executeAwsApi
            inputs:
              Service: cloudwatch
              Api: PutMetricData
              Namespace: Nextcloud/SaaS
              MetricData:
                - MetricName: TenantActiveStatus
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 1
                  Unit: Count
            isEnd: true

          # 4. DEPROVISION STEP: Delete Record from DynamoDB & Mark Status = -1
          - name: DeprovisionTenantInDynamoDB
            action: aws:executeAwsApi
            inputs:
              Service: dynamodb
              Api: DeleteItem
              TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
              Key:
                tenant_id:
                  S: "{{ TenantId }}"
            nextStep: PublishTenantDeprovisionedMetric

          - name: PublishTenantDeprovisionedMetric
            action: aws:executeAwsApi
            inputs:
              Service: cloudwatch
              Api: PutMetricData
              Namespace: Nextcloud/SaaS
              MetricData:
                - MetricName: TenantActiveStatus
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 0
                  Unit: Count
            isEnd: true

  # ============================================================================
  # SUPER ADMIN WEB HOSTING (S3 + CLOUDFRONT)
  # ============================================================================
  AdminWebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-nextcloud-admin-web-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SuperAdmin-Web

  AdminWebCloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-nextcloud-admin-web-oac"
        Description: "Origin Access Control for Super Admin Web S3 bucket"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AdminWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminWebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AdminWebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminWebDistribution}"

  AdminWebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Nextcloud SaaS Super Admin Web Console (${EnvironmentName})"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3-AdminWebOrigin
            DomainName: !GetAtt AdminWebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AdminWebCloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: BackendApiOrigin
            DomainName:
              !If [
                HasCustomApiOrigin,
                !Ref ApiOriginDomain,
                !Select [
                  2,
                  !Split ["/", !GetAtt TenantOperatorFunctionUrl.FunctionUrl],
                ],
              ]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3-AdminWebOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: "/api*"
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SuperAdmin-Web

  TenantOperatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-tenant-operator-lambda-role"
      Description: "Least-privilege execution role for Nextcloud SaaS Control Plane Lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ControlPlaneLeastPrivilegePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBOperations
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt DynamoDBTenantRegistry.Arn
                  - !GetAtt DynamoDBAdminUsers.Arn
                  - !GetAtt DynamoDBAuditLogs.Arn
                  - !Sub "${DynamoDBAuditLogs.Arn}/index/*"
              - Sid: ECSServiceControl
                Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster:
                      Fn::Sub:
                        - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${CName}"
                        - CName:
                            Fn::If:
                              - HasECSClusterName
                              - !Ref ECSClusterName
                              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSClusterName"
              - Sid: SSMRunbookExecution
                Effect: Allow
                Action:
                  - ssm:StartAutomationExecution
                  - ssm:GetAutomationExecution
                  - ssm:StopAutomationExecution
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${SSMTenantOperatorRunbook}:*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*"
              - Sid: CloudWatchTelemetry
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricWidgetImage
                Resource: "*"
              - Sid: ContainerLogInspection
                Effect: Allow
                Action:
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${EnvironmentName}-*:*"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  TenantOperatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-nextcloud-tenant-operator"
      Description: "SaaS Control Plane REST API controller for tenant fleet lifecycle operations"
      Runtime: python3.11
      Handler: tenant_operator_lambda.lambda_handler
      Role: !GetAtt TenantOperatorLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          TABLE_NAME: !Ref DynamoDBTenantRegistry
          ADMIN_USERS_TABLE: !Ref DynamoDBAdminUsers
          AUDIT_LOGS_TABLE: !Ref DynamoDBAuditLogs
          CLUSTER_NAME:
            Fn::If:
              - HasECSClusterName
              - !Ref ECSClusterName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSClusterName"
          SSM_RUNBOOK_NAME: !Ref SSMTenantOperatorRunbook
      Code: !If
        - HasLambdaS3Code
        - S3Bucket: !Ref LambdaCodeBucket
          S3Key: !Ref LambdaCodeKey
        - ZipFile: |
            import json
            def lambda_handler(event, context):
                method = event.get('httpMethod', 'GET')
                action = json.loads(event.get('body', '{}')).get('action') if event.get('body') else event.get('queryStringParameters', {}).get('action', 'HEALTH')
                return {
                    'statusCode': 200,
                    'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                    'body': json.dumps({'status': 'OK', 'action': action, 'service': 'Nextcloud-SaaS-Control-Plane'})
                }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  TenantOperatorFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt TenantOperatorLambda.Arn
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - "*"
        MaxAge: 86400

  TenantOperatorUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TenantOperatorLambda
      FunctionUrlAuthType: NONE
      Action: lambda:InvokeFunctionUrl
      Principal: "*"

  ConsoleDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-console-deployer-role"
      Description: "Least-privilege role for FilestoreCloud/console CI/CD to deploy SPA to S3, invalidate CloudFront, and invoke Lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/console:*"
      Policies:
        - PolicyName: S3WebConsoleDeployPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3SyncAdminWeb
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt AdminWebBucket.Arn
                  - !Sub "${AdminWebBucket.Arn}/*"
              - Sid: CloudFrontInvalidation
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource:
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminWebDistribution}"
              - Sid: InvokeControlPlaneLambda
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:InvokeFunctionUrl
                Resource:
                  - !GetAtt TenantOperatorLambda.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Service
          Value: Console-CI-CD

  # SSM Parameter Store exports
  SSMTenantRegistry:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/tenant-registry-table"
      Type: String
      Value: !Ref DynamoDBTenantRegistry
      Description: DynamoDB Tenant Registry Table Name
      Tags:
        Environment: !Ref EnvironmentName

  SSMAutomationRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/ssm-operator-role-arn"
      Type: String
      Value: !GetAtt SSMAutomationRole.Arn
      Description: SSM Operator Role ARN
      Tags:
        Environment: !Ref EnvironmentName

  SSMAdminWebBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/control-plane/admin-web-bucket"
      Type: String
      Value: !Ref AdminWebBucket
      Description: S3 Bucket Name for Super Admin Web Console
      Tags:
        Environment: !Ref EnvironmentName

  SSMAdminWebDistributionId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/control-plane/cloudfront-distribution-id"
      Type: String
      Value: !Ref AdminWebDistribution
      Description: CloudFront Distribution ID for Super Admin Web Console
      Tags:
        Environment: !Ref EnvironmentName

  SSMAdminWebURL:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/control-plane/admin-web-url"
      Type: String
      Value: !Sub "https://${AdminWebDistribution.DomainName}"
      Description: CloudFront HTTPS URL for Super Admin Web Console
      Tags:
        Environment: !Ref EnvironmentName

  SSMAdminUsersTable:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/control-plane/admin-users-table"
      Type: String
      Value: !Ref DynamoDBAdminUsers
      Description: DynamoDB Admin Users Table
      Tags:
        Environment: !Ref EnvironmentName

  SSMAuditLogsTable:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/control-plane/audit-logs-table"
      Type: String
      Value: !Ref DynamoDBAuditLogs
      Description: DynamoDB Immutable Audit Logs Table
      Tags:
        Environment: !Ref EnvironmentName

  SSMAuditLogGroup:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/control-plane/audit-log-group"
      Type: String
      Value: !Ref AuditLogGroup
      Description: CloudWatch Log Group for Immutable Audit Trail
      Tags:
        Environment: !Ref EnvironmentName

  SSMCognitoUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/control-plane/cognito-user-pool-id"
      Type: String
      Value: !Ref AdminUserPool
      Description: Cognito User Pool ID for Enterprise Super Admin SSO
      Tags:
        Environment: !Ref EnvironmentName

  SSMCognitoClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/control-plane/cognito-client-id"
      Type: String
      Value: !Ref AdminUserPoolClient
      Description: Cognito Client ID for Super Admin SSO
      Tags:
        Environment: !Ref EnvironmentName

Outputs:
  TenantRegistryTable:
    Description: DynamoDB Tenant Registry Table
    Value: !Ref DynamoDBTenantRegistry
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantRegistryTable"

  AdminUsersTable:
    Description: DynamoDB Enterprise Admin Users Table
    Value: !Ref DynamoDBAdminUsers
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminUsersTable"

  AuditLogsTable:
    Description: DynamoDB Immutable Audit Trail Table
    Value: !Ref DynamoDBAuditLogs
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AuditLogsTable"

  AuditLogGroupName:
    Description: CloudWatch Log Group for Immutable Audit Trail
    Value: !Ref AuditLogGroup
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AuditLogGroupName"

  CognitoUserPoolId:
    Description: Cognito User Pool ID for Enterprise Admin SSO
    Value: !Ref AdminUserPool
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-CognitoUserPoolId"

  CognitoClientId:
    Description: Cognito Client App ID
    Value: !Ref AdminUserPoolClient
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-CognitoClientId"

  SSMAutomationRoleArn:
    Description: SSM Automation Role ARN
    Value: !GetAtt SSMAutomationRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-SSMAutomationRoleArn"

  SSMRunbookName:
    Description: SSM Tenant Operator Runbook Name
    Value: !Ref SSMTenantOperatorRunbook
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-SSMRunbookName"

  AdminWebBucketName:
    Description: S3 Bucket Name for Super Admin Web Console
    Value: !Ref AdminWebBucket
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminWebBucketName"

  AdminWebDistributionId:
    Description: CloudFront Distribution ID for Super Admin Web Console
    Value: !Ref AdminWebDistribution
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminWebDistributionId"

  AdminWebDomainName:
    Description: CloudFront Domain Name for Super Admin Web Console
    Value: !GetAtt AdminWebDistribution.DomainName
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminWebDomainName"

  AdminWebURL:
    Description: CloudFront HTTPS URL for Super Admin Web Console
    Value: !Sub "https://${AdminWebDistribution.DomainName}"
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-AdminWebURL"

  TenantOperatorLambdaArn:
    Description: Control Plane Tenant Operator Lambda Function ARN
    Value: !GetAtt TenantOperatorLambda.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantOperatorLambdaArn"

  TenantOperatorLambdaFunctionUrl:
    Description: Control Plane Tenant Operator Lambda Function URL
    Value: !GetAtt TenantOperatorFunctionUrl.FunctionUrl
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-TenantOperatorLambdaFunctionUrl"

  ConsoleDeployerRoleArn:
    Description: Least-privilege IAM Role ARN for FilestoreCloud/console repository CI/CD
    Value: !GetAtt ConsoleDeployerRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-ConsoleDeployerRoleArn"
