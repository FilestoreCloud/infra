  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-nextcloud-sfn-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TenantLifecycleStatePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt DynamoDBTenantRegistry.Arn
                  - !GetAtt DynamoDBAuditLogs.Arn
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt TenantOperatorLambda.Arn
                  - !Sub "${TenantOperatorLambda.Arn}:*"
                  - !GetAtt TenantWorkerLambda.Arn
                  - !Sub "${TenantWorkerLambda.Arn}:*"
              - Effect: Allow
                Action:
                  - states:StartExecution
                  - states:DescribeExecution
                  - states:StopExecution
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: "*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  TenantProvisioningStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Provisioning"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions State Machine for Nextcloud Multi-Tenant Provisioning with Real-Time Progress, Saga Rollback & Loop Limiter",
          "TimeoutSeconds": 600,
          "StartAt": "ProvisionMarkDynamoDB",
          "States": {
            "ProvisionMarkDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :st, #pr = :pr, #cs = :cs, #q = :q, #dm = :dm",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#pr": "progress",
                  "#cs": "current_step",
                  "#q": "quota_gb",
                  "#dm": "domain"
                },
                "ExpressionAttributeValues": {
                  ":st": { "S": "PROVISIONING" },
                  ":pr": { "N": "15" },
                  ":cs": { "S": "Initializing Registry & Allocating Ingress" },
                  ":q": { "N.$": "$.StorageQuotaGB" },
                  ":dm": { "S.$": "$.CompanyDomain" }
                }
              },
              "ResultPath": "$.ddb_result",
              "Next": "ProvisionTenantResources"
            },
            "ProvisionTenantResources": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "PROVISION_TENANT_RESOURCES",
                  "tenant_id.$": "$.TenantId",
                  "domain.$": "$.CompanyDomain",
                  "quota_gb.$": "$.StorageQuotaGB",
                  "admin_email.$": "$.AdminEmail"
                }
              },
              "ResultPath": "$.provision_result",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "SagaRollback"
                }
              ],
              "Next": "MarkInfraAllocated"
            },
            "MarkInfraAllocated": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":p": { "N": "45" },
                  ":cs": { "S": "Allocating Dedicated Infrastructure (EFS, ECS, ALB)" }
                }
              },
              "ResultPath": "$.infra_mark_result",
              "Next": "InitHealthCheckState"
            },
            "InitHealthCheckState": {
              "Type": "Pass",
              "Result": {
                "attempts": 0
              },
              "ResultPath": "$.health_check.Payload",
              "Next": "WaitForContainerHealthy"
            },
            "WaitForContainerHealthy": {
              "Type": "Wait",
              "Seconds": 15,
              "Next": "CheckHealthStatus"
            },
            "CheckHealthStatus": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "CHECK_TENANT_HEALTH",
                  "tenant_id.$": "$.TenantId",
                  "domain.$": "$.CompanyDomain",
                  "attempt.$": "$.health_check.Payload.attempts"
                }
              },
              "ResultPath": "$.health_check",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "SagaRollback"
                }
              ],
              "Next": "IsContainerHealthy"
            },
            "IsContainerHealthy": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.health_check.Payload.healthy",
                  "BooleanEquals": true,
                  "Next": "MarkContainerHealthy"
                },
                {
                  "Variable": "$.health_check.Payload.exceeded_max_retries",
                  "BooleanEquals": true,
                  "Next": "SagaRollback"
                }
              ],
              "Default": "RetryHealthCheck"
            },
            "RetryHealthCheck": {
              "Type": "Wait",
              "Seconds": 10,
              "Next": "CheckHealthStatus"
            },
            "MarkContainerHealthy": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":p": { "N": "85" },
                  ":cs": { "S": "Fargate Container Healthy (/status.php 200 OK)" }
                }
              },
              "ResultPath": "$.health_mark_result",
              "Next": "MarkProvisionActive"
            },
            "MarkProvisionActive": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "ACTIVE" },
                  ":p": { "N": "100" },
                  ":cs": { "S": "Ready & Operational" }
                }
              },
              "ResultPath": "$.active_result",
              "Next": "PublishProvisionMetric"
            },
            "PublishProvisionMetric": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:cloudwatch:putMetricData",
              "Parameters": {
                "Namespace": "Nextcloud/SaaS",
                "MetricData": [
                  {
                    "MetricName": "TenantActiveStatus",
                    "Dimensions": [
                      {
                        "Name": "TenantId",
                        "Value.$": "$.TenantId"
                      }
                    ],
                    "Value": 1.0,
                    "Unit": "Count"
                  }
                ]
              },
              "End": true
            },
            "SagaRollback": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "SAGA_CLEANUP_TENANT",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.rollback_result",
              "Next": "MarkProvisionFailed"
            },
            "MarkProvisionFailed": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs, #err = :e",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step",
                  "#err": "last_error"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "FAILED" },
                  ":p": { "N": "0" },
                  ":cs": { "S": "Provisioning failed and rolled back" },
                  ":e": { "S": "Provisioning failed during container/resource initialization" }
                }
              },
              "Next": "ProvisionFailed"
            },
            "ProvisionFailed": {
              "Type": "Fail",
              "Error": "ProvisioningFailed",
              "Cause": "Tenant provisioning failed and Saga compensation rolled back partial resources."
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix
  TenantSuspensionStateMachine:
