  TenantResumptionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-Tenant-Resumption"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub |
        {
          "Comment": "AWS Step Functions State Machine for Nextcloud Tenant Resumption with Loop Limiter",
          "TimeoutSeconds": 600,
          "StartAt": "MarkResumingDynamoDB",
          "States": {
            "MarkResumingDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "RESUMING" },
                  ":p": { "N": "25" },
                  ":cs": { "S": "Scaling ECS Fargate task to 1" }
                }
              },
              "ResultPath": "$.ddb_resuming_result",
              "Next": "ResumeScaleECS"
            },
            "ResumeScaleECS": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "RESUME",
                  "tenant_id.$": "$.TenantId"
                }
              },
              "ResultPath": "$.resume_result",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "InitResumeHealthState"
            },
            "InitResumeHealthState": {
              "Type": "Pass",
              "Result": {
                "attempts": 0
              },
              "ResultPath": "$.health_check.Payload",
              "Next": "WaitForResumeHealthy"
            },
            "WaitForResumeHealthy": {
              "Type": "Wait",
              "Seconds": 15,
              "Next": "MarkCheckingHealthDynamoDB"
            },
            "MarkCheckingHealthDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":p": { "N": "65" },
                  ":cs": { "S": "Checking container health (/status.php 200 OK)" }
                }
              },
              "ResultPath": "$.ddb_health_step_result",
              "Next": "CheckResumeHealth"
            },
            "CheckResumeHealth": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${TenantWorkerLambda.Arn}",
                "Payload": {
                  "action": "CHECK_TENANT_HEALTH",
                  "tenant_id.$": "$.TenantId",
                  "attempt.$": "$.health_check.Payload.attempts"
                }
              },
              "ResultPath": "$.health_check",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "IsResumeHealthy"
            },
            "IsResumeHealthy": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.health_check.Payload.healthy",
                  "BooleanEquals": true,
                  "Next": "MarkResumedDynamoDB"
                },
                {
                  "Variable": "$.health_check.Payload.exceeded_max_retries",
                  "BooleanEquals": true,
                  "Next": "MarkResumeFailedDynamoDB"
                }
              ],
              "Default": "RetryResumeHealth"
            },
            "RetryResumeHealth": {
              "Type": "Wait",
              "Seconds": 10,
              "Next": "CheckResumeHealth"
            },
            "MarkResumeFailedDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #cs = :cs, #err = :err",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#cs": "current_step",
                  "#err": "last_error"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "FAILED" },
                  ":cs": { "S": "Container health check timed out during resumption" },
                  ":err": { "S": "Health check exceeded maximum retry attempts (15)" }
                }
              },
              "ResultPath": "$.ddb_failed_result",
              "Next": "ResumeFailed"
            },
            "ResumeFailed": {
              "Type": "Fail",
              "Error": "ResumptionHealthTimeout",
              "Cause": "Tenant container failed to become healthy within the allotted retry window."
            },
            "MarkResumedDynamoDB": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${EnvironmentName}-nextcloud-tenant-registry",
                "Key": {
                  "tenant_id": { "S.$": "$.TenantId" }
                },
                "UpdateExpression": "SET #st = :s, #p = :p, #cs = :cs",
                "ExpressionAttributeNames": {
                  "#st": "status",
                  "#p": "progress",
                  "#cs": "current_step"
                },
                "ExpressionAttributeValues": {
                  ":s": { "S": "ACTIVE" },
                  ":p": { "N": "100" },
                  ":cs": { "S": "Ready & Operational" }
                }
              },
              "ResultPath": "$.ddb_result",
              "Next": "PublishResumeMetric"
            },
            "PublishResumeMetric": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:cloudwatch:putMetricData",
              "Parameters": {
                "Namespace": "Nextcloud/SaaS",
                "MetricData": [
                  {
                    "MetricName": "TenantActiveStatus",
                    "Dimensions": [
                      {
                        "Name": "TenantId",
                        "Value.$": "$.TenantId"
                      }
                    ],
                    "Value": 1.0,
                    "Unit": "Count"
                  }
                ]
              },
              "End": true
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

  TenantDeprovisioningStateMachine:
