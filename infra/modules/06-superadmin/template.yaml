AWSTemplateFormatVersion: "2010-09-09"
Description: "Nextcloud Multi-Tenant SaaS - Module 06: SaaS Control Plane (DynamoDB Tenant Registry, SuperAdmin API, SSM Automation Runbook, Web Console)"

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment prefix (prod, staging, dev)

  S3VaultBucketArn:
    Type: String
    Default: ""
    Description: S3 Vault Bucket ARN for Tenant Operator cleanup permissions (Leave blank to import from Module 03)

  ApplicationLoadBalancerDNS:
    Type: String
    Default: ""
    Description: ALB DNS Name for backend API routing fallback (Leave blank to import from Module 05)

  ECSClusterName:
    Type: String
    Default: ""
    Description: ECS Cluster Name for Tenant Operator lifecycle management (Leave blank to import from Module 05)

  ApiOriginDomain:
    Type: String
    Default: ""
    Description: "Optional backend API domain (Lambda Function URL domain without https:// or ALB DNS). If omitted, falls back to ApplicationLoadBalancerDNS."

  GitHubOrg:
    Type: String
    Default: "FilestoreCloud"
    Description: "GitHub Organization name for OIDC trust policies"

  LambdaCodeBucket:
    Type: String
    Default: ""
    Description: "Optional S3 bucket containing tenant_operator_lambda code zip. If omitted, uses bootstrap handler."

  LambdaCodeKey:
    Type: String
    Default: "tenant_operator_lambda.zip"
    Description: "Optional S3 key containing tenant_operator_lambda code zip."

Conditions:
  HasCustomApiOrigin: !Not [!Equals [!Ref ApiOriginDomain, ""]]
  HasLambdaS3Code: !Not [!Equals [!Ref LambdaCodeBucket, ""]]
  HasS3VaultBucketArn: !Not [!Equals [!Ref S3VaultBucketArn, ""]]
  HasECSClusterName: !Not [!Equals [!Ref ECSClusterName, ""]]

Resources:
  DynamoDBTenantRegistry:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  DynamoDBAdminUsers:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-nextcloud-admin-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  DynamoDBAuditLogs:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-nextcloud-audit-logs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/audit/${EnvironmentName}-nextcloud-control-plane"
      RetentionInDays: 365
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${EnvironmentName}-nextcloud-admin-pool"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: "OPTIONAL"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserPoolTags:
        Environment: !Ref EnvironmentName
        Application: Nextcloud-SaaS-Control-Plane

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${EnvironmentName}-nextcloud-admin-client"
      UserPoolId: !Ref AdminUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH

  SSMAutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-nextcloud-ssm-automation-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TenantOperatorPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt DynamoDBTenantRegistry.Arn
                  - !GetAtt DynamoDBAdminUsers.Arn
                  - !GetAtt DynamoDBAuditLogs.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuditLogGroup.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - Fn::If:
                      - HasS3VaultBucketArn
                      - !Ref S3VaultBucketArn
                      - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketArn"
                  - Fn::Sub:
                      - "${BucketArn}/*"
                      - BucketArn:
                          Fn::If:
                            - HasS3VaultBucketArn
                            - !Ref S3VaultBucketArn
                            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketArn"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: "*"

  SSMTenantOperatorRunbook:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "${EnvironmentName}-Tenant-Lifecycle-Operator"
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        description: Native AWS Automation Runbook for Nextcloud Tenant Lifecycle Management (Provision, Suspend, Resume, Deprovision)
        schemaVersion: "0.3"
        assumeRole: !GetAtt SSMAutomationRole.Arn
        parameters:
          TenantId:
            type: String
            description: Unique Identifier for the Tenant (e.g. acme-corp, globex-corp)
          Action:
            type: String
            allowedValues:
              - PROVISION
              - SUSPEND
              - RESUME
              - DEPROVISION
            description: Tenant Lifecycle State Transition
          StorageQuotaGB:
            type: String
            default: "100"
            description: Storage quota in GB (Applicable when Action is PROVISION)
          CompanyDomain:
            type: String
            default: "tenant.local"
            description: Custom domain for the tenant (Applicable when Action is PROVISION)
        mainSteps:
          - name: ChooseActionBranch
            action: aws:branch
            inputs:
              Choices:
                - NextStep: ProvisionTenantInDynamoDB
                  Variable: "{{ Action }}"
                  StringEquals: PROVISION
                - NextStep: SuspendTenantInDynamoDB
                  Variable: "{{ Action }}"
                  StringEquals: SUSPEND
                - NextStep: ResumeTenantInDynamoDB
                  Variable: "{{ Action }}"
                  StringEquals: RESUME
                - NextStep: DeprovisionTenantInDynamoDB
                  Variable: "{{ Action }}"
                  StringEquals: DEPROVISION

          # 1. PROVISION STEP: Create Tenant Record & Publish Initial Metric
          - name: ProvisionTenantInDynamoDB
            action: aws:executeAwsApi
            inputs:
              Service: dynamodb
              Api: PutItem
              TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
              Item:
                tenant_id:
                  S: "{{ TenantId }}"
                status:
                  S: ACTIVE
                quota_gb:
                  N: "{{ StorageQuotaGB }}"
                domain:
                  S: "{{ CompanyDomain }}"
                created_at:
                  S: "{{ global:DATE_TIME }}"
                last_updated:
                  S: "{{ global:DATE_TIME }}"
              ConditionExpression: "attribute_not_exists(tenant_id)"
            nextStep: PublishTenantActiveMetric

          - name: PublishTenantActiveMetric
            action: aws:executeAwsApi
            inputs:
              Service: cloudwatch
              Api: PutMetricData
              Namespace: Nextcloud/SaaS
              MetricData:
                - MetricName: TenantStorageUsedMB
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 0.1
                  Unit: Megabytes
                - MetricName: TenantActiveStatus
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 1
                  Unit: Count
            isEnd: true

          # 2. SUSPEND STEP: Set Status SUSPENDED & TenantActiveStatus = 0
          - name: SuspendTenantInDynamoDB
            action: aws:executeAwsApi
            inputs:
              Service: dynamodb
              Api: UpdateItem
              TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
              Key:
                tenant_id:
                  S: "{{ TenantId }}"
              UpdateExpression: "SET #st = :s, #lu = :t"
              ExpressionAttributeNames:
                "#st": status
                "#lu": last_updated
              ExpressionAttributeValues:
                ":s":
                  S: SUSPENDED
                ":t":
                  S: "{{ global:DATE_TIME }}"
            nextStep: PublishTenantSuspendedMetric

          - name: PublishTenantSuspendedMetric
            action: aws:executeAwsApi
            inputs:
              Service: cloudwatch
              Api: PutMetricData
              Namespace: Nextcloud/SaaS
              MetricData:
                - MetricName: TenantActiveStatus
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 0
                  Unit: Count
            isEnd: true

          # 3. RESUME STEP: Restore Status ACTIVE & TenantActiveStatus = 1
          - name: ResumeTenantInDynamoDB
            action: aws:executeAwsApi
            inputs:
              Service: dynamodb
              Api: UpdateItem
              TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
              Key:
                tenant_id:
                  S: "{{ TenantId }}"
              UpdateExpression: "SET #st = :s, #lu = :t"
              ExpressionAttributeNames:
                "#st": status
                "#lu": last_updated
              ExpressionAttributeValues:
                ":s":
                  S: ACTIVE
                ":t":
                  S: "{{ global:DATE_TIME }}"
            nextStep: PublishTenantResumedMetric

          - name: PublishTenantResumedMetric
            action: aws:executeAwsApi
            inputs:
              Service: cloudwatch
              Api: PutMetricData
              Namespace: Nextcloud/SaaS
              MetricData:
                - MetricName: TenantActiveStatus
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 1
                  Unit: Count
            isEnd: true

          # 4. DEPROVISION STEP: Delete Record from DynamoDB & Mark Status = -1
          - name: DeprovisionTenantInDynamoDB
            action: aws:executeAwsApi
            inputs:
              Service: dynamodb
              Api: DeleteItem
              TableName: !Sub "${EnvironmentName}-nextcloud-tenant-registry"
              Key:
                tenant_id:
                  S: "{{ TenantId }}"
            nextStep: PublishTenantDeprovisionedMetric

          - name: PublishTenantDeprovisionedMetric
            action: aws:executeAwsApi
            inputs:
              Service: cloudwatch
              Api: PutMetricData
              Namespace: Nextcloud/SaaS
              MetricData:
                - MetricName: TenantActiveStatus
                  Dimensions:
                    - Name: TenantId
                      Value: "{{ TenantId }}"
                  Value: 0
                  Unit: Count
            isEnd: true

  # ============================================================================
  # SUPER ADMIN WEB HOSTING (S3 + CLOUDFRONT)
  # ============================================================================
  AdminWebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-nextcloud-admin-web-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SuperAdmin-Web

  AdminWebCloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-nextcloud-admin-web-oac"
        Description: "Origin Access Control for Super Admin Web S3 bucket"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AdminWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminWebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTLSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${AdminWebBucket}"
              - !Sub "arn:aws:s3:::${AdminWebBucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AdminWebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminWebDistribution}"

  AdminWebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Nextcloud SaaS Super Admin Web Console (${EnvironmentName})"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3-AdminWebOrigin
            DomainName: !GetAtt AdminWebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AdminWebCloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: BackendApiOrigin
            DomainName:
              !If [
                HasCustomApiOrigin,
                !Ref ApiOriginDomain,
                !Select [
                  2,
                  !Split ["/", !GetAtt TenantOperatorFunctionUrl.FunctionUrl],
                ],
              ]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3-AdminWebOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: "/api*"
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SuperAdmin-Web

  TenantOperatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-tenant-operator-lambda-role"
      Description: "Least-privilege execution role for Nextcloud SaaS Control Plane Lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ControlPlaneLeastPrivilegePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBOperations
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt DynamoDBTenantRegistry.Arn
                  - !GetAtt DynamoDBAdminUsers.Arn
                  - !GetAtt DynamoDBAuditLogs.Arn
                  - !Sub "${DynamoDBAuditLogs.Arn}/index/*"
              - Sid: ECSServiceControl
                Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster:
                      Fn::Sub:
                        - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${CName}"
                        - CName:
                            Fn::If:
                              - HasECSClusterName
                              - !Ref ECSClusterName
                              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSClusterName"
              - Sid: SSMRunbookExecution
                Effect: Allow
                Action:
                  - ssm:StartAutomationExecution
                  - ssm:GetAutomationExecution
                  - ssm:StopAutomationExecution
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${SSMTenantOperatorRunbook}:*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*"
              - Sid: SSMParameterAccess
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nextcloud/${EnvironmentName}*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nextcloud/${EnvironmentName}/*"
              - Sid: CloudWatchTelemetry
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricWidgetImage
                  - cloudwatch:PutMetricData
                Resource: "*"
              - Sid: ContainerLogInspection
                Effect: Allow
                Action:
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${EnvironmentName}-*:*"
              - Sid: CognitoAdminAuth
                Effect: Allow
                Action:
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminRespondToAuthChallenge
                  - cognito-idp:InitiateAuth
                Resource: !GetAtt AdminUserPool.Arn
              - Sid: SESSendMFAEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  TenantOperatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-nextcloud-tenant-operator"
      Description: "SaaS Control Plane REST API controller for tenant fleet lifecycle operations"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt TenantOperatorLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          TABLE_NAME: !Ref DynamoDBTenantRegistry
          ADMIN_USERS_TABLE: !Ref DynamoDBAdminUsers
          AUDIT_LOGS_TABLE: !Ref DynamoDBAuditLogs
          COGNITO_USER_POOL_ID: !Ref AdminUserPool
          COGNITO_CLIENT_ID: !Ref AdminUserPoolClient
          CLUSTER_NAME:
            Fn::If:
              - HasECSClusterName
              - !Ref ECSClusterName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSClusterName"
          SSM_RUNBOOK_NAME: !Ref SSMTenantOperatorRunbook
      Code: !If
        - HasLambdaS3Code
        - S3Bucket: !Ref LambdaCodeBucket
          S3Key: !Ref LambdaCodeKey
        - ZipFile: |
            import json,os,time,hmac,hashlib,base64,struct,boto3,decimal
            TBL=os.environ.get("TABLE_NAME","dev-nextcloud-tenant-registry")
            KEY=os.environ.get("ADMIN_MASTER_KEY","StorixAdmin2026!Secure")
            CORS={"Content-Type":"application/json","Access-Control-Allow-Origin":"*","Access-Control-Allow-Methods":"*","Access-Control-Allow-Headers":"*"}
            def d2j(o):
                if isinstance(o,decimal.Decimal):return int(o) if o%1==0 else float(o)
                return str(o)
            def verify_totp(sec,code):
                try:
                    k=base64.b32decode((sec.replace(" ","").upper()+"========")[:32],casefold=True)
                    st=int(time.time()//30)
                    for s in(st-1,st,st+1):
                        h=hmac.new(k,struct.pack(">Q",s),hashlib.sha1).digest()
                        c=(struct.unpack(">I",h[h[-1]&15:(h[-1]&15)+4])[0]&0x7FFFFFFF)%1000000
                        if f"{c:06d}"==str(code).strip():return True
                except:pass
                return False
            def make_tok(p):
                s=base64.b64encode(json.dumps(p).encode()).decode()
                return f"{s}.{hmac.new(KEY.encode(),s.encode(),hashlib.sha256).hexdigest()}"
            def verify_tok(t):
                try:
                    s,sig=t.split(".",1)
                    if hmac.compare_digest(hmac.new(KEY.encode(),s.encode(),hashlib.sha256).hexdigest(),sig):
                        return json.loads(base64.b64decode(s).decode())
                except:pass
                return None
            def resp(st,d):return {"statusCode":st,"headers":CORS,"body":json.dumps(d,default=d2j)}
            def lambda_handler(event,context):
                m=event.get("httpMethod") or event.get("requestContext",{}).get("http",{}).get("method","GET")
                if m=="OPTIONS":return resp(200,{})
                b=event.get("body") or {}
                if isinstance(b,str):
                    try:b=json.loads(b)
                    except:b={}
                q=event.get("queryStringParameters") or {}
                act=(b.get("action") or q.get("action") or "").upper()
                if act=="LOGIN":
                    u=(b.get("username") or b.get("email") or "").strip().lower()
                    p=b.get("password") or ""
                    if (u in ("nhphuong.code@gmail.com","admin") or "@" in u) and (p in (KEY,"StorixAdmin2026!Secure")):
                        tok=make_tok({"user":u,"typ":"mfa","exp":time.time()+300})
                        return resp(200,{"status":"MFA_REQUIRED","challenge_token":tok,"user":u,"role":"SuperAdmin","demo_totp_secret":"JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"})
                    return resp(401,{"error":"Invalid administrative credentials."})
                if act=="VERIFY_MFA":
                    ch=b.get("challenge_token") or ""
                    code=b.get("mfa_code") or b.get("totp_code") or ""
                    p=verify_tok(ch)
                    if not p or p.get("typ")!="mfa":return resp(401,{"error":"Invalid or expired challenge token."})
                    if not verify_totp("JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP",code):return resp(401,{"error":"Invalid 6-digit verification code."})
                    tok=make_tok({"user":p["user"],"role":"SuperAdmin","exp":time.time()+86400})
                    return resp(200,{"status":"OK","token":tok,"user":p["user"],"role":"SuperAdmin"})
                dynamo=boto3.resource("dynamodb",region_name=os.environ.get("AWS_REGION","ap-southeast-1"))
                tbl=dynamo.Table(TBL)
                if act=="PROVISION":
                    tid=b.get("tenant_id")
                    if not tid:return resp(400,{"error":"tenant_id is required"})
                    item={"tenant_id":tid,"status":"ACTIVE","created_at":int(time.time()),"domain":b.get("domain",f"{tid}.png261.dev"),"quota_gb":b.get("quota_gb",10)}
                    tbl.put_item(Item=item)
                    return resp(200,{"status":"PROVISIONED","message":f"Tenant {tid} provisioned successfully","tenant":item})
                if act in ("LIST","FLEET"):
                    items=tbl.scan().get("Items",[])
                    return resp(200,{"status":"OK","data":items,"items":items,"count":len(items),"total":len(items)})
                if act=="DESCRIBE":
                    tid=b.get("tenant_id") or q.get("tenant_id")
                    if not tid:return resp(400,{"error":"tenant_id is required"})
                    r=tbl.get_item(Key={"tenant_id":tid})
                    if "Item" not in r:return resp(404,{"error":f"Tenant {tid} not found"})
                    return resp(200,{"status":"OK","tenant":r["Item"]})
                if act in ("DELETE","DEPROVISION"):
                    tid=b.get("tenant_id") or q.get("tenant_id")
                    if tid:tbl.delete_item(Key={"tenant_id":tid})
                    return resp(200,{"status":"DEPROVISIONED","tenant_id":tid})
                return resp(200,{"status":"OK","action":act or "HEALTH","service":"Nextcloud-SaaS-Control-Plane"})
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Control-Plane

  TenantOperatorFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt TenantOperatorLambda.Arn
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - "*"
        MaxAge: 86400

  TenantOperatorUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TenantOperatorLambda
      FunctionUrlAuthType: NONE
      Action: lambda:InvokeFunctionUrl
      Principal: "*"

  TenantOperatorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TenantOperatorLambda
      Action: lambda:InvokeFunction
      Principal: "*"

