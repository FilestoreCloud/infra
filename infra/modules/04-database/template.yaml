AWSTemplateFormatVersion: "2010-09-09"
Description: "Nextcloud Multi-Tenant SaaS - Module 04: Database (RDS PostgreSQL 16 & Secrets Manager)"

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment prefix (prod, staging, dev)

  PrivateSubnet1Id:
    Type: String
    Default: ""
    Description: Private Subnet 1 ID for RDS Subnet Group (Leave blank to import from Module 01)

  PrivateSubnet2Id:
    Type: String
    Default: ""
    Description: Private Subnet 2 ID for RDS Subnet Group (Leave blank to import from Module 01)

  DBSecurityGroupId:
    Type: String
    Default: ""
    Description: Security Group ID for RDS PostgreSQL (Leave blank to import from Module 02)

  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Instance class for RDS PostgreSQL

  DBAllocatedStorage:
    Type: String
    Default: "20"
    Description: Allocated storage in GB

  MaxAllocatedStorage:
    Type: Number
    Default: 100
    Description: Maximum storage limit (in GB) for RDS Storage Auto-Scaling

  DBName:
    Type: String
    Default: nextcloud
    Description: Initial database name

  DBMasterUsername:
    Type: String
    Default: nextcloud
    Description: Master username for PostgreSQL

  DBPassword:
    Type: String
    NoEcho: true
    Description: Master password for RDS PostgreSQL

  EnableRDSProxy:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Whether to provision AWS RDS Proxy for connection pooling and PostgreSQL connection offloading

  EnableRedis:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Whether to provision AWS ElastiCache Redis for distributed caching and transactional file locking

  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
    Description: Cache node type for ElastiCache Redis cluster

  VpcId:
    Type: String
    Default: ""
    Description: VPC ID (leave blank to import from Module 01)

  ECSSecurityGroupId:
    Type: String
    Default: ""
    Description: ECS Security Group ID for Redis access (leave blank to import from Module 02)

Conditions:
  HasPrivateSubnet1Id: !Not [!Equals [!Ref PrivateSubnet1Id, ""]]
  HasPrivateSubnet2Id: !Not [!Equals [!Ref PrivateSubnet2Id, ""]]
  HasDBSecurityGroupId: !Not [!Equals [!Ref DBSecurityGroupId, ""]]
  HasVpcId: !Not [!Equals [!Ref VpcId, ""]]
  HasECSSecurityGroupId: !Not [!Equals [!Ref ECSSecurityGroupId, ""]]
  ShouldEnableRDSProxy: !Equals [!Ref EnableRDSProxy, "true"]
  ShouldEnableRedis: !Equals [!Ref EnableRedis, "true"]

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private Subnet Group for RDS PostgreSQL
      SubnetIds:
        - Fn::If:
            - HasPrivateSubnet1Id
            - !Ref PrivateSubnet1Id
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PrivateSubnet1Id"
        - Fn::If:
            - HasPrivateSubnet2Id
            - !Ref PrivateSubnet2Id
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PrivateSubnet2Id"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-subnet-group"
        - Key: Environment
          Value: !Ref EnvironmentName

  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Parameter group for Nextcloud PostgreSQL 16 with SSL enforced and connection tuning
      Family: postgres16
      Parameters:
        rds.force_ssl: "1"
        idle_in_transaction_session_timeout: "60000"
        log_min_duration_statement: "2000"
        tcp_keepalives_idle: "30"
        tcp_keepalives_interval: "10"
        tcp_keepalives_count: "5"
        statement_timeout: "60000"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-parameter-group"
        - Key: Environment
          Value: !Ref EnvironmentName

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-nextcloud-db"
      Engine: postgres
      EngineVersion: "16.10"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref MaxAllocatedStorage
      StorageType: gp3
      DBName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBParameterGroupName: !Ref DBParameterGroup
      VPCSecurityGroups:
        - Fn::If:
            - HasDBSecurityGroupId
            - !Ref DBSecurityGroupId
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-DBSecurityGroupId"
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nextcloud-postgres"
        - Key: Environment
          Value: !Ref EnvironmentName

  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/secrets/db-credentials"
      Description: Database credentials for Nextcloud RDS PostgreSQL
      SecretString: !Sub |
        {
          "engine": "postgres",
          "host": "${RDSInstance.Endpoint.Address}",
          "port": 5432,
          "username": "${DBMasterUsername}",
          "password": "${DBPassword}",
          "dbname": "${DBName}"
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ============================================================================
  # RDS PROXY & CONNECTION POOLING (Requirement 3: Connection Offloading)
  # ============================================================================
  RDSProxyIAMRole:
    Type: AWS::IAM::Role
    Condition: ShouldEnableRDSProxy
    Properties:
      RoleName: !Sub "${EnvironmentName}-nextcloud-rds-proxy-role"
      Description: IAM role allowing RDS Proxy to read master credentials from Secrets Manager
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProxySecretAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DBSecret

  DBProxy:
    Type: AWS::RDS::DBProxy
    Condition: ShouldEnableRDSProxy
    Properties:
      DBProxyName: !Sub "${EnvironmentName}-nextcloud-db-proxy"
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt RDSProxyIAMRole.Arn
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref DBSecret
          IAMAuth: DISABLED
      VpcSubnetIds:
        - Fn::If:
            - HasPrivateSubnet1Id
            - !Ref PrivateSubnet1Id
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PrivateSubnet1Id"
        - Fn::If:
            - HasPrivateSubnet2Id
            - !Ref PrivateSubnet2Id
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PrivateSubnet2Id"
      VpcSecurityGroupIds:
        - Fn::If:
            - HasDBSecurityGroupId
            - !Ref DBSecurityGroupId
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-DBSecurityGroupId"
      RequireTLS: true
      IdleClientTimeout: 1800
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: RDS-Proxy-Pooling

  DBProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Condition: ShouldEnableRDSProxy
    Properties:
      DBProxyName: !Ref DBProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref RDSInstance
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 90
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: 120

  # ── ElastiCache Redis Cluster (Distributed Caching & Transactional Locking) ─
  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: ShouldEnableRedis
    Properties:
      GroupDescription: Security group for Nextcloud ElastiCache Redis
      VpcId:
        Fn::If:
          - HasVpcId
          - !Ref VpcId
          - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId:
            Fn::If:
              - HasECSSecurityGroupId
              - !Ref ECSSecurityGroupId
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSSecurityGroupId"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-redis-sg"
        - Key: Environment
          Value: !Ref EnvironmentName

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Condition: ShouldEnableRedis
    Properties:
      Description: Subnet group for Nextcloud Redis
      SubnetIds:
        - Fn::If:
            - HasPrivateSubnet1Id
            - !Ref PrivateSubnet1Id
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PrivateSubnet1Id"
        - Fn::If:
            - HasPrivateSubnet2Id
            - !Ref PrivateSubnet2Id
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PrivateSubnet2Id"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Condition: ShouldEnableRedis
    Properties:
      ClusterName: !Sub "${EnvironmentName}-nc-redis"
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref RedisNodeType
      NumCacheNodes: 1
      Port: 6379
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-redis-cluster"
        - Key: Environment
          Value: !Ref EnvironmentName

  SSMRedisEndpoint:
    Type: AWS::SSM::Parameter
    Condition: ShouldEnableRedis
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/redis-endpoint"
      Type: String
      Value: !GetAtt RedisCluster.RedisEndpoint.Address
      Description: ElastiCache Redis Cluster Endpoint Address
      Tags:
        Environment: !Ref EnvironmentName

  SSMRedisPort:
    Type: AWS::SSM::Parameter
    Condition: ShouldEnableRedis
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/redis-port"
      Type: String
      Value: !GetAtt RedisCluster.RedisEndpoint.Port
      Description: ElastiCache Redis Port
      Tags:
        Environment: !Ref EnvironmentName

  # SSM Parameter Store exports
  SSMDBEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/db-endpoint"
      Type: String
      Value:
        Fn::If:
          - ShouldEnableRDSProxy
          - !GetAtt DBProxy.Endpoint
          - !GetAtt RDSInstance.Endpoint.Address
      Description: RDS PostgreSQL (or Proxy) Endpoint Address
      Tags:
        Environment: !Ref EnvironmentName

  SSMDBSecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/infra/db-secret-arn"
      Type: String
      Value: !Ref DBSecret
      Description: Secrets Manager Secret ARN for Database Credentials
      Tags:
        Environment: !Ref EnvironmentName

Outputs:
  DatabaseEndpoint:
    Description: Private RDS PostgreSQL Endpoint Address (or Proxy Endpoint if enabled)
    Value:
      Fn::If:
        - ShouldEnableRDSProxy
        - !GetAtt DBProxy.Endpoint
        - !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-DatabaseEndpoint"

  DBSecretArn:
    Description: Secrets Manager Secret ARN for Database Credentials
    Value: !Ref DBSecret
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-DBSecretArn"

  RDSInstanceIdentifier:
    Description: RDS Instance Identifier
    Value: !Ref RDSInstance
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-RDSInstanceIdentifier"

  RedisEndpoint:
    Description: ElastiCache Redis Cluster Endpoint Address
    Condition: ShouldEnableRedis
    Value: !GetAtt RedisCluster.RedisEndpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-RedisEndpoint"

  RedisPort:
    Description: ElastiCache Redis Port
    Condition: ShouldEnableRedis
    Value: !GetAtt RedisCluster.RedisEndpoint.Port
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-RedisPort"

