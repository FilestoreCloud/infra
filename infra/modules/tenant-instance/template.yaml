AWSTemplateFormatVersion: "2010-09-09"
Description: "Nextcloud Multi-Tenant SaaS - Dedicated Tenant Instance (Container-per-Tenant Isolated ECS Service, EFS Access Point, ALB Host-Header Rule, Target Group)"

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Environment prefix (prod, staging, dev)

  TenantId:
    Type: String
    Description: Unique identifier for the tenant (e.g. acme, marvel, stark)
    AllowedPattern: "^[a-z0-9-_]+$"
    ConstraintDescription: "TenantId must contain only lowercase alphanumeric characters, dashes, and underscores."

  TenantDomain:
    Type: String
    Description: Dedicated custom domain / subdomain for this tenant (e.g. acme.appleai.codes)

  AdminPassword:
    Type: String
    NoEcho: true
    Description: Initial admin password for this dedicated Nextcloud tenant instance

  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]
    Description: CPU units for this tenant's dedicated Fargate container (512 = 0.5 vCPU)

  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "4096"]
    Description: Memory (in MB) for this tenant's dedicated Fargate container

  DesiredCount:
    Type: Number
    Default: 1
    Description: Desired task count (1 = Active, 0 = Suspended FinOps zero-cost state)

  EnableAutoScaling:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable Application Auto Scaling for this dedicated tenant ECS service

  MinTaskCount:
    Type: Number
    Default: 1
    Description: Minimum task count for auto-scaling

  MaxTaskCount:
    Type: Number
    Default: 4
    Description: Maximum task count for auto-scaling (scales up when load spikes)

  TargetCPUUtilization:
    Type: Number
    Default: 70
    Description: Target average CPU utilization percentage for auto-scaling

  RulePriority:
    Type: Number
    Default: 100
    Description: ALB Listener Rule Priority (must be unique on the HTTPS listener)

  ContainerImage:
    Type: String
    Default: "nextcloud:30.0.17-apache"
    Description: Container image URI (Docker Golden Image or Nextcloud Apache)

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the Target Group is created

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 1 ID for ECS Task Public IP (Zero NAT)

  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 2 ID for ECS Task Public IP (Zero NAT)

  ECSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ECS Security Group ID (inbound restricted to ALB)

  ECSClusterName:
    Type: String
    Description: Name of the shared ECS Cluster

  ECSTaskRoleArn:
    Type: String
    Description: IAM Task Role ARN with S3, EFS, and Bedrock permissions

  ECSTaskExecutionRoleArn:
    Type: String
    Description: IAM Task Execution Role ARN with ECR, CloudWatch Logs, and Secrets Manager permissions

  ALBHTTPSListenerArn:
    Type: String
    Description: ALB HTTPS Listener ARN for host-based routing rule attachment

  EFSFileSystemId:
    Type: String
    Description: EFS File System ID for mounting dedicated tenant config directory

  DatabaseEndpoint:
    Type: String
    Description: RDS PostgreSQL Endpoint Address

  DBSecretArn:
    Type: String
    Description: Secrets Manager Secret ARN for shared RDS PostgreSQL master credentials

  S3VaultBucketName:
    Type: String
    Description: S3 Vault Bucket Name

Conditions:
  IsAutoScalingEnabled: !Equals [!Ref EnableAutoScaling, "true"]

Resources:
  # ── 1. Dedicated EFS Access Point (Config Isolation) ─────────────────────────
  TenantEFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystemId
      PosixUser:
        Uid: "33"
        Gid: "33"
      RootDirectory:
        Path: !Sub "/tenants/${TenantId}/config"
        CreationInfo:
          OwnerUid: "33"
          OwnerGid: "33"
          Permissions: "0755"
      AccessPointTags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-efs-ap-${TenantId}"
        - Key: TenantId
          Value: !Ref TenantId
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── 2. Dedicated ALB Target Group (Ingress Isolation) ───────────────────────
  TenantTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub
        - "${Prefix}-${TenantId}"
        - Prefix: !Sub "${EnvironmentName}-tg"
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /status.php
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200,301,302"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: "86400"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-tg-${TenantId}"
        - Key: TenantId
          Value: !Ref TenantId
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── 3. Host-Header Routing Rule (Subdomain Routing) ─────────────────────────
  TenantListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBHTTPSListenerArn
      Priority: !Ref RulePriority
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref TenantDomain
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TenantTargetGroup

  # ── 4. Dedicated Tenant Admin Secret ────────────────────────────────────────
  TenantAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/secrets/admin-${TenantId}"
      Description: !Sub "Nextcloud Admin credentials for dedicated tenant ${TenantId}"
      SecretString: !Sub |
        {
          "username": "admin",
          "password": "${AdminPassword}"
        }
      Tags:
        - Key: TenantId
          Value: !Ref TenantId
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── 5. CloudWatch Log Group for Tenant ──────────────────────────────────────
  TenantLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/nextcloud-${EnvironmentName}-${TenantId}"
      RetentionInDays: 14
      Tags:
        - Key: TenantId
          Value: !Ref TenantId
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── 6. Dedicated ECS Task Definition (Container & Mount Isolation) ───────────
  TenantTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-nextcloud-${TenantId}"
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      TaskRoleArn: !Ref ECSTaskRoleArn
      Volumes:
        - Name: tenant-efs-config
          EFSVolumeConfiguration:
            FilesystemId: !Ref EFSFileSystemId
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref TenantEFSAccessPoint
      ContainerDefinitions:
        - Name: nextcloud-app
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          MountPoints:
            - SourceVolume: tenant-efs-config
              ContainerPath: /var/www/html/config
              ReadOnly: false
          Environment:
            - Name: POSTGRES_HOST
              Value: !Ref DatabaseEndpoint
            - Name: POSTGRES_DB
              Value: !Sub "nc_${TenantId}"
            - Name: NEXTCLOUD_TRUSTED_DOMAINS
              Value: !Ref TenantDomain
            - Name: OBJECTSTORE_S3_BUCKET
              Value: !Ref S3VaultBucketName
            - Name: OBJECTSTORE_S3_REGION
              Value: !Ref AWS::Region
            - Name: OBJECTSTORE_S3_AUTOCREATE
              Value: "false"
            - Name: OBJECTSTORE_S3_USEPATH_STYLE
              Value: "true"
            - Name: OBJECTSTORE_S3_SSL
              Value: "true"
            - Name: OVERWRITEPROTOCOL
              Value: "https"
            - Name: OVERWRITECLIURL
              Value: !Sub "https://${TenantDomain}"
            - Name: OVERWRITEHOST
              Value: !Ref TenantDomain
            - Name: TENANT_ID
              Value: !Ref TenantId
            - Name: TENANT_STORAGE_PREFIX
              Value: !Sub "tenants/${TenantId}/"
          Secrets:
            - Name: POSTGRES_USER
              ValueFrom: !Sub "${DBSecretArn}:username::"
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "${DBSecretArn}:password::"
            - Name: NEXTCLOUD_ADMIN_USER
              ValueFrom: !Sub "${TenantAdminSecret}:username::"
            - Name: NEXTCLOUD_ADMIN_PASSWORD
              ValueFrom: !Sub "${TenantAdminSecret}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref TenantLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: TenantId
          Value: !Ref TenantId
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── 7. Dedicated ECS Service (Lifecycle Isolation) ───────────────────────────
  TenantECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - TenantListenerRule
    Properties:
      ServiceName: !Sub "service-${TenantId}"
      Cluster: !Ref ECSClusterName
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TenantTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1Id
            - !Ref PublicSubnet2Id
          SecurityGroups:
            - !Ref ECSSecurityGroupId
      LoadBalancers:
        - ContainerName: nextcloud-app
          ContainerPort: 80
          TargetGroupArn: !Ref TenantTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableExecuteCommand: true
      Tags:
        - Key: TenantId
          Value: !Ref TenantId
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── 8. Dedicated Tenant Auto Scaling (Elastic Scale-Out: 1 to N Tasks) ────────
  TenantScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: IsAutoScalingEnabled
    Properties:
      MaxCapacity: !Ref MaxTaskCount
      MinCapacity: !Ref MinTaskCount
      ResourceId: !Sub "service/${ECSClusterName}/${TenantECSService.Name}"
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"
      ScalableDimension: "ecs:service:DesiredCount"
      ServiceNamespace: ecs

  TenantCPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: IsAutoScalingEnabled
    Properties:
      PolicyName: !Sub "${EnvironmentName}-cpu-scaling-${TenantId}"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref TenantScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref TargetCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

Outputs:
  TenantServiceName:
    Description: Dedicated ECS Service Name
    Value: !GetAtt TenantECSService.Name

  TenantTargetGroupArn:
    Description: Dedicated ALB Target Group ARN
    Value: !Ref TenantTargetGroup

  TenantEFSAccessPointId:
    Description: Dedicated EFS Access Point ID
    Value: !Ref TenantEFSAccessPoint

  TenantTaskDefinitionArn:
    Description: Dedicated ECS Task Definition ARN
    Value: !Ref TenantTaskDefinition

  TenantURL:
    Description: Dedicated Tenant Ingress URL
    Value: !Sub "https://${TenantDomain}"
