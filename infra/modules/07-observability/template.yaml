AWSTemplateFormatVersion: "2010-09-09"
Description: "Nextcloud Multi-Tenant SaaS - Module 07: Observability & Monitoring (CloudWatch Dashboard, Telemetry, Alarms & Logs)"

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment prefix (prod, staging, dev)

  ApplicationLoadBalancerDNS:
    Type: String
    Default: ""
    Description: ALB DNS Name for CloudWatch Dashboard console link (Leave blank to import from Module 05)

  ApplicationLoadBalancerFullName:
    Type: String
    Default: ""
    Description: ALB Full Name for CloudWatch Dashboard ELB metrics and alarms (Leave blank to import from Module 05)

  ECSClusterName:
    Type: String
    Default: ""
    Description: ECS Cluster Name for CloudWatch Dashboard metrics and alarms (Leave blank to import from Module 05)

  ECSServiceName:
    Type: String
    Default: ""
    Description: ECS Service Name for CloudWatch Dashboard metrics and alarms (Leave blank to import from Module 05)

  RDSInstanceIdentifier:
    Type: String
    Default: ""
    Description: RDS DB Instance Identifier for CloudWatch alarms (Leave blank to import from Module 04)

  EnableAutoSleep:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable FinOps automated sleep for non-production environments (pauses RDS and scales ECS to 0 outside business hours)

  EnableSyntheticsCanary:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable CloudWatch Synthetics Canary for active 5-minute automated user journey health probes

Conditions:
  HasALBDNS: !Not [!Equals [!Ref ApplicationLoadBalancerDNS, ""]]
  HasALBFullName: !Not [!Equals [!Ref ApplicationLoadBalancerFullName, ""]]
  HasECSClusterName: !Not [!Equals [!Ref ECSClusterName, ""]]
  HasECSServiceName: !Not [!Equals [!Ref ECSServiceName, ""]]
  HasRDSInstanceIdentifier: !Not [!Equals [!Ref RDSInstanceIdentifier, ""]]
  ShouldEnableAutoSleep: !Equals [!Ref EnableAutoSleep, "true"]
  ShouldEnableSyntheticsCanary: !Equals [!Ref EnableSyntheticsCanary, "true"]

Resources:
  # ============================================================================
  # OBSERVABILITY ALERTS & NOTIFICATION TOPIC
  # ============================================================================
  ObservabilityNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${EnvironmentName}-nextcloud-observability-alerts"
      DisplayName: Nextcloud SaaS Observability Alerts
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Observability

  # ============================================================================
  # PLATFORM CENTRAL LOG GROUP
  # ============================================================================
  PlatformLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/observability/${EnvironmentName}-nextcloud"
      RetentionInDays: 90
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: Nextcloud-SaaS-Observability

  # ============================================================================
  # REAL-TIME CLOUDWATCH METRIC DASHBOARD
  # ============================================================================
  CloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${EnvironmentName}-Nextcloud-SaaS-Control-Plane"
      DashboardBody:
        Fn::Sub:
          - |
            {
              "widgets": [
                {
                  "type": "text",
                  "x": 0, "y": 0, "width": 24, "height": 4,
                  "properties": {
                    "markdown": "# ☁️ Nextcloud SaaS — Super Admin Operations Console\n**Region:** `${AWS::Region}` | **Environment:** `${EnvironmentName}` | **ALB:** [http://${ALBDNS}](http://${ALBDNS})\n\n---\n### 🛠️ Tenant Lifecycle — SSM Runbook Actions\n| Action | AWS Console Link | CLI Command |\n|---|---|---|\n| **Run Runbook** | [Open SSM Automation Console](https://${AWS::Region}.console.aws.amazon.com/systems-manager/documents/${EnvironmentName}-Tenant-Lifecycle-Operator/description?region=${AWS::Region}) | `aws ssm start-automation-execution --document-name \"${EnvironmentName}-Tenant-Lifecycle-Operator\" --parameters '{\"TenantId\":[\"<id>\"],\"Action\":[\"PROVISION\"],\"StorageQuotaGB\":[\"100\"],\"CompanyDomain\":[\"<domain>\"]}'` |\n| **View Registry** | [Open DynamoDB Table](https://${AWS::Region}.console.aws.amazon.com/dynamodbv2/home?region=${AWS::Region}#table?name=${EnvironmentName}-nextcloud-tenant-registry) | `aws dynamodb scan --table-name ${EnvironmentName}-nextcloud-tenant-registry` |\n| **View App Logs** | [Open CloudWatch Logs](https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Fecs$252F${EnvironmentName}-nextcloud) | `aws logs tail /ecs/${EnvironmentName}-nextcloud --follow` |"
                  }
                },
                {
                  "type": "metric",
                  "x": 0, "y": 4, "width": 12, "height": 6,
                  "properties": {
                    "title": "All Tenants — Storage Utilization (MB) [auto-discovers new tenants]",
                    "metrics": [
                      [ { "expression": "SEARCH('{Nextcloud/SaaS,TenantId} MetricName=\"TenantStorageUsedMB\"', 'Average', 300)", "id": "storage", "label": "${!PROP('Dim.TenantId')}" } ]
                    ],
                    "period": 300,
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "yAxis": { "left": { "label": "MB Used", "showUnits": false } }
                  }
                },
                {
                  "type": "metric",
                  "x": 12, "y": 4, "width": 12, "height": 6,
                  "properties": {
                    "title": "All Tenants — Lifecycle Status (1=ACTIVE, 0=SUSPENDED) [auto-discovers new tenants]",
                    "metrics": [
                      [ { "expression": "SEARCH('{Nextcloud/SaaS,TenantId} MetricName=\"TenantActiveStatus\"', 'Maximum', 300)", "id": "status", "label": "${!PROP('Dim.TenantId')}" } ]
                    ],
                    "period": 300,
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "yAxis": { "left": { "label": "Status (1=Active, 0=Suspended)", "min": 0, "max": 1 } }
                  }
                },
                {
                  "type": "metric",
                  "x": 0, "y": 10, "width": 12, "height": 6,
                  "properties": {
                    "title": "ALB — Request Count & Response Latency",
                    "metrics": [
                      [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ALBFullName}", { "stat": "Sum", "label": "Requests" } ],
                      [ ".", "TargetResponseTime", ".", ".", { "stat": "Average", "yAxis": "right", "label": "Latency (avg)" } ]
                    ],
                    "period": 300,
                    "region": "${AWS::Region}",
                    "view": "timeSeries"
                  }
                },
                {
                  "type": "metric",
                  "x": 12, "y": 10, "width": 12, "height": 6,
                  "properties": {
                    "title": "ECS Fargate — CPU & Memory Utilization",
                    "metrics": [
                      [ "AWS/ECS", "CPUUtilization", "ServiceName", "${ECSService}", "ClusterName", "${ECSCluster}", { "stat": "Average", "label": "CPU %" } ],
                      [ ".", "MemoryUtilization", ".", ".", ".", ".", { "stat": "Average", "label": "Memory %" } ]
                    ],
                    "period": 300,
                    "region": "${AWS::Region}",
                    "view": "timeSeries"
                  }
                },
                {
                  "type": "metric",
                  "x": 0, "y": 16, "width": 12, "height": 6,
                  "properties": {
                    "title": "ALB — HTTP 5xx Errors (Application Health)",
                    "metrics": [
                      [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${ALBFullName}", { "stat": "Sum", "label": "5xx Errors", "color": "#d62728" } ]
                    ],
                    "period": 300,
                    "region": "${AWS::Region}",
                    "view": "timeSeries"
                  }
                },
                {
                  "type": "metric",
                  "x": 12, "y": 16, "width": 12, "height": 6,
                  "properties": {
                    "title": "ECS — Running Task Count (Auto-scaling Health)",
                    "metrics": [
                      [ "ECS/ContainerInsights", "RunningTaskCount", "ServiceName", "${ECSService}", "ClusterName", "${ECSCluster}", { "stat": "Average", "label": "Running Tasks" } ]
                    ],
                    "period": 60,
                    "region": "${AWS::Region}",
                    "view": "timeSeries"
                  }
                }
              ]
            }
          - ALBDNS:
              Fn::If:
                - HasALBDNS
                - !Ref ApplicationLoadBalancerDNS
                - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-LoadBalancerDNS"
            ALBFullName:
              Fn::If:
                - HasALBFullName
                - !Ref ApplicationLoadBalancerFullName
                - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-LoadBalancerFullName"
            ECSCluster:
              Fn::If:
                - HasECSClusterName
                - !Ref ECSClusterName
                - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSClusterName"
            ECSService:
              Fn::If:
                - HasECSServiceName
                - !Ref ECSServiceName
                - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSServiceName"

  # ============================================================================
  # CLOUDWATCH METRIC ALARMS
  # ============================================================================
  ALB5xxErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-nextcloud-alb-5xx-errors"
      AlarmDescription: "Alert when ALB 5xx error count exceeds 5 over 2 consecutive minutes"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value:
            Fn::If:
              - HasALBFullName
              - !Ref ApplicationLoadBalancerFullName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-LoadBalancerFullName"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ObservabilityNotificationTopic

  ALBHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-nextcloud-alb-high-latency"
      AlarmDescription: "Alert when ALB Target Response Time exceeds 1.5 seconds for 3 consecutive evaluation periods"
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - Name: LoadBalancer
          Value:
            Fn::If:
              - HasALBFullName
              - !Ref ApplicationLoadBalancerFullName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-LoadBalancerFullName"
      Statistic: Average
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1.5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ObservabilityNotificationTopic

  ECSHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-nextcloud-ecs-high-cpu"
      AlarmDescription: "Alert when Nextcloud ECS service CPU utilization exceeds 85% for 3 consecutive evaluation periods"
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value:
            Fn::If:
              - HasECSClusterName
              - !Ref ECSClusterName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSClusterName"
        - Name: ServiceName
          Value:
            Fn::If:
              - HasECSServiceName
              - !Ref ECSServiceName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSServiceName"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ObservabilityNotificationTopic

  ECSHighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-nextcloud-ecs-high-memory"
      AlarmDescription: "Alert when Nextcloud ECS service Memory utilization exceeds 85% for 3 consecutive evaluation periods"
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value:
            Fn::If:
              - HasECSClusterName
              - !Ref ECSClusterName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSClusterName"
        - Name: ServiceName
          Value:
            Fn::If:
              - HasECSServiceName
              - !Ref ECSServiceName
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSServiceName"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ObservabilityNotificationTopic

  RDSHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-nextcloud-rds-high-cpu"
      AlarmDescription: "Alert when RDS PostgreSQL CPU utilization exceeds 80% for 3 consecutive evaluation periods"
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value:
            Fn::If:
              - HasRDSInstanceIdentifier
              - !Ref RDSInstanceIdentifier
              - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-RDSInstanceIdentifier"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ObservabilityNotificationTopic

  # ============================================================================
  # SSM PARAMETER REGISTRY
  # ============================================================================
  SSMDashboardName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/observability/dashboard-name"
      Type: String
      Value: !Ref CloudWatchDashboard
      Description: CloudWatch Operational Dashboard Name
      Tags:
        Environment: !Ref EnvironmentName

  SSMAlertsTopicArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/observability/alerts-topic-arn"
      Type: String
      Value: !Ref ObservabilityNotificationTopic
      Description: Observability SNS Alerts Topic ARN
      Tags:
        Environment: !Ref EnvironmentName

  # ============================================================================
  # FINOPS AUTO-SLEEP SCHEDULER (Requirement 2: Cost Optimization)
  # ============================================================================
  FinOpsAutoSleepRole:
    Type: AWS::IAM::Role
    Condition: ShouldEnableAutoSleep
    Properties:
      RoleName: !Sub "${EnvironmentName}-nextcloud-finops-autosleep-role"
      Description: IAM Execution Role for FinOps automated ECS/RDS sleep scheduler
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FinOpsSchedulerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LoggingAccess
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
              - Sid: RDSPauseResumeAccess
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:StopDBInstance
                  - rds:StartDBInstance
                Resource: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:*"
              - Sid: ECSScalingAccess
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: "*"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: FinOps-AutoSleep

  FinOpsAutoSleepLambda:
    Type: AWS::Lambda::Function
    Condition: ShouldEnableAutoSleep
    Properties:
      FunctionName: !Sub "${EnvironmentName}-nextcloud-finops-autosleep"
      Description: "FinOps scheduler: pauses RDS DB and scales ECS Fargate tasks to 0 outside business hours"
      Runtime: python3.11
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt FinOpsAutoSleepRole.Arn
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          RDS_IDENTIFIER: !Sub "${EnvironmentName}-nextcloud-db"
          ECS_CLUSTER: !Sub "${EnvironmentName}-nextcloud-cluster"
          ECS_SERVICE: !Sub "${EnvironmentName}-nextcloud-service"
      Code:
        ZipFile: |
          import os, sys, boto3

          def handler(event, context):
              action = event.get("action", "SLEEP").upper()
              region = os.environ.get("AWS_DEFAULT_REGION", "ap-southeast-1")
              rds_id = os.environ.get("RDS_IDENTIFIER")
              cluster = os.environ.get("ECS_CLUSTER")
              service = os.environ.get("ECS_SERVICE")

              rds = boto3.client("rds", region_name=region)
              ecs = boto3.client("ecs", region_name=region)

              print(f"Executing FinOps Auto-{action} for {rds_id} and {cluster}/{service}...")
              results = {"action": action, "rds": None, "ecs": None}

              if action == "SLEEP":
                  try:
                      ecs.update_service(cluster=cluster, service=service, desiredCount=0)
                      results["ecs"] = "Scaled to 0"
                      print(f"ECS service {service} scaled to 0 tasks.")
                  except Exception as e:
                      results["ecs"] = f"Error: {e}"

                  try:
                      dbs = rds.describe_db_instances(DBInstanceIdentifier=rds_id)["DBInstances"]
                      status = dbs[0]["DBInstanceStatus"]
                      if status == "available":
                          rds.stop_db_instance(DBInstanceIdentifier=rds_id)
                          results["rds"] = "Stopping"
                          print(f"RDS {rds_id} stopped.")
                      else:
                          results["rds"] = f"Ignored (status: {status})"
                  except Exception as e:
                      results["rds"] = f"Error: {e}"

              elif action == "WAKE":
                  try:
                      dbs = rds.describe_db_instances(DBInstanceIdentifier=rds_id)["DBInstances"]
                      status = dbs[0]["DBInstanceStatus"]
                      if status == "stopped":
                          rds.start_db_instance(DBInstanceIdentifier=rds_id)
                          results["rds"] = "Starting"
                          print(f"RDS {rds_id} starting.")
                      else:
                          results["rds"] = f"Ignored (status: {status})"
                  except Exception as e:
                      results["rds"] = f"Error: {e}"

                  try:
                      ecs.update_service(cluster=cluster, service=service, desiredCount=1)
                      results["ecs"] = "Scaled to 1"
                      print(f"ECS service {service} scaled to 1 task.")
                  except Exception as e:
                      results["ecs"] = f"Error: {e}"

              return {"statusCode": 200, "body": results}
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  FinOpsSleepRule:
    Type: AWS::Events::Rule
    Condition: ShouldEnableAutoSleep
    Properties:
      Name: !Sub "${EnvironmentName}-nextcloud-finops-sleep-rule"
      Description: "FinOps: Sleep non-prod environments at 20:00 UTC+7 Mon-Fri"
      ScheduleExpression: "cron(0 13 ? * MON-FRI *)"
      State: ENABLED
      Targets:
        - Id: FinOpsAutoSleepTarget
          Arn: !GetAtt FinOpsAutoSleepLambda.Arn
          Input: '{"action": "SLEEP"}'

  FinOpsWakeRule:
    Type: AWS::Events::Rule
    Condition: ShouldEnableAutoSleep
    Properties:
      Name: !Sub "${EnvironmentName}-nextcloud-finops-wake-rule"
      Description: "FinOps: Wake non-prod environments at 08:00 UTC+7 Mon-Fri"
      ScheduleExpression: "cron(0 1 ? * MON-FRI *)"
      State: ENABLED
      Targets:
        - Id: FinOpsAutoWakeTarget
          Arn: !GetAtt FinOpsAutoSleepLambda.Arn
          Input: '{"action": "WAKE"}'

  FinOpsSleepRulePermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldEnableAutoSleep
    Properties:
      FunctionName: !GetAtt FinOpsAutoSleepLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FinOpsSleepRule.Arn

  FinOpsWakeRulePermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldEnableAutoSleep
    Properties:
      FunctionName: !GetAtt FinOpsAutoSleepLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FinOpsWakeRule.Arn

  SSMFinOpsAutoSleepEnabled:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/finops/auto-sleep-enabled"
      Type: String
      Value: !Ref EnableAutoSleep
      Description: Flag indicating whether FinOps automated sleep is active
      Tags:
        Environment: !Ref EnvironmentName

  # ============================================================================
  # ENTERPRISE SYNTHETICS CANARY (Active SRE User Simulation)
  # ============================================================================
  CanaryArtifactsBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldEnableSyntheticsCanary
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${EnvironmentName}-storix-canary-artifacts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCanaryArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: Synthetics-Canary-Artifacts

  SyntheticsCanaryRole:
    Type: AWS::IAM::Role
    Condition: ShouldEnableSyntheticsCanary
    Properties:
      RoleName: !Sub "${EnvironmentName}-storix-canary-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CanaryExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub "${CanaryArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt CanaryArtifactsBucket.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CloudWatchSynthetics

  StorixSyntheticsCanary:
    Type: AWS::Synthetics::Canary
    Condition: ShouldEnableSyntheticsCanary
    Properties:
      Name: !Sub "${EnvironmentName}-storix-probe"
      ExecutionRoleArn: !GetAtt SyntheticsCanaryRole.Arn
      ArtifactS3Location: !Sub "s3://${CanaryArtifactsBucket}"
      RuntimeVersion: syn-nodejs-puppeteer-9.2
      Schedule:
        Expression: "rate(5 minutes)"
        DurationInSeconds: 0
      StartCanaryAfterCreation: false
      Code:
        Handler: pageLoadBlueprint.handler
        Script: |
          const synthetics = require('Synthetics');
          const log = require('SyntheticsLogger');

          const pageLoadBlueprint = async function () {
              const url = process.env.TARGET_URL || 'http://localhost';
              let page = await synthetics.getPage();
              const response = await page.goto(url, {waitUntil: ['load', 'networkidle0'], timeout: 30000});
              if (!response) {
                  throw "Failed to load page!";
              }
              const status = response.status();
              log.info(`Target URL ${url} returned status code: ${status}`);
              if (status >= 400) {
                  throw `Endpoint returned HTTP status ${status}`;
              }
          };

          exports.handler = async () => {
              return await pageLoadBlueprint();
          };
      RunConfig:
        TimeoutInSeconds: 60
        MemoryInMB: 960
        EnvironmentVariables:
          TARGET_URL:
            Fn::If:
              - HasALBDNS
              - !Sub "http://${ApplicationLoadBalancerDNS}/status.php"
              - "http://localhost/status.php"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  CanarySuccessRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldEnableSyntheticsCanary
    Properties:
      AlarmName: !Sub "${EnvironmentName}-storix-canary-failure"
      AlarmDescription: "Alert when Synthetics Canary success rate drops below 100% (User journey failing)"
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref StorixSyntheticsCanary
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 99
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref ObservabilityNotificationTopic

Outputs:
  CanaryName:
    Condition: ShouldEnableSyntheticsCanary
    Description: Synthetics Canary Name
    Value: !Ref StorixSyntheticsCanary
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-CanaryName"

  CanarySuccessRateAlarmArn:
    Condition: ShouldEnableSyntheticsCanary
    Description: Synthetics Canary Success Rate Alarm ARN
    Value: !GetAtt CanarySuccessRateAlarm.Arn
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-CanarySuccessRateAlarmArn"

  CloudWatchDashboardName:
    Description: CloudWatch Dashboard Name
    Value: !Ref CloudWatchDashboard
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-CloudWatchDashboardName"

  CloudWatchDashboardURL:
    Description: AWS Management Console URL for CloudWatch Operational Dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${CloudWatchDashboard}"
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-CloudWatchDashboardURL"

  ObservabilityNotificationTopicArn:
    Description: SNS Topic ARN for Observability Metric Alarms
    Value: !Ref ObservabilityNotificationTopic
    Export:
      Name: !Sub "${EnvironmentName}-nextcloud-ObservabilityNotificationTopicArn"

  ALB5xxErrorRateAlarmArn:
