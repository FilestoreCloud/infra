  # ── CloudFront CDN (Edge Caching for Static Assets & DDoS Shield) ───────────
  CloudFrontCDN:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldEnableCloudFrontCDN
    Properties:
      DistributionConfig:
        Comment: !Sub "Nextcloud Edge CDN (${EnvironmentName})"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: NextcloudALBOrigin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: !If [HasTlsCertificate, https-only, http-only]
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: NextcloudALBOrigin
          ViewerProtocolPolicy: !If [HasTlsCertificate, redirect-to-https, allow-all]
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
          OriginRequestPolicyId: "b680b3d8-70b0-4474-a846-e16e6e837866"
        CacheBehaviors:
          - PathPattern: "/core/*"
            TargetOriginId: NextcloudALBOrigin
            ViewerProtocolPolicy: !If [HasTlsCertificate, redirect-to-https, allow-all]
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"
          - PathPattern: "/apps/*"
            TargetOriginId: NextcloudALBOrigin
            ViewerProtocolPolicy: !If [HasTlsCertificate, redirect-to-https, allow-all]
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"
          - PathPattern: "/dist/*"
            TargetOriginId: NextcloudALBOrigin
            ViewerProtocolPolicy: !If [HasTlsCertificate, redirect-to-https, allow-all]
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"
          - PathPattern: "/custom_apps/*"
            TargetOriginId: NextcloudALBOrigin
            ViewerProtocolPolicy: !If [HasTlsCertificate, redirect-to-https, allow-all]
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: storix

