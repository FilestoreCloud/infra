AWSTemplateFormatVersion: "2010-09-09"
Description: "Nextcloud Multi-Tenant SaaS - Module 05: Compute & Ingress Platform (ALB Host-Routing, ECS Fargate Cluster, Default Service, ECR, IAM)"

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment prefix (prod, staging, dev)

  VpcId:
    Type: String
    Default: ""
    Description: VPC ID where the ALB and Target Group will be created (Leave blank to import from Module 01)

  PublicSubnet1Id:
    Type: String
    Default: ""
    Description: Public Subnet 1 ID for ALB and ECS public IP (Leave blank to import from Module 01)

  PublicSubnet2Id:
    Type: String
    Default: ""
    Description: Public Subnet 2 ID for ALB and ECS public IP (Leave blank to import from Module 01)


  ALBSecurityGroupId:
    Type: String
    Default: ""
    Description: Security Group ID for ALB (Leave blank to import from Module 02)

  ECSSecurityGroupId:
    Type: String
    Default: ""
    Description: Security Group ID for ECS tasks (Leave blank to import from Module 02)

  S3VaultBucketName:
    Type: String
    Default: ""
    Description: S3 Vault Bucket Name (Leave blank to import from Module 03)

  S3VaultBucketArn:
    Type: String
    Default: ""
    Description: S3 Vault Bucket ARN (Leave blank to import from Module 03)

  DatabaseEndpoint:
    Type: String
    Default: ""
    Description: Private RDS PostgreSQL Endpoint Address (Leave blank to import from Module 04)

  DBSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager Secret ARN for Database Credentials (Leave blank to import from Module 04)

  AdminPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Initial admin password for Nextcloud (optional; leave blank to dynamically auto-generate via AWS Secrets Manager)

  TaskCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "4096"]
    Description: CPU units for the Fargate task (1024 = 1 vCPU)

  TaskMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "4096", "8192"]
    Description: Memory (in MB) for the Fargate task

  DesiredCount:
    Type: Number
    Default: 1
    Description: Desired task count for Nextcloud ECS service

  MaxCount:
    Type: Number
    Default: 6
    Description: Maximum task count for autoscaling

  EnableAIEngine:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable Nextcloud AI Assistant and Amazon Bedrock foundation model integration

  ContainerImage:
    Type: String
    Default: "nextcloud:30.0.17-apache"
    Description: Container image URI (Use default or your Amazon ECR Golden Image URI)

  ACMCertificateArn:
    Type: String
    Description: ARN of an ACM TLS certificate for the HTTPS listener
    Default: ""

  EFSFileSystemId:
    Type: String
    Description: EFS File System ID for Nextcloud Persistent Config
    Default: ""

  EFSFileSystemArn:
    Type: String
    Description: EFS File System ARN for IAM Task Role
    Default: ""

  DefaultEFSAccessPointId:
    Type: String
    Description: EFS Access Point ID for Default Tenant Config
    Default: ""

  GitHubOrg:
    Type: String
    Default: "FilestoreCloud"
    Description: "GitHub Organization name for OIDC trust policies"

  CreateECRRepository:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Whether to create the ECR repository (set to false if repository already exists)"

  EnableCloudFrontCDN:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Whether to provision AWS CloudFront Edge CDN for static asset caching and DDoS offloading"

  RedisEndpoint:
    Type: String
    Default: ""
    Description: "ElastiCache Redis endpoint address for distributed caching and locking (leave blank if disabled)"

  CpuArchitecture:
    Type: String
    Default: X86_64
    AllowedValues: ["X86_64", "ARM64"]
    Description: CPU architecture for Fargate tasks (ARM64 for AWS Graviton or X86_64)

  EnableDedicatedCronRunner:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Whether to enable EventBridge scheduled dedicated Fargate cron runner for background jobs

  TrustedDomains:
    Type: String
    Default: "dev-tenant.png261.dev dev-tenant.appleai.codes prod-nextcloud.png261.dev png261.dev appleai.codes"
    Description: Space-delimited trusted domains for dev Nextcloud ingress (strict isolation, no wildcard)

  OpenSearchEndpoint:
    Type: String
    Default: ""
    Description: Private Amazon OpenSearch VPC Endpoint for enterprise full-text search

  EnableTikaExtractor:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable Apache Tika sidecar container for document text extraction (PDF, Office, OCR)

  AIApiUrl:
    Type: String
    Default: "https://api.vilao.ai/v1"
    Description: External OpenAI-compatible AI API URL for Nextcloud Assistant

  AIApiKey:
    Type: String
    NoEcho: true
    Default: "sk-9e55145c6edcbbcd434716fd67df824a57d9a5af491b863ec8fee6d33f5604f9"
    Description: API Key for AI provider

  AIModelName:
    Type: String
    Default: "occ/claude-haiku-4-5-20251001"
    Description: AI Model Name for Nextcloud Assistant

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, "prod"]
  ShouldCreateECR: !Equals [!Ref CreateECRRepository, "true"]
  ShouldEnableCloudFrontCDN: !Equals [!Ref EnableCloudFrontCDN, "true"]
  ShouldEnableCronRunner: !Equals [!Ref EnableDedicatedCronRunner, "true"]
  HasRedisEndpoint: !Not [!Equals [!Ref RedisEndpoint, ""]]
  HasEFS: !Not [!Equals [!Ref EFSFileSystemId, ""]]
  HasDefaultEFSAccessPointId: !Not [!Equals [!Ref DefaultEFSAccessPointId, ""]]
  HasVpcId: !Not [!Equals [!Ref VpcId, ""]]
  HasPublicSubnet1Id: !Not [!Equals [!Ref PublicSubnet1Id, ""]]
  HasPublicSubnet2Id: !Not [!Equals [!Ref PublicSubnet2Id, ""]]
  HasALBSecurityGroupId: !Not [!Equals [!Ref ALBSecurityGroupId, ""]]
  HasECSSecurityGroupId: !Not [!Equals [!Ref ECSSecurityGroupId, ""]]
  HasS3VaultBucketName: !Not [!Equals [!Ref S3VaultBucketName, ""]]
  HasS3VaultBucketArn: !Not [!Equals [!Ref S3VaultBucketArn, ""]]
  HasDatabaseEndpoint: !Not [!Equals [!Ref DatabaseEndpoint, ""]]
  HasDBSecretArn: !Not [!Equals [!Ref DBSecretArn, ""]]
  HasTlsCertificate: !And
    - !Not [!Equals [!Ref ACMCertificateArn, ""]]
    - !Not [
        !Equals [
          !Ref ACMCertificateArn,
          "arn:aws:acm:REGION:ACCOUNT_ID:certificate/REPLACE-ME",
        ],
      ]
  IsNotTlsCertificate: !Not [!Condition HasTlsCertificate]

Resources:
  NextcloudECRRepository:
    Type: AWS::ECR::Repository
    Condition: ShouldCreateECR
    Properties:
      RepositoryName: !Sub "${EnvironmentName}-nextcloud-enterprise"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Delete untagged images older than 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Keep maximum 15 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 15
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-nextcloud-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::If:
            - HasPublicSubnet1Id
            - !Ref PublicSubnet1Id
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PublicSubnet1Id"
        - Fn::If:
            - HasPublicSubnet2Id
            - !Ref PublicSubnet2Id
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PublicSubnet2Id"
      SecurityGroups:
        - Fn::If:
            - HasALBSecurityGroupId
            - !Ref ALBSecurityGroupId
            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ALBSecurityGroupId"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb"
        - Key: Environment
          Value: !Ref EnvironmentName

  WAFWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${EnvironmentName}-nextcloud-waf"
      Scope: REGIONAL
      Description: AWS WAF protection for Nextcloud SaaS ALB with OWASP Top 10, SQLi, and IP Rate Limiting
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${EnvironmentName}-nextcloud-waf"
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules:
                - Name: SizeRestrictions_BODY
                - Name: CrossSiteScripting_BODY
                - Name: GenericRFI_BODY
                - Name: GenericLFI_BODY
                - Name: RestrictedExtensions_URIPATH
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSetMetric
        - Name: AWS-AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
              ExcludedRules:
                - Name: PROPFIND_METHOD
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesKnownBadInputsRuleSetMetric
        - Name: AWS-AWSManagedRulesSQLiRuleSet
          Priority: 3
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
              ExcludedRules:
                - Name: SQLi_BODY
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesSQLiRuleSetMetric
        - Name: AWS-AWSManagedRulesAmazonIpReputationList
          Priority: 4
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesAmazonIpReputationListMetric
        - Name: IPBasedRateLimitRule
          Priority: 5
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: IPBasedRateLimitMetric

  WAFWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref ApplicationLoadBalancer
      WebACLArn: !GetAtt WAFWebACL.Arn

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-nextcloud-tg"
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::If:
          - HasVpcId
          - !Ref VpcId
          - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-VpcId"
      Matcher:
        HttpCode: "200-499"
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /robots.txt
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: "86400"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions: !If
        - HasTlsCertificate
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
        - - Type: fixed-response
            FixedResponseConfig:
              ContentType: text/html
              StatusCode: "404"
              MessageBody: |
                <!DOCTYPE html>
                <html lang="en">
                <head>
                  <meta charset="utf-8">
                  <title>404 - Tenant Not Found | Storix Cloud</title>
                  <style>
                    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
                    .container { text-align: center; max-width: 480px; padding: 2rem; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
                    h1 { font-size: 3rem; margin: 0 0 1rem; color: #38bdf8; }
                    p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; }
                    a { display: inline-block; padding: 0.75rem 1.5rem; background: #0284c7; color: white; text-decoration: none; border-radius: 6px; }
                  </style>
                </head>
                <body>
                  <div class="container">
                    <h1>404</h1>
                    <h2>Tenant Not Found</h2>
                    <p>The requested tenant environment does not exist, has been decommissioned, or the domain is misconfigured.</p>
                    <a href="https://admin.png261.dev">Storix Cloud Portal</a>
                  </div>
                </body>
                </html>
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  ALBHTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasTlsCertificate
    Properties:
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/html
            StatusCode: "404"
            MessageBody: |
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="utf-8">
                <title>404 - Tenant Not Found | Storix Cloud</title>
                <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
                  .container { text-align: center; max-width: 480px; padding: 2rem; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
                  h1 { font-size: 3rem; margin: 0 0 1rem; color: #38bdf8; }
                  p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; }
                  a { display: inline-block; padding: 0.75rem 1.5rem; background: #0284c7; color: white; text-decoration: none; border-radius: 6px; }
                </style>
              </head>
              <body>
                <div class="container">
                  <h1>404</h1>
                  <h2>Tenant Not Found</h2>
                  <p>The requested tenant environment does not exist, has been decommissioned, or the domain is misconfigured.</p>
                  <a href="https://admin.png261.dev">Storix Cloud Portal</a>
                </div>
              </body>
              </html>
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref ACMCertificateArn

  DevTenantHTTPSRoutingRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasTlsCertificate
    Properties:
      ListenerArn: !Ref ALBHTTPSListener
      Priority: 100
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Sub "dev-tenant.${RootDomain}"
              - !Sub "${EnvironmentName}-nextcloud.${RootDomain}"
              - !Ref RootDomain
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  DevTenantHTTPRoutingRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: IsNotTlsCertificate
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 100
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Sub "dev-tenant.${RootDomain}"
              - !Sub "${EnvironmentName}-nextcloud.${RootDomain}"
              - !Ref RootDomain
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-nextcloud-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 1
        - CapacityProvider: FARGATE_SPOT
          Weight: 3
          Base: 0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-ecs-cluster"
        - Key: Environment
          Value: !Ref EnvironmentName

  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}-nextcloud"
      RetentionInDays: 30

  AdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/nextcloud/${EnvironmentName}/secrets/admin-credentials"
      Description: Nextcloud SaaS initial super-admin credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: "password"
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\'"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ecs-task-exec-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - Fn::If:
                      - HasDBSecretArn
                      - !Ref DBSecretArn
                      - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-DBSecretArn"
                  - !Ref AdminSecret
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/nextcloud/${EnvironmentName}/tenants/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
        - PolicyName: EFSAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:ClientRootAccess
                Resource:
                  - Fn::Sub:
                      - "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/${EfsId}"
                      - EfsId:
                          Fn::If:
                            - HasEFS
                            - !Ref EFSFileSystemId
                            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-EFSFileSystemId"
                  - Fn::Sub:
                      - "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:access-point/${ApId}"
                      - ApId:
                          Fn::If:
                            - HasDefaultEFSAccessPointId
                            - !Ref DefaultEFSAccessPointId
                            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-DefaultEFSAccessPointId"
              - Effect: Allow
                Action:
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:DescribeMountTargets
                Resource: "*"

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ecs-task-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3VaultAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource:
                  - Fn::If:
                      - HasS3VaultBucketArn
                      - !Ref S3VaultBucketArn
                      - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketArn"
                  - Fn::Sub:
                      - "${BucketArn}/*"
                      - BucketArn:
                          Fn::If:
                            - HasS3VaultBucketArn
                            - !Ref S3VaultBucketArn
                            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketArn"
        - PolicyName: BedrockAIAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                Resource: "*"
        - PolicyName: EFSAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:ClientRootAccess
                Resource:
                  - Fn::Sub:
                      - "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/${EfsId}"
                      - EfsId:
                          Fn::If:
                            - HasEFS
                            - !Ref EFSFileSystemId
                            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-EFSFileSystemId"
                  - Fn::Sub:
                      - "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:access-point/${ApId}"
                      - ApId:
                          Fn::If:
                            - HasDefaultEFSAccessPointId
                            - !Ref DefaultEFSAccessPointId
                            - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-DefaultEFSAccessPointId"
              - Effect: Allow
                Action:
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:DescribeMountTargets
                Resource: "*"
        - PolicyName: ECSExecAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  NextcloudTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-nextcloud-app"
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      Volumes:
        - Name: nextcloud-config
          EFSVolumeConfiguration:
            FilesystemId:
              Fn::If:
                - HasEFS
                - !Ref EFSFileSystemId
                - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-EFSFileSystemId"
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId:
                Fn::If:
                  - HasDefaultEFSAccessPointId
                  - !Ref DefaultEFSAccessPointId
                  - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-DefaultEFSAccessPointId"
              IAM: ENABLED
      ContainerDefinitions:
        - Name: nextcloud
          Image: !Ref ContainerImage
          StopTimeout: 120
          PortMappings:
            - ContainerPort: 80
              HostPort: 80
              Protocol: tcp
          MountPoints:
            - SourceVolume: nextcloud-config
              ContainerPath: /var/www/html/config
              ReadOnly: false
          Environment:
            - Name: HOME
              Value: /var/www
            - Name: PGSSLMODE
              Value: prefer
            - Name: POSTGRES_HOST
              Value:
                Fn::If:
                  - HasDatabaseEndpoint
                  - !Ref DatabaseEndpoint
                  - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-DatabaseEndpoint"
            - Name: POSTGRES_DB
              Value: nextcloud
            - Name: POSTGRES_USER
              Value: nextcloud
            - Name: NEXTCLOUD_ADMIN_USER
              Value: admin
            - Name: OBJECTSTORE_S3_BUCKET
              Value:
                Fn::If:
                  - HasS3VaultBucketName
                  - !Ref S3VaultBucketName
                  - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-S3VaultBucketName"
            - Name: OBJECTSTORE_S3_REGION
              Value: !Ref "AWS::Region"
            - Name: OBJECTSTORE_S3_AUTOCREATE
              Value: "false"
            - Name: OBJECTSTORE_S3_USEPATH_STYLE
              Value: "false"
            - Name: OBJECTSTORE_S3_SSL
              Value: "true"
            - Name: NEXTCLOUD_TRUSTED_DOMAINS
              Value: !Sub "${ApplicationLoadBalancer.DNSName} localhost 127.0.0.1 ${TrustedDomains}"
            - Name: TRUSTED_PROXIES
              Value: 10.0.0.0/16
            - Name: NEXTCLOUD_ENABLE_AI
              Value: !Ref EnableAIEngine
            - Name: BEDROCK_REGION
              Value: !Ref "AWS::Region"
            - Name: BEDROCK_DEFAULT_MODEL
              Value: "bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0"
            - Name: OVERWRITEPROTOCOL
              Value: "https"
            - Name: OVERWRITECLIURL
              Value: !Sub "https://${ApplicationLoadBalancer.DNSName}"
            - Name: NC_maintenance_window_start
              Value: "2"
            - Name: NC_default_phone_region
              Value: "VN"
            - Name: NC_setup_create_db_user
              Value: "false"
            - Name: REDIS_HOST
              Value:
                Fn::If:
                  - HasRedisEndpoint
                  - !Ref RedisEndpoint
                  - ""
            - Name: REDIS_PORT
              Value: "6379"
            - Name: OPENSEARCH_HOST
              Value: !Ref OpenSearchEndpoint
            - Name: TIKA_HOST
              Value: "127.0.0.1"
            - Name: TIKA_PORT
              Value: "9998"
            - Name: AI_API_URL
              Value: !Ref AIApiUrl
            - Name: AI_API_KEY
              Value: !Ref AIApiKey
            - Name: AI_MODEL_NAME
              Value: !Ref AIModelName
            - Name: OPENAI_API_URL
              Value: !Ref AIApiUrl
            - Name: OPENAI_API_KEY
              Value: !Ref AIApiKey
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom:
                Fn::Sub:
                  - "${SecretArn}:password::"
                  - SecretArn:
                      Fn::If:
                        - HasDBSecretArn
                        - !Ref DBSecretArn
                        - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-DBSecretArn"
            - Name: NEXTCLOUD_ADMIN_PASSWORD
              ValueFrom: !Sub "${AdminSecret}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: nextcloud
          HealthCheck:
            Command:
              - CMD-SHELL
              - "curl -f -s http://localhost/robots.txt || exit 1"
            Interval: 15
            Timeout: 5
            Retries: 5
            StartPeriod: 120
        - Name: tika-extractor
          Image: apache/tika:2.9.2.0
          Essential: false
          PortMappings:
            - ContainerPort: 9998
              HostPort: 9998
              Protocol: tcp
          Environment:
            - Name: TIKA_SERVER_HOST
              Value: "0.0.0.0"
            - Name: TIKA_SERVER_PORT
              Value: "9998"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: tika

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub "${EnvironmentName}-nextcloud-service"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref NextcloudTaskDefinition
      EnableExecuteCommand: true
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Base: 1
          Weight: 1
        - CapacityProvider: FARGATE_SPOT
          Base: 0
          Weight: 3
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: !If [IsProduction, 300, 120]
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: !If [IsProduction, 100, 0]
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::If:
                - HasPublicSubnet1Id
                - !Ref PublicSubnet1Id
                - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PublicSubnet1Id"
            - Fn::If:
                - HasPublicSubnet2Id
                - !Ref PublicSubnet2Id
                - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-PublicSubnet2Id"
          SecurityGroups:
            - Fn::If:
                - HasECSSecurityGroupId
                - !Ref ECSSecurityGroupId
                - Fn::ImportValue: !Sub "${EnvironmentName}-nextcloud-ECSSecurityGroupId"
      LoadBalancers:
        - ContainerName: nextcloud
          ContainerPort: 80
          TargetGroupArn: !Ref ALBTargetGroup

  ECSAutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxCount
      MinCapacity: !Ref DesiredCount
      ResourceId: !Sub "service/${ECSCluster}/${ECSService.Name}"
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ECSAutoScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${EnvironmentName}-ecs-cpu-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ECSAutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

