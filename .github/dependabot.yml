version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci/cd"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      python-devsecops:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/tests/terratest"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "terratest"
    groups:
      terratest-sdk:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/tests/nextcloud/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "e2e"
    groups:
      e2e-npm:
        patterns:
          - "*"
