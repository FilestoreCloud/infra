name: Provision Tenant

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Unique Tenant ID (lowercase alphanumeric, e.g. acme, globex)"
        required: true
        default: "tenant-demo"
      tenant_domain:
        description: "Tenant Custom Domain (e.g. acme.yourdomain.com)"
        required: true
        default: "tenant-demo.nextcloud.local"
      environment:
        description: "Target Environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - staging
          - prod
      storage_quota_gb:
        description: "Storage Quota (GB)"
        required: false
        default: "100"

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  provision-tenant:
    name: Provision Dedicated Tenant
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 pyyaml

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          audience: sts.amazonaws.com

      - name: Verify Connection to AWS
        run: |
          echo "Connected to AWS Account ID: ${{ steps.aws-creds.outputs.aws-account-id }}"

      - name: Provision Dedicated Tenant via CloudFormation
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-tenant-${{ inputs.tenant_id }}
          template: infra/modules/tenant-instance/template.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM
          parameter-overrides: >-
            EnvironmentName=${{ inputs.environment }},
            TenantId=${{ inputs.tenant_id }},
            TenantDomain=${{ inputs.tenant_domain }},
            AdminPassword=${{ secrets.TENANT_ADMIN_PASSWORD || 'ChangeMeNextcloud2026!' }}

      - name: Report Provisioning Status
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: |
          echo "🎉 Tenant ${{ inputs.tenant_id }} provisioned successfully!"
          python3 -c "
          import os, boto3, json
          region = os.environ.get('AWS_REGION', 'ap-southeast-1')
          ddb = boto3.client('dynamodb', region_name=region)
          try:
              resp = ddb.get_item(
                  TableName='${{ inputs.environment }}-nextcloud-tenant-registry',
                  Key={'tenant_id': {'S': '${{ inputs.tenant_id }}'}}
              )
              print('Registry Record in DynamoDB:')
              print(json.dumps(resp.get('Item', {}), indent=2))
          except Exception as e:
              print(f'DynamoDB lookup note: {e}')
          "
