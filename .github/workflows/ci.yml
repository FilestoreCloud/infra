name: Infra CI Quality Gate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-infra:
    name: Infra Checks (CloudFormation Lint & Terratest Compilation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install cfn-lint -r requirements.txt

      - name: Lint CloudFormation Templates
        run: cfn-lint --config-file .devsecops/.cfnlintrc.yaml infra/modules/*/template.yaml infra/root.yaml

      - name: Compile Terratest Suites
        run: |
          cd tests/terratest
          make test-compile

      - name: Run Lambda Unit, Moto Integration & Property Tests
        run: python3 -m unittest discover -s tests/unit -v

      - name: Run Concurrent Load Benchmark
        run: python3 -m unittest tests/load/run_concurrent_stress.py -v
