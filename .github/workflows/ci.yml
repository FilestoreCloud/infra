name: Infra CI Quality Gate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  test-infra:
    name: Infra Checks (CloudFormation Lint & Terratest Compilation)
    runs-on: ubuntu-latest
    steps:
      - name: Inspect OIDC Claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Token payload:"
          python3 -c "
          import sys, json, base64
          token = '${TOKEN}'
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          data = json.loads(base64.urlsafe_b64decode(payload).decode('utf-8'))
          print(json.dumps({k: data[k] for k in ['iss', 'aud', 'sub', 'repository', 'repository_owner'] if k in data}, indent=2))
          "

      - name: Test Assume Role
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Lint CloudFormation Templates
        run: cfn-lint --config-file .devsecops/.cfnlintrc.yaml infra/modules/*/template.yaml infra/root.yaml

      - name: Compile Terratest Suites
        run: |
          cd tests/terratest
          make test-compile
