name: Code Checker

on:
  push:
    branches: [main, dev]
    paths:
      - "infra/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, dev]

jobs:
  lint-cfn:
    name: Lint & Validate CloudFormation Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linting Tools
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint YAML Syntax
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 240}, indentation: {spaces: 2}}}" \
            infra/modules/ infra/root.yaml infra/environments/

      - name: CloudFormation Lint (cfn-lint)
        uses: ScottBrenner/cfn-lint-action@v2
        with:
          command: cfn-lint infra/modules/*/template.yaml infra/root.yaml -i W3002 W2001 W1011 W3005

      - name: CloudFormation Guard Policy-as-Code (cfn-guard)
        uses: ./.github/actions/cfn-guard
        with:
          rules: "infra/rules/"
          data: "infra/modules/*/template.yaml infra/root.yaml"
          show-summary: "fail"

      - name: Validate Templates Syntax
        run: |
          python3 -c "
          import yaml, glob
          class CfnLoader(yaml.SafeLoader): pass
          def ctor(l, s, n): return l.construct_scalar(n) if isinstance(n, yaml.ScalarNode) else (l.construct_sequence(n) if isinstance(n, yaml.SequenceNode) else l.construct_mapping(n))
          CfnLoader.add_multi_constructor('!', ctor)
          files = glob.glob('infra/modules/*/template.yaml') + ['infra/root.yaml']
          for f in files:
              yaml.load(open(f), Loader=CfnLoader)
              print(f'  ✓ Validated {f}')
          "

      - name: Scan for Hardcoded Secrets
        run: |
          echo "Scanning for hardcoded credentials..."
          if grep -rnE "(AWS_SECRET_ACCESS_KEY|sk-saas-nextcloud-internal)" infra/ tests/ 2>/dev/null; then
            echo "❌ Potential secret found in repository files!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found."

  test-python:
    name: Python Scripts Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: pytest tests/ -v
