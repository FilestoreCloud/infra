name: Cloudflare DNS Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to execute (audit, sync, clean, status)"
        required: true
        default: "sync"
        type: choice
        options:
          - audit
          - sync
          - status
          - clean
          - cert
      environment:
        description: "Target Environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudflare-dns-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  manage-dns:
    name: Cloudflare DNS ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ap-southeast-1

      - name: Install boto3
        run: pip install boto3

      - name: Run Cloudflare DNS Manager
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/manage_dns.py "${{ inputs.action }}" --env "${{ inputs.environment }}" --zone png261.dev
