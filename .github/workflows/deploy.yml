name: Deploy Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Deployment Environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read # Required for actions/checkout

concurrency:
  group: deploy-${{ github.ref_name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-networking:
    name: Deploy 01-Networking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 01-Networking Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-01-networking
          template: infra/modules/01-networking/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (01-Networking)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceNetworking$" -timeout 5m

  deploy-security:
    name: Deploy 02-Security
    needs: [deploy-networking]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 02-Security Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-02-security
          template: infra/modules/02-security/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (02-Security)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceSecurity$" -timeout 5m

  deploy-storage:
    name: Deploy 03-Storage
    needs: [deploy-networking]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 03-Storage Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-03-storage
          template: infra/modules/03-storage/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (03-Storage)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceStorage$" -timeout 5m

  deploy-database:
    name: Deploy 04-Database
    needs: [deploy-security, deploy-storage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 04-Database Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-04-database
          template: infra/modules/04-database/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }},DBPassword=${{ secrets.DB_PASSWORD }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (04-Database)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceDatabase$" -timeout 5m

  deploy-compute:
    name: Deploy 05-Compute
    needs: [deploy-database]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Resolve Golden Image URI
        id: image-resolver
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_IMAGE="${ACCOUNT_ID}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ inputs.environment }}-nextcloud-enterprise:${{ inputs.environment }}"
          echo "image=${ECR_IMAGE}" >> $GITHUB_OUTPUT
          echo "Using Golden Image URI: ${ECR_IMAGE}"

      - name: Deploy 05-Compute Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-05-compute
          template: infra/modules/05-compute/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }},AdminPassword=${{ secrets.ADMIN_PASSWORD }},ContainerImage=${{ steps.image-resolver.outputs.image }},CreateECRRepository=false"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (05-Compute & Resilience)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^(TestInPlaceCompute|TestInPlaceResilience_ECSFargateSelfHealing)$" -timeout 10m

  deploy-superadmin:
    name: Deploy 06-SuperAdmin
    needs: [deploy-compute]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 06-SuperAdmin Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-06-superadmin
          template: infra/modules/06-superadmin/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy Complete SuperAdmin Lambda Operator Logic
        run: |
          echo "Packaging and updating tenant operator Lambda function..."
          cd infra/modules/06-superadmin
          python3 -c "
          import zipfile
          with open('tenant_operator_lambda.py', 'rb') as f:
              code = f.read()
          with zipfile.ZipFile('/tmp/tenant_operator.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('index.py', code)
          "
          aws lambda update-function-code \
            --function-name "${{ inputs.environment }}-nextcloud-tenant-operator" \
            --zip-file fileb:///tmp/tenant_operator.zip
          echo "✓ Lambda function code updated successfully."

      - name: Ensure Lambda Function URL Invocation Permissions
        run: |
          echo "Ensuring Lambda Function URL public invocation permissions..."
          aws lambda add-permission \
            --function-name "${{ inputs.environment }}-nextcloud-tenant-operator" \
            --statement-id "FunctionURLPublicInvokeStatement" \
            --action "lambda:InvokeFunctionUrl" \
            --principal "*" \
            --function-url-auth-type "NONE" 2>/dev/null || true
          aws lambda add-permission \
            --function-name "${{ inputs.environment }}-nextcloud-tenant-operator" \
            --statement-id "FunctionPublicInvokeStatement" \
            --action "lambda:InvokeFunction" \
            --principal "*" 2>/dev/null || true
          echo "Lambda resource policy verified:"
          aws lambda get-policy --function-name "${{ inputs.environment }}-nextcloud-tenant-operator" || true

      - name: Ensure SuperAdmin User in Cognito User Pool
        env:
          ENV: ${{ inputs.environment }}
          ADMIN_EMAIL: "nhphuong.code@gmail.com"
        run: |
          echo "Ensuring SuperAdmin user exists in Cognito User Pool..."
          USER_POOL_ID=$(aws ssm get-parameter --name "/nextcloud/${ENV}/control-plane/cognito-user-pool-id" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -z "$USER_POOL_ID" ]; then
            USER_POOL_ID=$(aws cognito-idp list-user-pools --max-results 10 --query "UserPools[?Name=='${ENV}-nextcloud-admin-pool'].Id" --output text 2>/dev/null || echo "")
          fi
          if [ -n "$USER_POOL_ID" ]; then
            echo "Target User Pool: $USER_POOL_ID"
            if ! aws cognito-idp admin-get-user --user-pool-id "$USER_POOL_ID" --username "$ADMIN_EMAIL" >/dev/null 2>&1; then
              echo "Creating SuperAdmin user $ADMIN_EMAIL in Cognito..."
              aws cognito-idp admin-create-user \
                --user-pool-id "$USER_POOL_ID" \
                --username "$ADMIN_EMAIL" \
                --user-attributes Name=email,Value="$ADMIN_EMAIL" Name=email_verified,Value=true \
                --message-action SUPPRESS
              aws cognito-idp admin-set-user-password \
                --user-pool-id "$USER_POOL_ID" \
                --username "$ADMIN_EMAIL" \
                --password "${{ secrets.ADMIN_PASSWORD }}" \
                --permanent
              echo "✓ SuperAdmin user created successfully in Cognito."
            else
              echo "✓ SuperAdmin user already exists in Cognito User Pool."
            fi
          fi

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (06-SuperAdmin)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceSuperAdmin$" -timeout 5m

  deploy-observability:
    name: Deploy 07-Observability
    needs: [deploy-compute]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 07-Observability Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-07-observability
          template: infra/modules/07-observability/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (07-Observability)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceObservability$" -timeout 5m

  verify-first-time-acceptance:
    name: First-Time Deployment Acceptance (SuperAdmin & Dev Tenant Verification)
    needs: [deploy-superadmin, deploy-observability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt requests boto3 pytest

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Run Acceptance & Tenant Provisioning Verification
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TENANT_ID: "dev-tenant"
          SUPERADMIN_USERNAME: "nhphuong.code@gmail.com"
          SUPERADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          chmod +x tests/verify_first_time_deployment_acceptance.py
          python3 tests/verify_first_time_deployment_acceptance.py

      - name: Setup Node.js for Playwright E2E Tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Dependencies & Chromium
        run: |
          cd tests/nextcloud/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright Nextcloud E2E Suite
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TENANT_ID: "dev-tenant"
          NEXTCLOUD_USER: "admin"
          NEXTCLOUD_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUPERADMIN_USERNAME: "nhphuong.code@gmail.com"
          SUPERADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          ALB_DNS=$(aws ssm get-parameter --name "/nextcloud/${ENV}/infra/alb-dns-name" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -z "$ALB_DNS" ]; then
            ALB_DNS=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?contains(LoadBalancerName, '${ENV}-nextcloud-alb')].DNSName" --output text)
          fi
          echo "Target ALB DNS for Playwright E2E: $ALB_DNS"

          CONSOLE_URL=$(aws ssm get-parameter --name "/nextcloud/${ENV}/control-plane/admin-web-url" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -z "$CONSOLE_URL" ]; then
            DIST_ID=$(aws ssm get-parameter --name "/nextcloud/${ENV}/control-plane/cloudfront-distribution-id" --query "Parameter.Value" --output text 2>/dev/null || echo "")
            if [ -n "$DIST_ID" ]; then
              CF_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query "Distribution.DomainName" --output text 2>/dev/null || echo "")
              CONSOLE_URL="https://${CF_DOMAIN}"
            fi
          fi
          echo "Target SuperAdmin Console URL: $CONSOLE_URL"

          cd tests/nextcloud/e2e
          TENANT_URL="http://${ALB_DNS}" CONSOLE_URL="${CONSOLE_URL}" npm test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: tests/nextcloud/e2e/playwright-report/
          retention-days: 14

      - name: Trigger SuperAdmin Console Deployment in console repo
        if: env.GITOPS_TOKEN != ''
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          echo "Dispatching deploy_console event to ${ORG_NAME}/console..."
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${GITOPS_TOKEN}" \
            https://api.github.com/repos/${ORG_NAME}/console/dispatches \
            -d "{\"event_type\": \"deploy_console\", \"client_payload\": {\"environment\": \"${{ inputs.environment }}\"}}" || true
          echo "✓ Console deployment event successfully dispatched."
