name: Deploy Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Deployment Environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read # Required for actions/checkout

concurrency:
  group: deploy-${{ github.ref_name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-flight Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Validation Tools
        run: |
          pip install --upgrade pip
          pip install cfn-lint yamllint pyyaml

      - name: Validate Templates
        run: |
          cfn-lint infra/modules/*/template.yaml infra/root.yaml -i W3002 W2001 W1011 W3005
          echo "✓ All CloudFormation templates validated cleanly."

  deploy-networking:
    name: Deploy 01-Networking
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 01-Networking Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-01-networking
          template: infra/modules/01-networking/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

  deploy-security:
    name: Deploy 02-Security
    needs: [deploy-networking]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 02-Security Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-02-security
          template: infra/modules/02-security/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

  deploy-storage:
    name: Deploy 03-Storage
    needs: [deploy-networking]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 03-Storage Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-03-storage
          template: infra/modules/03-storage/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

  deploy-database:
    name: Deploy 04-Database
    needs: [deploy-security, deploy-storage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 04-Database Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-04-database
          template: infra/modules/04-database/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }},DBPassword=${{ secrets.DB_PASSWORD }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

  deploy-compute:
    name: Deploy 05-Compute
    needs: [deploy-database]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 05-Compute Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-05-compute
          template: infra/modules/05-compute/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }},AdminPassword=${{ secrets.ADMIN_PASSWORD }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

  deploy-superadmin:
    name: Deploy 06-SuperAdmin
    needs: [deploy-compute]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 06-SuperAdmin Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-06-superadmin
          template: infra/modules/06-superadmin/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy Complete SuperAdmin Lambda Operator Logic
        run: |
          echo "Packaging and updating tenant operator Lambda function..."
          cd infra/modules/06-superadmin
          python3 -c "
          import zipfile
          with open('tenant_operator_lambda.py', 'rb') as f:
              code = f.read()
          with zipfile.ZipFile('/tmp/tenant_operator.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('index.py', code)
          "
          aws lambda update-function-code \
            --function-name "${{ inputs.environment }}-nextcloud-tenant-operator" \
            --zip-file fileb:///tmp/tenant_operator.zip
          echo "✓ Lambda function code updated successfully."

  deploy-observability:
    name: Deploy 07-Observability
    needs: [deploy-compute]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 07-Observability Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-07-observability
          template: infra/modules/07-observability/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

  verify-terratest:
    name: Terratest In-Place Verification
    needs: [deploy-superadmin, deploy-observability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Run Terratest In-Place Infrastructure Verification
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "TestInPlace" -timeout 15m

  verify-first-time-acceptance:
    name: First-Time Deployment Acceptance (SuperAdmin & Dev Tenant Verification)
    needs: [verify-terratest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt requests boto3 pytest

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Run Acceptance & Tenant Provisioning Verification
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TENANT_ID: "dev-tenant"
        run: |
          chmod +x tests/test_first_time_deployment_acceptance.py
          python3 tests/test_first_time_deployment_acceptance.py

      - name: Trigger SuperAdmin Console Deployment in console repo
        if: env.GITOPS_TOKEN != ''
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          echo "Dispatching deploy_console event to ${ORG_NAME}/console..."
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${GITOPS_TOKEN}" \
            https://api.github.com/repos/${ORG_NAME}/console/dispatches \
            -d "{\"event_type\": \"deploy_console\", \"client_payload\": {\"environment\": \"${{ inputs.environment }}\"}}" || true
          echo "✓ Console deployment event successfully dispatched."
