name: Deploy Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Deployment Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Deployment / Lifecycle Action"
        required: true
        default: "deploy-module"
        type: choice
        options:
          - deploy-module
          - deploy-all
          - deploy-nested
          - destroy-module
          - destroy-all
          - validate
      module:
        description: "Infrastructure Module (if deploy-module or destroy-module)"
        required: false
        default: "compute"
        type: choice
        options:
          - compute
          - database
          - storage
          - security
          - networking
          - control-plane
      provision_smoke_tenant:
        description: "Run automated tenant provisioning smoke test after deploy"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read # Required for actions/checkout

concurrency:
  group: deploy-${{ github.ref_name }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-flight Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Validation Tools
        run: pip install cfn-lint yamllint pyyaml

      - name: Validate Templates
        run: |
          for f in infra/modules/*/template.yaml infra/root.yaml; do
            echo "Checking $f..."
            python3 -c "
            import yaml
            class CfnLoader(yaml.SafeLoader): pass
            def ctor(l, s, n): return l.construct_scalar(n) if isinstance(n, yaml.ScalarNode) else (l.construct_sequence(n) if isinstance(n, yaml.SequenceNode) else l.construct_mapping(n))
            CfnLoader.add_multi_constructor('!', ctor)
            yaml.load(open('$f'), Loader=CfnLoader)
            " && echo "  ✓ Valid syntax"
          done

  deploy:
    name: Deploy to AWS
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 psycopg2-binary pyyaml

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Connected to AWS Account ID: ${{ steps.aws-creds.outputs.aws-account-id }}"

      - name: Determine Environment & Action
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            ACTION="${{ inputs.action }}"
            MODULE="${{ inputs.module }}"
          else
            # Automatic branch-based deployment
            if [ "${{ github.ref_name }}" = "main" ]; then
              ENV="prod"
            else
              ENV="dev"
            fi
            ACTION="deploy-module"
            MODULE="compute"
          fi
          echo "env=${ENV}" >> $GITHUB_OUTPUT
          echo "action=${ACTION}" >> $GITHUB_OUTPUT
          echo "module=${MODULE}" >> $GITHUB_OUTPUT
          echo "🚀 Target: Env=${ENV}, Action=${ACTION}, Module=${MODULE}"

      - name: Deploy 01-Networking Stack
        if: steps.target.outputs.action == 'deploy-all' || steps.target.outputs.module == '01-networking' || steps.target.outputs.module == 'networking'
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ steps.target.outputs.env }}-nextcloud-01-networking
          template: infra/modules/01-networking/template.yaml
          parameter-overrides: "EnvironmentName=${{ steps.target.outputs.env }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 02-Security Stack
        if: steps.target.outputs.action == 'deploy-all' || steps.target.outputs.module == '02-security' || steps.target.outputs.module == 'security'
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ steps.target.outputs.env }}-nextcloud-02-security
          template: infra/modules/02-security/template.yaml
          parameter-overrides: "EnvironmentName=${{ steps.target.outputs.env }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 03-Storage Stack
        if: steps.target.outputs.action == 'deploy-all' || steps.target.outputs.module == '03-storage' || steps.target.outputs.module == 'storage'
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ steps.target.outputs.env }}-nextcloud-03-storage
          template: infra/modules/03-storage/template.yaml
          parameter-overrides: "EnvironmentName=${{ steps.target.outputs.env }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 04-Database Stack
        if: steps.target.outputs.action == 'deploy-all' || steps.target.outputs.module == '04-database' || steps.target.outputs.module == 'database'
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ steps.target.outputs.env }}-nextcloud-04-database
          template: infra/modules/04-database/template.yaml
          parameter-overrides: "EnvironmentName=${{ steps.target.outputs.env }},DBPassword=${{ secrets.DB_PASSWORD || 'NextCloudSecurePass2026!' }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 05-Compute Stack
        if: steps.target.outputs.action == 'deploy-all' || steps.target.outputs.module == '05-compute' || steps.target.outputs.module == 'compute'
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ steps.target.outputs.env }}-nextcloud-05-compute
          template: infra/modules/05-compute/template.yaml
          parameter-overrides: "EnvironmentName=${{ steps.target.outputs.env }},AdminPassword=${{ secrets.ADMIN_PASSWORD || 'AdminSuperSecurePass2026!' }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 06-Control-Plane Stack
        if: steps.target.outputs.action == 'deploy-all' || steps.target.outputs.module == '06-control-plane' || steps.target.outputs.module == 'control-plane'
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ steps.target.outputs.env }}-nextcloud-06-control-plane
          template: infra/modules/06-control-plane/template.yaml
          parameter-overrides: "EnvironmentName=${{ steps.target.outputs.env }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Smoke Test & Health Check
        id: smoke_test
        env:
          ENV_NAME: ${{ steps.target.outputs.env }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: |
          python3 -c "
          import os, boto3, urllib.request, ssl
          env_name = os.environ.get('ENV_NAME', 'dev')
          region = os.environ.get('AWS_REGION', 'ap-southeast-1')
          ssm = boto3.client('ssm', region_name=region)
          try:
              param = ssm.get_parameter(Name=f'/nextcloud/{env_name}/infra/alb-dns')
              alb_dns = param['Parameter']['Value']
              url = f'http://{alb_dns}/status.php'
              print(f'Checking Nextcloud ALB health: {url}')
              req = urllib.request.Request(url, headers={'User-Agent': 'CI-Smoke-Check'})
              ctx = ssl.create_default_context()
              with urllib.request.urlopen(req, timeout=15, context=ctx) as res:
                  print(f'ALB Response HTTP {res.status}')
          except Exception as e:
              print(f'ALB check: {e}')
          "

      - name: Automated Tenant Provisioning Verification
        if: ${{ inputs.provision_smoke_tenant == true }}
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ steps.target.outputs.env }}-nextcloud-tenant-smoke
          template: infra/modules/tenant-instance/template.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM
          parameter-overrides: >-
            EnvironmentName=${{ steps.target.outputs.env }},
            TenantId=smoke,
            TenantDomain=smoke.${{ steps.target.outputs.env }}.nextcloud.local,
            AdminPassword=${{ secrets.SMOKE_TENANT_ADMIN_PASSWORD || 'SmokeNextcloud2026!' }}
