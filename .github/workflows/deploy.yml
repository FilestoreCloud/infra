name: Deploy Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Deployment Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read # Required for actions/checkout

concurrency:
  group: deploy-${{ github.ref_name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-flight Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Validation Tools
        run: pip install cfn-lint yamllint pyyaml

      - name: Validate Templates
        run: |
          for f in infra/modules/*/template.yaml infra/root.yaml; do
            echo "Checking $f..."
            python3 -c "
            import yaml
            class CfnLoader(yaml.SafeLoader): pass
            def ctor(l, s, n): return l.construct_scalar(n) if isinstance(n, yaml.ScalarNode) else (l.construct_sequence(n) if isinstance(n, yaml.SequenceNode) else l.construct_mapping(n))
            CfnLoader.add_multi_constructor('!', ctor)
            yaml.load(open('$f'), Loader=CfnLoader)
            " && echo "  ✓ Valid syntax"
          done

  deploy:
    name: Deploy to AWS
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 pyyaml

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Connected to AWS Account ID: ${{ steps.aws-creds.outputs.aws-account-id }}"
          echo "🚀 Deploying infrastructure to: ${{ inputs.environment }}"

      - name: Deploy 01-Networking Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-01-networking
          template: infra/modules/01-networking/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 02-Security Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-02-security
          template: infra/modules/02-security/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 03-Storage Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-03-storage
          template: infra/modules/03-storage/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 04-Database Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-04-database
          template: infra/modules/04-database/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }},DBPassword=${{ secrets.DB_PASSWORD || 'NextCloudSecurePass2026!' }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 05-Compute Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-05-compute
          template: infra/modules/05-compute/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }},AdminPassword=${{ secrets.ADMIN_PASSWORD || 'AdminSuperSecurePass2026!' }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy 06-SuperAdmin Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-06-superadmin
          template: infra/modules/06-superadmin/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Smoke Test & Health Check
        id: smoke_test
        env:
          ENV_NAME: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: |
          python3 -c "
          import os, boto3, urllib.request, ssl
          env_name = os.environ.get('ENV_NAME', 'dev')
          region = os.environ.get('AWS_REGION', 'ap-southeast-1')
          ssm = boto3.client('ssm', region_name=region)
          try:
              param = ssm.get_parameter(Name=f'/nextcloud/{env_name}/infra/alb-dns')
              alb_dns = param['Parameter']['Value']
              url = f'http://{alb_dns}/status.php'
              print(f'Checking Nextcloud ALB health: {url}')
              req = urllib.request.Request(url, headers={'User-Agent': 'CI-Smoke-Check'})
              ctx = ssl.create_default_context()
              with urllib.request.urlopen(req, timeout=15, context=ctx) as res:
                  print(f'ALB Response HTTP {res.status}')
          except Exception as e:
              print(f'ALB check: {e}')
          "
