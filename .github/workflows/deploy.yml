name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Deployment Environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read # Required for actions/checkout

concurrency:
  group: deploy-${{ github.ref_name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-networking:
    name: Deploy 01-Networking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 01-Networking Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-01-networking
          template: infra/modules/01-networking/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (01-Networking)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceNetworking$" -timeout 5m

  deploy-security:
    name: Deploy 02-Security
    needs: [deploy-networking]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 02-Security Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-02-security
          template: infra/modules/02-security/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (02-Security)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceSecurity$" -timeout 5m

  deploy-storage:
    name: Deploy 03-Storage
    needs: [deploy-security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 03-Storage Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-03-storage
          template: infra/modules/03-storage/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (03-Storage)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceStorage$" -timeout 5m

  deploy-database:
    name: Deploy 04-Database
    needs: [deploy-security, deploy-storage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 04-Database Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-04-database
          template: infra/modules/04-database/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }},DBPassword=${{ secrets.DB_PASSWORD }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (04-Database)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceDatabase$" -timeout 5m

  deploy-compute:
    name: Deploy 05-Compute
    needs: [deploy-database]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          output-credentials: true

      - name: Resolve Golden Image URI
        id: image-resolver
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENV: ${{ inputs.environment }}
          ACCOUNT_ID: ${{ steps.aws-creds.outputs.aws-account-id }}
        run: |
          python3 -c "
          import os, sys, boto3

          region = os.environ['AWS_REGION']
          env_name = os.environ['ENV']
          account_id = os.environ['ACCOUNT_ID']
          repo = f'{env_name}-nextcloud-enterprise'

          ecr = boto3.client('ecr', region_name=region)
          try:
              desc = ecr.describe_images(repositoryName=repo, imageIds=[{'imageTag': env_name}])
              digest = desc['imageDetails'][0]['imageDigest']
              image_uri = f'{account_id}.dkr.ecr.{region}.amazonaws.com/{repo}@{digest}'
              print(f'Using Golden Image Digest URI: {image_uri}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'image={image_uri}\n')
          except Exception as e:
              print(f'Error resolving image digest: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Deploy 05-Compute Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-05-compute
          template: infra/modules/05-compute/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }},AdminPassword=${{ secrets.ADMIN_PASSWORD }},ContainerImage=${{ steps.image-resolver.outputs.image }},CreateECRRepository=false"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (05-Compute & Resilience)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^(TestInPlaceCompute|TestInPlaceResilience_ECSFargateSelfHealing)$" -timeout 10m

  deploy-superadmin:
    name: Deploy 06-SuperAdmin
    needs: [deploy-compute]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Resolve Deployment S3 Bucket
        id: resolve-bucket
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENV: ${{ inputs.environment }}
        run: |
          python3 -c "
          import os, sys, boto3
          region = os.environ['AWS_REGION']
          env_name = os.environ['ENV']
          cfn = boto3.client('cloudformation', region_name=region)
          try:
              storage_stack = cfn.describe_stacks(StackName=f'{env_name}-nextcloud-03-storage')['Stacks'][0]
              bucket = [o['OutputValue'] for o in storage_stack['Outputs'] if o['OutputKey'] == 'S3VaultBucketName'][0]
              print(f'Using S3 Bucket for large templates: {bucket}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'bucket={bucket}\n')
          except Exception as e:
              print(f'Error resolving S3 bucket: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Resolve Custom Domain Certificate
        id: cert-resolver
        run: |
          CERT_ARN=$(aws ssm get-parameter --name "/nextcloud/${{ inputs.environment }}/control-plane/admin-certificate-arn" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          echo "cert_arn=${CERT_ARN}" >> $GITHUB_OUTPUT
          if [ -n "$CERT_ARN" ]; then
            echo "✅ Custom Domain ACM Certificate detected: ${CERT_ARN}"
          else
            echo "ℹ️ No custom domain ACM certificate in SSM; using standard CloudFront certificate."
          fi

      - name: Deploy 06-SuperAdmin Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-06-superadmin
          template: infra/modules/06-superadmin/template.yaml
          s3-bucket: ${{ steps.resolve-bucket.outputs.bucket }}
          s3-prefix: cfn-templates
          parameter-overrides: "EnvironmentName=${{ inputs.environment }},AdminCertificateArn=${{ steps.cert-resolver.outputs.cert_arn }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Seed SuperAdmin User & Initial Tenant (AWS Python SDK)
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENV: ${{ inputs.environment }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          ADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python3 -c "
          import os, boto3, hashlib, time
          region = os.environ['AWS_REGION']
          env_name = os.environ['ENV']
          username = os.environ.get('ADMIN_USERNAME', '').strip().lower()
          pwd = os.environ.get('ADMIN_PASSWORD', '').strip()
          tenant_id = os.environ.get('TENANT_ID', '').strip()

          ddb = boto3.resource('dynamodb', region_name=region)
          if username and pwd:
              user_tbl = ddb.Table(f'{env_name}-nextcloud-admin-users')
              pwd_hash = hashlib.sha256(pwd.encode()).hexdigest()
              user_tbl.put_item(Item={
                  'username': username,
                  'password_hash': pwd_hash,
                  'role': 'SuperAdmin',
                  'created_at': int(time.time()),
                  'updated_at': int(time.time())
              })
              print(f'✓ SuperAdmin user {username} seeded in {env_name}-nextcloud-admin-users')

          if tenant_id:
              tenant_tbl = ddb.Table(f'{env_name}-nextcloud-tenant-registry')
              tenant_tbl.put_item(Item={
                  'tenant_id': tenant_id,
                  'status': 'ACTIVE',
                  'progress': 100,
                  'current_step': 'Ready & Operational',
                  'created_at': int(time.time()),
                  'domain': f'{tenant_id}.png261.dev',
                  'admin_email': f'admin@{tenant_id}.com',
                  'quota_gb': 100
              })
              print(f'✓ Initial tenant {tenant_id} registered and ACTIVE in {env_name}-nextcloud-tenant-registry')
          "

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (06-SuperAdmin)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlace(SuperAdmin|StepFunctions|TenantOperator)$" -timeout 10m

  deploy-observability:
    name: Deploy 07-Observability
    needs: [deploy-compute]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy 07-Observability Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ inputs.environment }}-nextcloud-07-observability
          template: infra/modules/07-observability/template.yaml
          parameter-overrides: "EnvironmentName=${{ inputs.environment }}"
          fail-on-empty-changeset: "0"
          capabilities: CAPABILITY_NAMED_IAM

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest In-Place Verification (07-Observability)
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceObservability$" -timeout 5m

  verify-first-time-acceptance:
    name: First-Time Deployment Acceptance (SuperAdmin & Dev Tenant Verification)
    needs: [deploy-superadmin, deploy-observability]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt requests boto3 pytest

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Go for Terratest
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest Acceptance & Tenant Provisioning Verification
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUPERADMIN_TOTP_SECRET: ${{ secrets.SUPERADMIN_TOTP_SECRET }}
        run: |
          cd tests/terratest
          go test -v -run "^TestInPlaceDeploymentAcceptance$" -timeout 10m

      - name: Setup Node.js for Playwright E2E Tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/nextcloud/e2e/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Dependencies & Chromium
        run: |
          cd tests/nextcloud/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Resolve Acceptance Target Endpoints
        id: endpoints
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          python3 -c "
          import os, boto3
          region = os.environ['AWS_REGION']
          env_name = os.environ['ENV']
          ssm = boto3.client('ssm', region_name=region)
          alb_dns = ssm.get_parameter(Name=f'/nextcloud/{env_name}/infra/alb-dns')['Parameter']['Value']
          admin_url = ssm.get_parameter(Name=f'/nextcloud/{env_name}/control-plane/admin-web-url')['Parameter']['Value']
          print(f'Resolved ALB DNS: {alb_dns}')
          print(f'Resolved Console URL: {admin_url}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'alb_dns={alb_dns}\n')
              f.write(f'console_url={admin_url}\n')
          "

      - name: Run Playwright Nextcloud E2E Suite
        env:
          ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          NEXTCLOUD_USER: ${{ vars.NEXTCLOUD_USER }}
          NEXTCLOUD_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUPERADMIN_TOTP_SECRET: ${{ secrets.SUPERADMIN_TOTP_SECRET }}
          ALB_DNS: ${{ steps.endpoints.outputs.alb_dns }}
          CONSOLE_URL: ${{ steps.endpoints.outputs.console_url }}
        run: |
          echo "Target ALB DNS for Playwright E2E: $ALB_DNS"
          echo "Target SuperAdmin Console URL: $CONSOLE_URL"

          cd tests/nextcloud/e2e
          TENANT_URL="http://${ALB_DNS}" CONSOLE_URL="${CONSOLE_URL}" npm test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: tests/nextcloud/e2e/playwright-report/
          retention-days: 14
