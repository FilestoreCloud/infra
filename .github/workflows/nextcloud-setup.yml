name: Nextcloud Initial Setup
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for setup"
        required: false
        default: "Initial setup"
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Reset DB and Install Nextcloud via occ
        run: |
          echo "=== 0. Checking RDS PostgreSQL Database Status ==="
          aws rds describe-db-instances --query "DBInstances[*].{ID:DBInstanceIdentifier,Status:DBInstanceStatus,Endpoint:Endpoint.Address,Port:Endpoint.Port,VpcId:DBSubnetGroup.VpcId}" --output table

          DB_STATUS=$(aws rds describe-db-instances --db-instance-identifier prod-nextcloud-db --query "DBInstances[0].DBInstanceStatus" --output text || echo "unknown")
          echo "prod-nextcloud-db status: $DB_STATUS"
          if [ "$DB_STATUS" = "stopped" ]; then
            echo "RDS prod-nextcloud-db is stopped! Starting it now..."
            aws rds start-db-instance --db-instance-identifier prod-nextcloud-db
            echo "Waiting for prod-nextcloud-db to become available..."
            aws rds wait db-instance-available --db-instance-identifier prod-nextcloud-db
            echo "prod-nextcloud-db is now available!"
          elif [ "$DB_STATUS" = "starting" ]; then
            echo "prod-nextcloud-db is starting. Waiting for available..."
            aws rds wait db-instance-available --db-instance-identifier prod-nextcloud-db
            echo "prod-nextcloud-db is now available!"
          fi

          echo "=== 0b. Inspecting RDS Security Groups and Ingress Rules ==="
          RDS_SG=$(aws rds describe-db-instances --db-instance-identifier prod-nextcloud-db --query "DBInstances[0].VpcSecurityGroups[0].VpcSecurityGroupId" --output text)
          echo "RDS SG: $RDS_SG"
          aws ec2 describe-security-groups --group-ids "$RDS_SG" --query "SecurityGroups[0].IpPermissions" --output json

          echo "=== 0c. Inspecting VPC Network ACLs ==="
          VPC_ID=$(aws cloudformation describe-stacks --stack-name prod-nextcloud-01-networking --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" --output text)
          echo "VPC: $VPC_ID"
          aws ec2 describe-network-acls --filters "Name=vpc-id,Values=$VPC_ID" --query "NetworkAcls[*].Entries" --output json

          echo "=== 1. Discovering Networking Resources ==="
          aws secretsmanager put-secret-value --secret-id /nextcloud/prod/secrets/admin-credentials --secret-string '{"username":"admin","password":"StorixAdmin2026!Secure"}' || :
          SUBNET=$(aws cloudformation describe-stacks --stack-name prod-nextcloud-01-networking --query "Stacks[0].Outputs[?OutputKey=='PublicSubnet1Id'].OutputValue" --output text)
          SG=$(aws cloudformation describe-stacks --stack-name prod-nextcloud-02-security --query "Stacks[0].Outputs[?OutputKey=='ECSSecurityGroupId'].OutputValue" --output text)
          echo "Subnet: $SUBNET, SG: $SG"

          echo "=== 2. Generating Task Overrides ==="
          python3 scripts/generate_install_overrides.py

          TASK_ARN=$(aws ecs run-task \
            --cluster prod-nextcloud-cluster \
            --task-definition prod-nextcloud-app \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides file://overrides.json \
            --query "tasks[0].taskArn" --output text)

          echo "Launched install task: $TASK_ARN"
          TASK_ID=$(echo "$TASK_ARN" | awk -F'/' '{print $NF}')
          aws ecs wait tasks-stopped --cluster prod-nextcloud-cluster --tasks "$TASK_ARN"
          echo "Installation task completed."

          echo "=== Task Details and Exit Code ==="
          aws ecs describe-tasks --cluster prod-nextcloud-cluster --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].{ExitCode:exitCode,Reason:reason}" --output table || :

          EXIT_CODE=$(aws ecs describe-tasks --cluster prod-nextcloud-cluster --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" --output text || echo "1")

          echo "=== Task CloudWatch Logs ==="
          aws logs get-log-events \
            --log-group-name /ecs/prod-nextcloud \
            --log-stream-name "nextcloud/nextcloud/$TASK_ID" \
            --limit 100 \
            --query "events[*].message" --output text || :

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Setup task failed with exit code $EXIT_CODE"
            exit 1
          fi

          echo "=== 3. Restarting ECS Service ==="
          aws ecs update-service \
            --cluster prod-nextcloud-cluster \
            --service prod-nextcloud-service \
            --desired-count 1 \
            --force-new-deployment

      - name: Update SuperAdmin Lambda Function (MFA Disabled)
        run: |
          echo "=== 4. Updating SuperAdmin Lambda Code (MFA Disabled) ==="
          cd infra/modules/06-superadmin
          zip -q -r /tmp/operator.zip tenant_operator_lambda.py tenant_worker_lambda.py operator_core/
          aws lambda update-function-code \
            --function-name prod-nextcloud-tenant-operator \
            --zip-file fileb:///tmp/operator.zip
          echo "SuperAdmin Lambda updated successfully with MFA disabled."
