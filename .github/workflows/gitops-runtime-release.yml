name: GitOps Runtime Release Handler

on:
  repository_dispatch:
    types: [runtime_release]
  workflow_dispatch:
    inputs:
      image:
        description: "Full Container Image URI (e.g. 123456789.dkr.ecr.region.amazonaws.com/filestore-runtime:v1.2.3)"
        required: true
        type: string
      tag:
        description: "Release Tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-container-image:
    name: Update Container Image in prod.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (dev branch)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve Image and Tag
        id: vars
        run: |
          IMAGE="${{ github.event.client_payload.image || inputs.image }}"
          TAG="${{ github.event.client_payload.tag || inputs.tag }}"
          if [ -z "$IMAGE" ] || [ -z "$TAG" ]; then
            echo "Missing image or tag in payload"
            exit 1
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Runtime Image: ${IMAGE}"
          echo "Target Tag: ${TAG}"

      - name: Update infra/environments/prod.json
        run: |
          python3 -c "
          import json
          filepath = 'infra/environments/prod.json'
          with open(filepath, 'r') as f:
              params = json.load(f)
          updated = False
          for p in params:
              if p.get('ParameterKey') == 'ContainerImage':
                  p['ParameterValue'] = '${{ steps.vars.outputs.image }}'
                  updated = True
          if not updated:
              params.append({'ParameterKey': 'ContainerImage', 'ParameterValue': '${{ steps.vars.outputs.image }}'})
          with open(filepath, 'w') as f:
              json.dump(params, f, indent=2)
              f.write('\n')
          "
          echo "Updated prod.json:"
          cat infra/environments/prod.json

      - name: Create Git Branch & Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          IMAGE="${{ steps.vars.outputs.image }}"
          BRANCH="gitops/runtime-${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add infra/environments/prod.json
          git commit -m "chore(release): bump runtime container image to ${TAG}"
          git push origin "${BRANCH}" --force

          cat <<EOF > /tmp/pr-body.md
          ### Automated GitOps Release

          This pull request was automatically generated by the GitOps release pipeline from \`FilestoreCloud/runtime\`.

          - **Release Tag:** \`${TAG}\`
          - **Container Image:** \`${IMAGE}\`
          - **Target File:** \`infra/environments/prod.json\`

          Please review and merge into \`dev\` to initiate the staging / production fleet rollout.
          EOF

          gh pr create \
            --base dev \
            --head "${BRANCH}" \
            --title "chore(release): bump runtime container image to ${TAG}" \
            --body-file /tmp/pr-body.md
