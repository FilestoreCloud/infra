name: Fleet Image Rollout Pipeline

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-patch*"
      - "v*.*.*-hotfix*"
      - "v*.*.*-beta*"
      - "v*.*.*-rc*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker Image Tag (e.g. v30.0.17-patch.1, v31.0.0-beta.1, v31.0.0)"
        required: true
        type: string
      override_type:
        description: "Override Release Type (leave AUTO for automatic tag classification)"
        required: false
        type: choice
        options:
          - "AUTO"
          - "PATCH"
          - "BETA"
          - "BREAKTHROUGH"
        default: "AUTO"
      dry_run:
        description: "Simulate rollout without mutating live AWS services"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write # AWS OIDC Token
  contents: read

concurrency:
  group: fleet-rollout-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: nextcloud-enterprise-ai
  CLUSTER_NAME: prod-nextcloud-cluster

jobs:
  # ── JOB 1: PHÂN TÍCH TAG & PHÂN LOẠI CHIẾN LƯỢC ────────────────────────────
  classify-tag:
    name: Classify Release Type from Tag
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.classifier.outputs.release_type }}
      image_tag: ${{ steps.classifier.outputs.image_tag }}
    steps:
      - name: Parse Git Tag
        id: classifier
        run: |
          RAW_TAG="${{ inputs.image_tag || github.ref_name }}"
          OVERRIDE="${{ inputs.override_type || 'AUTO' }}"

          echo "Analyzing Tag: $RAW_TAG (Override: $OVERRIDE)"

          if [ "$OVERRIDE" != "AUTO" ] && [ -n "$OVERRIDE" ]; then
            TYPE="$OVERRIDE"
          elif [[ "$RAW_TAG" =~ (patch|hotfix) ]]; then
            TYPE="PATCH"
          elif [[ "$RAW_TAG" =~ (beta|rc|preview) ]]; then
            TYPE="BETA"
          else
            TYPE="BREAKTHROUGH"
          fi

          echo "Detected Release Type: $TYPE"
          echo "release_type=$TYPE" >> $GITHUB_OUTPUT
          echo "image_tag=$RAW_TAG" >> $GITHUB_OUTPUT

  # ── JOB 2: BUILD IMAGE & TẠO AWS SOCI INDEX ────────────────────────────────
  build-and-index:
    name: Build, ECR Push & SOCI Index
    needs: [classify-tag]
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.ecr-publish.outputs.image_uri }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS SOCI CLI (Seekable OCI)
        run: |
          SOCI_VERSION="0.7.0"
          curl -fsSL -o soci.tar.gz "https://github.com/awslabs/soci-snapshotter/releases/download/v${SOCI_VERSION}/soci-snapshotter-${SOCI_VERSION}-linux-amd64.tar.gz"
          sudo tar -C /usr/local/bin -xzf soci.tar.gz soci
          rm -f soci.tar.gz
          soci --version

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::649519997247:role/nextcloud-github-actions-deploy-role' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "${{ env.ECR_REPOSITORY }}" \
              --region "${{ env.AWS_REGION }}" \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Environment,Value=prod Key=ManagedBy,Value=GitHub-Actions

      - name: Build & Push Image
        id: ecr-publish
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ needs.classify-tag.outputs.image_tag }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          echo "Building image: $IMAGE_URI"

          docker build -t "$IMAGE_URI" -f docker/Dockerfile ./docker
          docker push "$IMAGE_URI"

          echo "⚡ Generating AWS SOCI Index for Fargate lazy-loading..."
          soci create "$IMAGE_URI"
          soci push "$IMAGE_URI"
          echo "✅ SOCI Index pushed to ECR!"

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  # ── JOB 3A: ROLLOUT BẢN VÁ LỖI (PATCH) ─────────────────────────────────────
  rollout-patch:
    name: Fast-Track Rollout (100% Fleet)
    needs: [classify-tag, build-and-index]
    if: needs.classify-tag.outputs.release_type == 'PATCH'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::649519997247:role/nextcloud-github-actions-deploy-role' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Fast-Track Fleet Rollout
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python3 scripts/rollout_tenant_image.py \
            --image "${{ needs.build-and-index.outputs.image_uri }}" \
            --type "PATCH" \
            --concurrency 15 \
            --soak 60 \
            --actor "GitHubActions:${{ github.actor }}" \
            $DRY_RUN_FLAG

  # ── JOB 3B: ROLLOUT BẢN BETA (CHỈ RING 1) ──────────────────────────────────
  rollout-beta:
    name: Selective Beta Rollout (Ring 0 & Ring 1 Only)
    needs: [classify-tag, build-and-index]
    if: needs.classify-tag.outputs.release_type == 'BETA'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::649519997247:role/nextcloud-github-actions-deploy-role' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Beta Rollout
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python3 scripts/rollout_tenant_image.py \
            --image "${{ needs.build-and-index.outputs.image_uri }}" \
            --type "BETA" \
            --concurrency 10 \
            --actor "GitHubActions:${{ github.actor }}" \
            $DRY_RUN_FLAG

  # ── JOB 3C: ROLLOUT BẢN ĐỘT PHÁ - STAGE 1 (CANARY & BETA) ─────────────────
  rollout-breakthrough-canary:
    name: Breakthrough Stage 1 - Backup & Beta Phase
    needs: [classify-tag, build-and-index]
    if: needs.classify-tag.outputs.release_type == 'BREAKTHROUGH'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::649519997247:role/nextcloud-github-actions-deploy-role' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Stage 1 (Auto RDS Snapshot + Canary + Beta)
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python3 scripts/rollout_tenant_image.py \
            --image "${{ needs.build-and-index.outputs.image_uri }}" \
            --type "BREAKTHROUGH" \
            --stage "CANARY_AND_BETA" \
            --auto-snapshot-db \
            --actor "GitHubActions:${{ github.actor }}" \
            $DRY_RUN_FLAG

  # ── JOB 3D: ROLLOUT BẢN ĐỘT PHÁ - STAGE 2 (VIP TENANTS - MANUAL APPROVAL) ──
  rollout-breakthrough-vip:
    name: Breakthrough Stage 2 - VIP Tenants (Manual Approval Required)
    needs: [classify-tag, build-and-index, rollout-breakthrough-canary]
    if: needs.classify-tag.outputs.release_type == 'BREAKTHROUGH'
    runs-on: ubuntu-latest
    environment:
      name: production-vip-maintenance # Requires approval in GitHub repository settings
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::649519997247:role/nextcloud-github-actions-deploy-role' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Stage 2 (Deploy Ring 2 VIP Tenants)
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python3 scripts/rollout_tenant_image.py \
            --image "${{ needs.build-and-index.outputs.image_uri }}" \
            --type "BREAKTHROUGH" \
            --stage "VIP_ONLY" \
            --actor "GitHubActions:${{ github.actor }}" \
            $DRY_RUN_FLAG
