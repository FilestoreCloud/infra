name: Debug Logs
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Diagnose and Fix RDS Password
        run: |
          echo "=== 1. Checking Database Secret in Secrets Manager ==="
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "/nextcloud/prod/secrets/db-credentials" --query "SecretString" --output text)
          DB_PASS=$(echo "$SECRET_JSON" | jq -r .password)
          DB_USER=$(echo "$SECRET_JSON" | jq -r .username)
          DB_HOST=$(aws rds describe-db-instances --db-instance-identifier prod-nextcloud-db --query "DBInstances[0].Endpoint.Address" --output text)
          echo "DB Host: $DB_HOST, User: $DB_USER, Password Length: ${#DB_PASS}"

          echo "=== 2. Aligning RDS Master User Password with Secrets Manager ==="
          aws rds modify-db-instance \
            --db-instance-identifier prod-nextcloud-db \
            --master-user-password "$DB_PASS" \
            --apply-immediately
          echo "✓ RDS modify-db-instance initiated with apply-immediately."

          echo "=== 3. Restarting ECS Service Tasks to Pick Up Fresh Connection ==="
          aws rds wait db-instance-available --db-instance-identifier prod-nextcloud-db || true
          aws ecs update-service \
            --cluster prod-nextcloud-cluster \
            --service prod-nextcloud-service \
            --force-new-deployment
          echo "✓ ECS service force-new-deployment triggered."

          echo "=== 4. Watching ECS service rollout ==="
          aws ecs wait services-stable \
            --cluster prod-nextcloud-cluster \
            --services prod-nextcloud-service || true
          echo "✓ ECS service rollout complete."
