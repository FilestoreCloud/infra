name: Debug Logs
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Sync Password into EFS config.php and Restart ECS
        run: |
          echo "=== 1. Discovering Networking Resources ==="
          SUBNET=$(aws cloudformation describe-stacks --stack-name prod-nextcloud-01-networking --query "Stacks[0].Outputs[?OutputKey=='PublicSubnet1Id'].OutputValue" --output text)
          SG=$(aws cloudformation describe-stacks --stack-name prod-nextcloud-02-security --query "Stacks[0].Outputs[?OutputKey=='ECSSecurityGroupId'].OutputValue" --output text)
          echo "Subnet: $SUBNET, SG: $SG"

          echo "=== 2. Running One-Off Fargate Task to Allow Clean Automated Nextcloud Installation ==="
          python3 -c '
          import json
          cmd = ["sh", "-c", "rm -f /var/www/html/config/config.php /var/www/html/version.php; touch /var/www/html/config/CAN_INSTALL; echo CAN_INSTALL_READY"]
          payload = {"containerOverrides": [{"name": "nextcloud", "command": cmd}]}
          with open("overrides.json", "w") as f:
              json.dump(payload, f)
          '

          TASK_ARN=$(aws ecs run-task \
            --cluster prod-nextcloud-cluster \
            --task-definition prod-nextcloud-app \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides file://overrides.json \
            --query "tasks[0].taskArn" --output text)

          echo "Launched task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster prod-nextcloud-cluster --tasks "$TASK_ARN"
          echo "Task completed."

          echo "=== 3. Restarting ECS Service for Clean Automated Provisioning ==="
          aws ecs update-service \
            --cluster prod-nextcloud-cluster \
            --service prod-nextcloud-service \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster prod-nextcloud-cluster \
            --services prod-nextcloud-service
          echo "=== ECS Service is Stable and Healthy ==="
