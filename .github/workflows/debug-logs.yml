name: Debug Logs
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Sync Password into EFS config.php and Restart ECS
        run: |
          echo "=== 1. Discovering Networking Resources ==="
          SUBNET=$(aws cloudformation describe-stacks --stack-name prod-nextcloud-01-networking --query "Stacks[0].Outputs[?OutputKey=='PublicSubnet1Id'].OutputValue" --output text)
          SG=$(aws cloudformation describe-stacks --stack-name prod-nextcloud-02-security --query "Stacks[0].Outputs[?OutputKey=='ECSSecurityGroupId'].OutputValue" --output text)
          echo "Subnet: $SUBNET, SG: $SG"

          echo "=== 2. Running Automated Nextcloud Installation via occ ==="
          cat << 'EOF' > generate_overrides.py
import json

php_code = (
    'try { '
    '$pdo = new PDO("pgsql:host=" . getenv("POSTGRES_HOST") . ";dbname=" . getenv("POSTGRES_DB"), getenv("POSTGRES_USER"), getenv("POSTGRES_PASSWORD")); '
    '$u = getenv("POSTGRES_USER"); '
    '$pdo->exec("DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO \"$u\"; GRANT ALL ON SCHEMA public TO public;"); '
    'echo "DB_CLEANED_SUCCESS\n"; '
    '} catch (Exception $e) { '
    'echo "DB_CLEAN_ERR: " . $e->getMessage() . "\n"; '
    '}'
)

cmd = [
    "sh", "-c",
    f"php -r '{php_code}' && "
    "cp -p /usr/src/nextcloud/version.php /var/www/html/version.php && "
    "runuser -u www-data -- php /var/www/html/occ maintenance:install "
    "--database pgsql "
    "--database-host \"$POSTGRES_HOST\" "
    "--database-name \"$POSTGRES_DB\" "
    "--database-user \"$POSTGRES_USER\" "
    "--database-pass \"$POSTGRES_PASSWORD\" "
    "--admin-user \"$NEXTCLOUD_ADMIN_USER\" "
    "--admin-pass \"$NEXTCLOUD_ADMIN_PASSWORD\" "
    "--data-dir /var/www/html/data && "
    "runuser -u www-data -- php /var/www/html/occ config:system:set trusted_domains 0 --value=localhost && "
    "runuser -u www-data -- php /var/www/html/occ config:system:set trusted_domains 1 --value=127.0.0.1 && "
    "runuser -u www-data -- php /var/www/html/occ config:system:set trusted_domains 2 --value=dev-tenant.png261.dev && "
    "runuser -u www-data -- php /var/www/html/occ config:system:set trusted_domains 3 --value=\"*.png261.dev\" && "
    "echo NEXTCLOUD_INSTALLED_SUCCESSFULLY"
]

payload = {"containerOverrides": [{"name": "nextcloud", "command": cmd}]}
with open("overrides.json", "w") as f:
    json.dump(payload, f)
EOF
          python3 generate_overrides.py

          TASK_ARN=$(aws ecs run-task \
            --cluster prod-nextcloud-cluster \
            --task-definition prod-nextcloud-app \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides file://overrides.json \
            --query "tasks[0].taskArn" --output text)

          echo "Launched install task: $TASK_ARN"
          TASK_ID=$(echo "$TASK_ARN" | awk -F'/' '{print $NF}')
          aws ecs wait tasks-stopped --cluster prod-nextcloud-cluster --tasks "$TASK_ARN"
          echo "Installation task completed."

          echo "=== Task Details and Exit Code ==="
          aws ecs describe-tasks --cluster prod-nextcloud-cluster --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].{ExitCode:exitCode,Reason:reason}" --output table || :

          echo "=== Task CloudWatch Logs ==="
          aws logs get-log-events \
            --log-group-name /ecs/prod-nextcloud \
            --log-stream-name "nextcloud/nextcloud/$TASK_ID" \
            --limit 100 \
            --query "events[*].message" --output text || :

          echo "=== Check Previous Task Logs (a0ab27ef9f064f8a902667457e3ba415) ==="
          aws logs get-log-events \
            --log-group-name /ecs/prod-nextcloud \
            --log-stream-name "nextcloud/nextcloud/a0ab27ef9f064f8a902667457e3ba415" \
            --limit 100 \
            --query "events[*].message" --output text || :

          echo "=== 3. Restarting ECS Service ==="
          aws ecs update-service \
            --cluster prod-nextcloud-cluster \
            --service prod-nextcloud-service \
            --force-new-deployment
