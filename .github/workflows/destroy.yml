name: Destroy Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment to Destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      scope:
        description: "Scope of Destruction"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - 06-control-plane
          - 05-compute
          - 04-database
          - 03-storage
          - 02-security
          - 01-networking
      confirmation:
        description: "Safety Confirmation: Type DESTROY to proceed"
        required: true
        default: ""
        type: string

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read # Required for repository checkout

concurrency:
  group: destroy-infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy Infrastructure Stacks
    runs-on: ubuntu-latest
    steps:
      - name: Verify Safety Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "❌ Destruction aborted: You must type 'DESTROY' in the confirmation input to prevent accidental teardown."
            exit 1
          fi
          echo "⚠️ Confirmation verified. Proceeding with destruction of ${{ inputs.environment }} (scope: ${{ inputs.scope }})..."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Connected to AWS Account ID: ${{ steps.aws-creds.outputs.aws-account-id }}"

      - name: Destroy 06-Control-Plane
        if: inputs.scope == 'all' || inputs.scope == '06-control-plane'
        uses: go-to-k/delstack-action@v1
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-06-control-plane
          region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Destroy 05-Compute
        if: inputs.scope == 'all' || inputs.scope == '05-compute'
        uses: go-to-k/delstack-action@v1
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-05-compute
          region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Destroy 04-Database
        if: inputs.scope == 'all' || inputs.scope == '04-database'
        uses: go-to-k/delstack-action@v1
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-04-database
          region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Destroy 03-Storage
        if: inputs.scope == 'all' || inputs.scope == '03-storage'
        uses: go-to-k/delstack-action@v1
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-03-storage
          region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Destroy 02-Security
        if: inputs.scope == 'all' || inputs.scope == '02-security'
        uses: go-to-k/delstack-action@v1
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-02-security
          region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Destroy 01-Networking
        if: inputs.scope == 'all' || inputs.scope == '01-networking'
        uses: go-to-k/delstack-action@v1
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-01-networking
          region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Destruction Summary
        run: |
          echo "============================================================"
          echo "🎉 Infrastructure destruction completed successfully!"
          echo "Environment : ${{ inputs.environment }}"
          echo "Scope       : ${{ inputs.scope }}"
          echo "============================================================"
