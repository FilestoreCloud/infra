name: Destroy (Infrastructure & Data Teardown)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment to Destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm_destruction:
        description: "Type 'DESTROY' to confirm complete teardown"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: destroy-${{ github.ref_name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Zero-Cost Teardown (Native GitHub Actions)
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm_destruction == 'DESTROY' }}
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Checkout Infra Repository
        uses: actions/checkout@v4

      - name: Cleanup Cloudflare DNS Records
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -m pip install boto3 requests
          python3 scripts/manage_dns.py clean --env "${{ inputs.environment }}" --zone png261.dev

      - name: Destroy 07-Observability
        continue-on-error: true
        uses: go-to-k/delstack@main
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-07-observability
          region: ${{ vars.AWS_REGION }}
          force: true

      - name: Destroy 06-SuperAdmin
        continue-on-error: true
        uses: go-to-k/delstack@main
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-06-superadmin
          region: ${{ vars.AWS_REGION }}
          force: true

      - name: Pre-cleanup ECS Tasks and Cluster
        continue-on-error: true
        run: |
          CLUSTER="${{ inputs.environment }}-nextcloud-cluster"
          SERVICE="${{ inputs.environment }}-nextcloud-service"
          echo "Scaling down and deleting ECS service: $SERVICE"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --desired-count 0 || true
          aws ecs delete-service --cluster "$CLUSTER" --service "$SERVICE" --force || true

          echo "Stopping any remaining running tasks..."
          TASKS=$(aws ecs list-tasks --cluster "$CLUSTER" --query "taskArns[]" --output text 2>/dev/null || true)
          for t in $TASKS; do
            if [ -n "$t" ] && [ "$t" != "None" ]; then
              aws ecs stop-task --cluster "$CLUSTER" --task "$t" || true
            fi
          done

          # If 05-Compute is in DELETE_FAILED due to ECSCluster, delete with retain-resources
          STATUS=$(aws cloudformation describe-stacks --stack-name "${{ inputs.environment }}-nextcloud-05-compute" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STATUS" = "DELETE_FAILED" ]; then
            echo "05-Compute in DELETE_FAILED. Deleting with --retain-resources ECSCluster..."
            aws cloudformation delete-stack --stack-name "${{ inputs.environment }}-nextcloud-05-compute" --retain-resources ECSCluster || true
            aws cloudformation wait stack-delete-complete --stack-name "${{ inputs.environment }}-nextcloud-05-compute" || true
            aws ecs delete-cluster --cluster "$CLUSTER" || true
          fi

      - name: Destroy 05-Compute
        continue-on-error: true
        uses: go-to-k/delstack@main
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-05-compute
          region: ${{ vars.AWS_REGION }}
          force: true

      - name: Fallback Cleanup for 05-Compute if DELETE_FAILED
        continue-on-error: true
        run: |
          CLUSTER="${{ inputs.environment }}-nextcloud-cluster"
          STATUS=$(aws cloudformation describe-stacks --stack-name "${{ inputs.environment }}-nextcloud-05-compute" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STATUS" = "DELETE_FAILED" ]; then
            echo "05-Compute in DELETE_FAILED. Retrying delete with --retain-resources ECSCluster..."
            aws cloudformation delete-stack --stack-name "${{ inputs.environment }}-nextcloud-05-compute" --retain-resources ECSCluster || true
            aws cloudformation wait stack-delete-complete --stack-name "${{ inputs.environment }}-nextcloud-05-compute" || true
            aws ecs delete-cluster --cluster "$CLUSTER" || true
          fi

      - name: Destroy 05-OpenSearch
        continue-on-error: true
        uses: go-to-k/delstack@main
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-05-opensearch
          region: ${{ vars.AWS_REGION }}
          force: true

      - name: Destroy 04-Database
        continue-on-error: true
        uses: go-to-k/delstack@main
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-04-database
          region: ${{ vars.AWS_REGION }}
          force: true

      - name: Destroy 03-Storage
        continue-on-error: true
        uses: go-to-k/delstack@main
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-03-storage
          region: ${{ vars.AWS_REGION }}
          force: true

      - name: Destroy 02-Security
        continue-on-error: true
        uses: go-to-k/delstack@main
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-02-security
          region: ${{ vars.AWS_REGION }}
          force: true

      - name: Destroy 01-Networking
        continue-on-error: true
        uses: go-to-k/delstack@main
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-01-networking
          region: ${{ vars.AWS_REGION }}
          force: true

      - name: Teardown Verification & Remaining Stacks Sweep
        run: |
          echo "Verifying all CloudFormation stacks for ${{ inputs.environment }} are deleted..."
          STACKS=$(aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE DELETE_FAILED \
            --query "StackSummaries[?starts_with(StackName, '${{ inputs.environment }}-nextcloud-')].StackName" --output text)
          
          if [ -n "$STACKS" ]; then
            echo "Found remaining stacks: $STACKS"
            for s in $STACKS; do
              echo "Retrying delete for stack: $s"
              aws cloudformation delete-stack --stack-name "$s" || true
            done
            for s in $STACKS; do
              aws cloudformation wait stack-delete-complete --stack-name "$s" || true
            done
          fi
          echo "All stacks successfully torn down."
