name: Destroy (Infrastructure & Data Teardown)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment to Destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm_destruction:
        description: "Type 'DESTROY' to confirm complete teardown"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: destroy-${{ github.ref_name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Zero-Cost Teardown (Native GitHub Actions)
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm_destruction == 'DESTROY' }}
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Destroy All Infrastructure Stacks
        uses: go-to-k/delstack@main
        with:
          stack-name: ${{ inputs.environment }}-nextcloud-07-observability,${{ inputs.environment }}-nextcloud-06-superadmin,${{ inputs.environment }}-nextcloud-05-compute,${{ inputs.environment }}-nextcloud-04-database,${{ inputs.environment }}-nextcloud-03-storage,${{ inputs.environment }}-nextcloud-02-security,${{ inputs.environment }}-nextcloud-01-networking
          region: ${{ vars.AWS_REGION }}
          force: true
