name: Destroy (Infrastructure & Data Teardown)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment to Destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm_destruction:
        description: "Type 'DESTROY' to confirm complete teardown"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: destroy-${{ github.ref_name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Zero-Cost Teardown (Native GitHub Actions)
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm_destruction == 'DESTROY' }}
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Checkout Infra Repository
        uses: actions/checkout@v4

      - name: Cleanup Cloudflare DNS Records
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -m pip install boto3 requests
          python3 scripts/manage_dns.py clean --env "${{ inputs.environment }}" --zone png261.dev

      - name: Native Zero-Cost Platform Teardown
        run: |
          python3 -m pip install boto3
          python3 scripts/teardown_platform.py --env "${{ inputs.environment }}" --region "${{ vars.AWS_REGION }}"
